name: Deploy to Pages

# Two jobs on purpose. With upload and deploy in one job, pressing "Re-run
# failed jobs" runs the upload again inside the same run, and a second
# artifact called github-pages appears. deploy-pages then refuses, because it
# cannot tell which one you meant. Split like this, a retry re-runs only the
# deploy, so the artifact count stays at one.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tells Pages not to run the files through Jekyll, which is a site
      # generator this project does not use
      - run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4