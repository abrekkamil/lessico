<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<title>Lessico Drill</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --bg:#15171c; --surface:#1e2128; --surface2:#262a33; --border:#333844;
    --text:#ecebe8; --muted:#98a0ad; --accent:#e0a458; --good:#6fcf97;
    --bad:#eb6f6f; --info:#7aa2f7; --violet:#b48ead; --masc:#7aa2f7; --fem:#e88ba0;
    --serif: "Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px; }
  body { display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #top { display:flex; align-items:center; gap:12px; padding:12px 16px 8px; }
  #top .meta { color:var(--muted); font-size:13px; }
  #bar { flex:1; height:6px; background:var(--surface2); border-radius:3px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:var(--accent); transition:width .2s; }
  #main { flex:1; overflow-y:auto; padding:8px 16px 4px; -webkit-overflow-scrolling:touch; }
  #foot { padding:10px 16px calc(12px + env(safe-area-inset-bottom));
          display:flex; gap:10px; align-items:center; flex-wrap:wrap;
          border-top:1px solid var(--border); background:var(--bg); }
  button { font:inherit; color:var(--text); background:var(--surface2);
    border:1px solid var(--border); border-radius:11px; padding:13px 16px;
    min-height:48px; cursor:pointer; }
  button:active { background:var(--border); }
  button.primary { background:var(--accent); color:#15171c; border-color:var(--accent);
                   font-weight:600; }
  button.ghost { background:transparent; border-color:transparent; color:var(--muted);
                 text-decoration:underline; padding:13px 8px; }
  button:disabled { opacity:.4; }
  button.grow { flex:1; }
  input, textarea { font:inherit; width:100%; color:var(--text);
    background:var(--surface2); border:1px solid var(--border); border-radius:11px;
    padding:14px; min-height:52px; }
  input:focus, textarea:focus { outline:none; border-color:var(--accent); }
  .prompt { font-family:var(--serif); font-size:clamp(30px,9vw,44px); text-align:center;
            line-height:1.15; margin:22px 0 6px; }
  .sub { color:var(--muted); text-align:center; font-size:14px; margin-bottom:14px; }
  .sentence { font-family:var(--serif); font-size:clamp(19px,5.4vw,25px); line-height:1.5; }
  .muted { color:var(--muted); font-size:14px; line-height:1.5; }
  .accent { color:var(--accent); }
  .good { color:var(--good); } .bad { color:var(--bad); }
  .slot { border:1px dashed var(--border); border-radius:10px; padding:13px;
          text-align:center; margin-bottom:8px; color:var(--muted); letter-spacing:3px; }
  .slot.filled { border-style:solid; border-color:var(--good); color:var(--text);
                 letter-spacing:normal; }
  .slot.missed { border-style:solid; border-color:var(--bad); color:var(--bad);
                 letter-spacing:normal; }
  .shape { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:21px;
           letter-spacing:3px; text-align:center; margin:10px 0; }
  .card { background:var(--surface); border:1px solid var(--border);
          border-radius:16px; padding:16px; margin-bottom:12px; }
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .tile { background:var(--surface); border:1px solid var(--border);
          border-radius:14px; padding:14px; }
  .tile b { display:block; font-size:27px; font-weight:600; }
  .tile span { color:var(--muted); font-size:13px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  h1 { font-family:var(--serif); font-size:26px; margin:6px 0 2px; font-weight:600; }
  h2 { font-size:16px; margin:16px 0 8px; }
  a { color:var(--accent); }
  .hidden { display:none !important; }
</style>
</head>
<body>

<div id="top">
  <span class="meta" id="counter"></span>
  <span id="bar"><i></i></span>
  <button class="ghost" id="quit" style="padding:6px 8px;min-height:0">Close</button>
</div>

<div id="main"></div>

<div id="foot"></div>

<script>
"use strict";

/* ---------------------------------------------------------------- storage
   IndexedDB holds the collection so it survives being closed and works with
   no signal. One record per card, keyed by the word itself, which is also
   how the desktop keys its sync file. */
const DB_NAME = "lessico", STORE = "state";
let idb = null;

function openDB() {
  return new Promise((ok, fail) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => { idb = req.result; ok(idb); };
    req.onerror = () => fail(req.error);
  });
}
function idbGet(key) {
  return new Promise((ok, fail) => {
    const r = idb.transaction(STORE, "readonly").objectStore(STORE).get(key);
    r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
  });
}
function idbSet(key, value) {
  return new Promise((ok, fail) => {
    const tx = idb.transaction(STORE, "readwrite");
    tx.objectStore(STORE).put(value, key);
    tx.oncomplete = () => ok(); tx.onerror = () => fail(tx.error);
  });
}
function idbDelete(key) {
  return new Promise((ok, fail) => {
    const tx = idb.transaction(STORE, "readwrite");
    tx.objectStore(STORE).delete(key);
    tx.oncomplete = () => ok(); tx.onerror = () => fail(tx.error);
  });
}
function idbKeys() {
  return new Promise((ok, fail) => {
    const r = idb.transaction(STORE, "readonly").objectStore(STORE).getAllKeys();
    r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
  });
}

/* ------------------------------------------------------------------ state */
let state = null;          // { language, cards: [...], reviews: [...] }
let queue = [], index = 0, results = null, filter = null;

/* Dates are local, matching the desktop, because a due date is about your
   day rather than about UTC. Only the sync stamps are UTC, since those are
   compared between devices. */
function localDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${
    String(d.getDate()).padStart(2, "0")}`;
}
const todayStr = () => localDate(new Date());
const nowStr = () => new Date().toISOString().slice(0, 23);   // UTC, for sync
const plusDays = n => localDate(new Date(Date.now() + n * 864e5));

/* One record per collection, so studying Turkish cannot disturb Italian.
   The key is fixed (`id`) once a collection has words, so editing its sync
   name can never re-file it on top of another one. */
function stateKey(s) {
  if (!s) return "collection:default";
  return s.id ||
    "collection:" + ((s.cloud && s.cloud.collection) || s.language || "default");
}

/* Saves one collection under its own key. A sync or an import can still be
   finishing on a collection after you have switched away from it, so the
   collection is passed in rather than read from `state` at the end. */
async function save(s) {
  s = s || state;
  if (!s) return;
  const hasWords = (s.cards || []).length > 0;
  let key = stateKey(s);
  if (!s.id || !hasWords) {
    const there = await idbGet(key);
    const taken = there && (there.cards || []).length > 0;
    // an empty collection never replaces one that has words
    if (taken && !hasWords) return;
    // and a new one never lands on an old one's key
    if (taken) key += "~" + Date.now().toString(36);
    if (hasWords) s.id = key;
  }
  s.saved_at = nowStr();
  await idbSet(key, s);
  if (s === state) {
    await idbSet("last_open", key);
    await idbSet("collection", s);            // read by older builds
  }
}

/* Every collection kept on this phone that has words in it. */
async function storedCollections() {
  const out = [];
  for (const key of await idbKeys()) {
    if (typeof key !== "string" || !key.startsWith("collection:")) continue;
    const live = state && state.cards.length && key === stateKey(state);
    const s = live ? state : await idbGet(key);
    if (s && (s.cards || []).length) {
      s.id = key;
      if (!s.reviews) s.reviews = [];
      out.push({ key, s });
    }
  }
  return out;
}

/* ------------------------------------------------------- the same ladder
   These constants mirror the desktop app. If one changes, both change. */
const LEVEL2_TOP = 6, LETTER_LIMIT = 3, WRONG_LIMIT = 3, MARK_LIMIT = 3;
const BOX_NAME = {
  1: "the word, native \u2192 English", 2: "the word, English \u2192 native",
  3: "sentence gap, with the translation", 4: "sentence gap, without the translation",
  5: "translate the sentence into English", 6: "translate the sentence into native"
};
const INTERVALS = [0, 1, 2, 4, 8, 16, 32];

// the desktop's rule, exactly: suspended and mastered cards are not "due",
// and a card with no date at all is not due either
function due(card) {
  return !card.suspended && (card.stage ?? 1) < 4 && !!card.due &&
         card.due <= todayStr();
}
function mbox(card) { return Math.min(Math.max(card.mbox || 1, 1), LEVEL2_TOP); }

function modeFor(card) {
  if (!card.stage) return "triage";       // stage 0: not placed yet
  if (card.stage === 1) return (card.flags & 1) ? "flash_en_it" : "flash_it_en";
  if (card.stage === 3) return "produce";
  if (card.stage >= 4) return "spot";
  const box = mbox(card);
  if (box === 1) return "meanings";
  if (box === 2) return "reverse";
  if (box === 3) return "cloze";
  if (box === 4) return "cloze_blind";
  return box === 5 ? "translate_out" : "translate_in";
}

/* Where an answer sends the card. Returns the wording as well, so the screen
   and the schedule can never disagree. */
function planLevel2(card, letters, opts) {
  opts = opts || {};
  const box = mbox(card);
  if (opts.partial && letters < LETTER_LIMIT && !opts.gaveUp) {
    const marks = (card.marks || 0) + 1;
    if (marks >= MARK_LIMIT)
      return [{ stage: 1, box: 5, mbox: 1, marks: 0, flags: 0, due: todayStr(),
                lapses: (card.lapses || 0) + 1 },
              `Back to flashcards at box 5: ${MARK_LIMIT} times now with a meaning missing.`];
    if (box > 1)
      return [{ mbox: 1, marks, due: plusDays(1) },
              `A meaning was missing, so back to box 1 of ${LEVEL2_TOP}. Mark ${marks} of ${MARK_LIMIT}.`];
    return [{ marks, due: plusDays(1) },
            `A meaning was missing, so box 1 again. Mark ${marks} of ${MARK_LIMIT}.`];
  }
  if (opts.gaveUp || opts.wrong || letters >= LETTER_LIMIT) {
    const why = opts.reason || (opts.gaveUp ? "you asked for the answer"
      : letters >= LETTER_LIMIT ? `${letters} letters were needed` : "that was not right");
    const marks = (card.marks || 0) + 1;
    if (box > 2 && marks < MARK_LIMIT)
      return [{ mbox: 1, marks, lapses: (card.lapses || 0) + 1, due: plusDays(1) },
              `Back to box 1 of ${LEVEL2_TOP}: ${why}. Mark ${marks} of ${MARK_LIMIT}.`];
    return [{ stage: 1, box: 5, mbox: 1, marks: 0, flags: 0,
              lapses: (card.lapses || 0) + 1, due: todayStr() },
            `Back to flashcards at box 5: ${why}.`];
  }
  if (letters)
    return [{ due: plusDays(1) },
            `Stays at box ${box} of ${LEVEL2_TOP}: correct, but ${letters} letter${letters > 1 ? "s" : ""} of help.`];
  if (box >= LEVEL2_TOP)
    return [{ stage: 3, mbox: LEVEL2_TOP, marks: 0, due: plusDays(1) },
            "Every box of level 2 cleared with no help: on to free writing."];
  const step = INTERVALS[Math.min(box, INTERVALS.length - 1)] || 1;
  return [{ mbox: box + 1, marks: 0, due: plusDays(step) },
          `No help needed: box ${box} \u2192 ${box + 1}, ${BOX_NAME[box + 1]}.`];
}

function applyLevel2(card, letters, opts) {
  const [fields, message] = planLevel2(card, letters, opts);
  // logged before the move, so the log names the exercise that was answered
  // rather than the one the card goes on to
  logReview(card, modeFor(card), !(opts && (opts.wrong || opts.gaveUp)) && !letters);
  Object.assign(card, fields);
  card.updated_at = nowStr();
  return message;
}

/* Sorting: the learner says what they already know, and the choice is made
   before the meaning appears, because judging afterwards is not judging. */
function gradeTriage(card, verdict) {
  card.updated_at = nowStr();
  logReview(card, "triage", verdict !== "new");
  if (verdict === "knew") {
    Object.assign(card, { stage: 2, mbox: 1, box: 5, flags: 0, due: todayStr() });
    return "Known: straight to level 2, the meanings box.";
  }
  if (verdict === "hinted") {
    Object.assign(card, { stage: 1, box: 5, flags: 0, due: todayStr() });
    return "Nearly known: flashcards at box 5.";
  }
  Object.assign(card, { stage: 1, box: 1, flags: 0, due: todayStr() });
  return "New to you: flashcards from box 1.";
}

function gradeFlash(card, correct) {
  const boxes = 7;
  card.updated_at = nowStr();
  logReview(card, modeFor(card), correct);
  if (!correct) {
    card.flags = 0; card.box = 1; card.due = todayStr();
    card.lapses = (card.lapses || 0) + 1;
    return "Back to box 1.";
  }
  const bit = modeFor(card) === "flash_it_en" ? 1 : 2;
  const flags = (card.flags || 0) | bit;
  if (flags !== 3) {
    card.flags = flags; card.due = plusDays(1);
    return "Correct. The other direction comes back tomorrow.";
  }
  card.flags = 0;
  if (card.box >= boxes) {
    card.stage = 2; card.mbox = 1; card.due = plusDays(1);
    return "Box 7 cleared in both directions: on to level 2.";
  }
  card.box = (card.box || 1) + 1;
  const step = INTERVALS[Math.min(card.box, INTERVALS.length - 1)] || 1;
  card.due = plusDays(step);
  return `Box ${card.box - 1} \u2192 ${card.box}, back in ${step} day(s).`;
}

function logReview(card, mode, correct) {
  state.reviews.push([card.w, nowStr(), card.stage, mode, correct ? "correct" : "wrong"]);
  if (state.reviews.length > 4000) state.reviews.splice(0, state.reviews.length - 4000);
  // The card keeps its own tally too, as the desktop's does. Sorting is left
  // out there, being a placement rather than a review. These counts travel
  // with the card, so leaving them at zero here reset the desktop's, and
  // made every card studied only on the phone look brand new to the queue.
  if (mode !== "triage") {
    card.reviews = (card.reviews || 0) + 1;
    if (correct) card.correct = (card.correct || 0) + 1;
  }
}

/* --------------------------------------------------------------- matching */
const ARTICLES = new Set(["a", "an", "the", "to", "some"]);
// the same stop list the desktop uses, so 'switch' answers 'to switch on'
const STOP = new Set(["the","a","an","of","to","in","on","at","is","are","am",
  "do","does","did","it","this","that","and","or","for","with","my","your",
  "his","her","their","our","i","you","he","she","we","they","be","have",
  "has","had","will","would","not","no","s","t","m","re","ve","ll"]);
/* Lower case, accents off, punctuation out. Letters of every alphabet are
   kept: this used to keep a-z only, which turned Turkish 'k\u0131rm\u0131z\u0131' into
   'k rm z' and a Russian word into nothing at all, so any answer matched it.
   Letters with no accent to strip are folded by hand, so 'kirmizi' is as
   acceptable for 'k\u0131rm\u0131z\u0131' as 'sehir' already was for '\u015fehir'. */
const FOLD = { "\u0131": "i", "\u0142": "l", "\u00f8": "o", "\u0111": "d" };
const norm = s => (s || "").toLowerCase().replace(/[\u0131\u0142\u00f8\u0111]/g, c => FOLD[c])
  .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^\p{L}\p{M}' ]/gu, " ").trim().replace(/\s+/g, " ");

function glossKey(text) {
  const words = norm((text || "").replace(/\([^)]*\)/g, " ")).split(" ").filter(Boolean);
  const trimmed = words.slice();
  while (trimmed.length && ARTICLES.has(trimmed[0])) trimmed.shift();
  return (trimmed.length ? trimmed : words).join(" ");
}
function contentWords(text) {
  return new Set(norm(text).split(" ").filter(w => w && !STOP.has(w)));
}
function ratio(a, b) {                       // Dice coefficient on bigrams
  if (a === b) return 1;
  if (a.length < 2 || b.length < 2) return a === b ? 1 : 0;
  const grams = new Map();
  for (let i = 0; i < a.length - 1; i++) {
    const g = a.slice(i, i + 2); grams.set(g, (grams.get(g) || 0) + 1);
  }
  let hits = 0;
  for (let i = 0; i < b.length - 1; i++) {
    const g = b.slice(i, i + 2), n = grams.get(g) || 0;
    if (n > 0) { hits++; grams.set(g, n - 1); }
  }
  return (2 * hits) / (a.length + b.length - 2);
}
function variants(gloss) {
  if (!gloss.includes("/")) return [gloss];
  const [head, tail] = gloss.split("/", 2);
  const parts = tail.trim().split(" ");
  const suffix = parts.slice(1).join(" ");
  return [`${head.trim()} ${suffix}`.trim(), `${parts[0]} ${suffix}`.trim(), gloss];
}
/* returns { hit, near, partial } */
function matchGloss(typed, glosses) {
  const key = glossKey(typed);
  if (!key) return {};
  let best = null, bestScore = 0, partial = null;
  for (const gloss of glosses) {
    for (const v of variants(gloss)) {
      const target = glossKey(v);
      if (!target) continue;
      if (key === target) return { hit: gloss };
      // everything the meaning carries has to be there, and grammatical
      // filler does not count: 'switch' answers 'to switch on', but
      // 'railway' does not answer 'railway track'
      const mine = contentWords(typed), theirs = contentWords(v);
      if (theirs.size && [...theirs].every(w => mine.has(w))) return { hit: gloss };
      if (mine.size && [...mine].every(w => theirs.has(w))) {
        partial = partial || gloss; continue;
      }
      const score = ratio(key, target);
      if (score > bestScore) { best = gloss; bestScore = score; }
    }
  }
  if (bestScore >= 0.82) return { hit: best };
  if (partial) return { partial };
  if (bestScore >= 0.62) return { near: best };
  return {};
}
function closeness(typed, targets) {
  let score = 0;
  for (const t of targets) {
    let a = glossKey(typed), b = glossKey(t);
    if (!a || !b) { a = (typed || "").trim().toLowerCase(); b = (t || "").trim().toLowerCase(); }
    score = Math.max(score, ratio(a, b));
  }
  const verdict = score >= 0.8 ? "almost: check the spelling"
    : score >= 0.55 ? "close, but not the word"
    : score >= 0.3 ? "some way off" : "not one of them";
  return { score, verdict };
}
const looseEq = (a, b) => norm(a).replace(/'/g, "") === norm(b).replace(/'/g, "");

/* letters revealed one at a time, the initial first. A letter is any letter
   of any alphabet: \w only knows a-z, so 'à' and 'ı' used to show from the
   start and a Cyrillic word had nothing left to hide. */
const LETTER = /\p{L}/u;
function makeHint(word) {
  let chars = [], shown = new Set(), used = 0;
  function reset(next) {
    word = next || "";
    chars = [...word];                      // by character, not UTF-16 unit
    shown = new Set(); used = 0;
    const free = /^(to|a|an|the)\s+/i.exec(word);
    if (free) for (let i = 0; i < free[0].length; i++) shown.add(i);
  }
  reset(word);
  return {
    reset,
    get word() { return word; },
    get used() { return used; },
    more() {
      const spots = [];
      chars.forEach((ch, i) => { if (LETTER.test(ch) && !shown.has(i)) spots.push(i); });
      if (!spots.length) return false;
      shown.add(used === 0 ? spots[0] : spots[Math.floor(Math.random() * spots.length)]);
      used++; return true;
    },
    pattern() {
      return chars.map((ch, i) => LETTER.test(ch) ? (shown.has(i) ? ch : "_") : ch).join(" ");
    }
  };
}

/* Whether a sentence uses a word: every part of it, allowing a changed
   ending, so 'parlando' counts for 'parlare'. A phrase such as 'fare la
   spesa' is looked for word by word; as one token it could never be found. */
function usesWord(text, word) {
  const tokens = norm(text).split(" ");
  return norm(word).split(" ").filter(Boolean).every(part => {
    const stem = part.slice(0, Math.max(4, part.length - 2));
    return tokens.some(t => t === part || t.startsWith(stem));
  });
}

/* --------------------------------------------------------------- rendering */
const main = document.getElementById("main");
const foot = document.getElementById("foot");
const counter = document.getElementById("counter");
const bar = document.querySelector("#bar i");
const quitBtn = document.getElementById("quit");

function el(tag, cls, html) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html !== undefined) node.innerHTML = html;
  return node;
}
function button(text, cls, fn) {
  const b = el("button", cls, text);
  b.addEventListener("click", fn);
  // buttons are often added to the footer after the first render, so the
  // Enter target is picked up here rather than only in show()
  if ((cls || "").includes("primary")) setTimeout(() => {
    const inFoot = foot.querySelector("button.primary");
    if (inFoot) primaryButton = inFoot;
  }, 0);
  return b;
}
function esc(s) {
  return (s || "").replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
/* The primary button is what Enter presses. Without this every card needs a
   tap even when the answer is already on screen, which is the whole rhythm of
   a session on a phone with a keyboard attached. */
let primaryButton = null;

document.addEventListener("keydown", event => {
  if (event.key !== "Enter" || event.isComposing) return;
  const node = document.activeElement;
  const typing = node && !node.disabled &&
    (node.tagName === "INPUT" || node.tagName === "TEXTAREA");
  if (typing && node.tagName === "TEXTAREA" && !event.ctrlKey && !event.metaKey) return;
  if (typing && node.tagName === "INPUT") return;      // its own handler fires
  if (primaryButton && document.contains(primaryButton)) {
    event.preventDefault();
    primaryButton.click();
  }
});

function show(nodes, buttons) {
  main.innerHTML = ""; foot.innerHTML = "";
  nodes.filter(Boolean).forEach(n => main.appendChild(n));
  (buttons || []).filter(Boolean).forEach(b => foot.appendChild(b));
  primaryButton = foot.querySelector("button.primary");
  main.scrollTop = 0;
}
function setProgress(text, fraction) {
  counter.textContent = text || "";
  bar.style.width = `${Math.round((fraction || 0) * 100)}%`;
}

/* ------------------------------------------------------------------- home */
function counts() {
  const c = { due: 0, s0: 0, s1: 0, s2: 0, s3: 0, mastered: 0,
              sorting: [0, 0], flashcards: [0, 0], meanings: [0, 0],
              gaps: [0, 0], translate: [0, 0], writing: [0, 0] };
  for (const card of state.cards) {
    const isDue = due(card);
    if (isDue) c.due++;
    if (card.suspended) continue;
    if (!card.stage) { c.s0++; c.sorting[0]++; if (isDue) c.sorting[1]++; }
    else if (card.stage === 1) { c.s1++; c.flashcards[0]++; if (isDue) c.flashcards[1]++; }
    else if (card.stage === 2) {
      c.s2++;
      const box = mbox(card);
      const key = box <= 2 ? "meanings" : box <= 4 ? "gaps" : "translate";
      c[key][0]++; if (isDue) c[key][1]++;
    } else if (card.stage === 3) { c.s3++; c.writing[0]++; if (isDue) c.writing[1]++; }
    else c.mastered++;
  }
  return c;
}

/* ---------------------------------------------------------------- session */
function buildQueue(kind) {
  const size = 30, ration = 15;
  let pool = state.cards.filter(c => due(c) && !c.suspended);
  if (kind && kind.sorting) {
    pool = state.cards.filter(c => !c.stage && !c.suspended);
    if (kind.pos) pool = pool.filter(c => (c.spos || "") === kind.pos);
    if (kind.cefr) pool = pool.filter(c => (c.cefr || "") === kind.cefr);
    if (kind.topic) pool = pool.filter(c => (c.topic || "") === kind.topic);
    if (kind.order === "alphabetical")
      pool.sort((a, b) => a.w.localeCompare(b.w));
    else if (kind.order === "random") pool.sort(() => Math.random() - 0.5);
    else pool.sort((a, b) => (a.topic + a.spos + a.w).localeCompare(b.topic + b.spos + b.w));
    return pool.slice(0, 30);
  }
  if (kind === "sorting") pool = pool.filter(c => !c.stage);
  else if (kind === "flashcards") pool = pool.filter(c => c.stage === 1);
  else if (kind === "writing") pool = pool.filter(c => c.stage === 3);
  else if (kind === "meanings") pool = pool.filter(c => c.stage === 2 && mbox(c) <= 2);
  else if (kind === "gaps") pool = pool.filter(c => c.stage === 2 && [3, 4].includes(mbox(c)));
  else if (kind === "translate")
    pool = pool.filter(c => c.stage === 2 && mbox(c) >= 5 &&
      (c.sentences || []).some(s => s.en));
  const seen = pool.filter(c => c.reviews > 0);
  const fresh = pool.filter(c => !c.reviews).sort(() => Math.random() - 0.5).slice(0, ration);
  const all = seen.concat(fresh);
  all.sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
  return all.slice(0, size);
}

function start(kind) {
  filter = kind;
  queue = buildQueue(kind);
  index = 0;
  results = { seen: 0, correct: 0, boxes: 0, levels: 0 };
  quitBtn.classList.remove("hidden");
  if (!queue.length) return summary("Nothing is due");
  next();
}

function advance() { index++; next(); }

function next() {
  if (index >= queue.length) return summary("Session complete");
  const card = queue[index];
  setProgress(`${index + 1} of ${queue.length}`, index / queue.length);
  const mode = modeFor(card);
  if (mode === "triage") return viewTriage(card);
  if (mode === "flash_it_en" || mode === "flash_en_it") return viewFlash(card, mode);
  if (mode === "meanings") return viewMeanings(card);
  if (mode === "reverse") return viewReverse(card);
  if (mode === "cloze" || mode === "cloze_blind")
    return viewCloze(card, mode === "cloze_blind");
  if (mode === "translate_out" || mode === "translate_in")
    return viewTranslate(card, mode === "translate_in");
  return viewProduce(card);
}

function summary(title) {
  setProgress("", 1); quitBtn.classList.add("hidden");
  const box = el("div", "card");
  box.appendChild(el("h1", "", title));
  box.appendChild(el("div", "muted", results && results.seen
    ? `${results.seen} answers \u00b7 ${Math.round(100 * results.correct / results.seen)}% correct \u00b7 ` +
      `${results.boxes} moved up a box \u00b7 ${results.levels} moved up a level.`
    : "Nothing scheduled right now. Come back tomorrow, or sync from the desktop."));
  save();
  autoSync("session end");
  show([box], [button("Back", "primary grow", home)]);
}

function finish(card, message, correct, moved) {
  results.seen++;
  if (correct) results.correct++;
  if (moved === "box") results.boxes++;
  if (moved === "level") results.levels++;
  save();
  advance();
}

function withArticle(card) {
  if (state.language !== "it" || card.spos !== "noun") return esc(card.w);
  const m = /^([a-zA-Zàèéìòù']+)/.exec((card.art || "").trim());
  const art = m ? m[1].toLowerCase() : "";
  if (!["il", "lo", "la", "l'", "i", "gli", "le"].includes(art)) return esc(card.w);
  const colour = art === "la" || art === "le" ? "var(--fem)" : "var(--masc)";
  return `<span style="color:${colour}">${art}</span>${art.endsWith("'") ? "" : " "}${esc(card.w)}`;
}

/* --------------------------------------------------------------- exercises */
function viewTriage(card) {
  let hinted = false, done = false;
  const meta = el("div", "muted", "Sorting \u00b7 do you already know this word?");
  const prompt = el("div", "prompt", withArticle(card));
  const sub = el("div", "sub", esc(card.pos || ""));
  const hintBox = el("div", "sentence");
  hintBox.style.textAlign = "center";
  hintBox.classList.add("hidden");
  const answer = el("div", "card hidden");

  function hintText() {
    const sentence = (card.sentences || []).find(s => s.it);
    if (sentence) return sentence.it;
    if (card.ex) return card.ex;
    if (card.coll) return card.coll;
    // the shape of the English: a nudge, never the meaning itself
    return (card.en || "").split(";")[0].trim().split(" ")
      .map(w => w[0] + " " + "_ ".repeat(Math.max(w.length - 1, 0))).join("  ");
  }
  function decide(verdict) {
    if (done) return;
    done = true;
    if (verdict === "knew" && hinted) verdict = "hinted";
    const message = gradeTriage(card, verdict);
    const outcome = el("div", "muted");
    outcome.style.textAlign = "center";
    outcome.textContent = message;
    answer.innerHTML = `<div class="prompt" style="margin-top:4px">${esc(card.en)}</div>`;
    answer.appendChild(outcome);
    answer.classList.remove("hidden");
    foot.innerHTML = "";
    if (verdict !== "new")
      // thinking you know a word and then reading a different meaning is the
      // commonest way this goes wrong, so the verdict can be taken back
      foot.appendChild(button("Not what I thought", "grow", () => {
        outcome.textContent = gradeTriage(card, "new");
        save();
        foot.firstChild.remove();
      }));
    foot.appendChild(button("Next", "primary grow", () => {
      results.seen++; results.correct++;
      save(); advance();
    }));
    primaryButton = foot.querySelector("button.primary");
  }
  const knew = button("I know this", "primary grow", () => decide("knew"));
  show([meta, prompt, sub, hintBox, answer], [
    button("New to me", "grow", () => decide("new")),
    button("Hint", "grow", () => {
      if (done) return;
      hinted = true;
      hintBox.textContent = hintText();
      hintBox.classList.remove("hidden");
      knew.textContent = "Now I know it";
    }),
    knew
  ]);
}

function viewFlash(card, mode) {
  const itEn = mode === "flash_it_en";
  const meta = el("div", "muted",
    `Level 1 \u00b7 Box ${card.box || 1} of 7 \u00b7 ` +
    (itEn ? "native \u2192 English" : "English \u2192 native"));
  const prompt = el("div", "prompt", itEn ? withArticle(card) : esc(card.en));
  const sub = el("div", "sub", esc(card.pos || ""));
  const answer = el("div", "card hidden");
  answer.innerHTML = `<div class="prompt" style="margin-top:4px">${
    itEn ? esc(card.en) : withArticle(card)}</div>` +
    (card.coll ? `<div class="muted">${esc(card.coll)}</div>` : "") +
    (card.ex ? `<div class="sentence" style="margin-top:8px">${esc(card.ex)}</div>` : "");

  const reveal = button("Show answer", "primary grow", () => {
    answer.classList.remove("hidden");
    foot.innerHTML = "";
    foot.appendChild(button("Didn't know", "grow", () => grade(false)));
    foot.appendChild(button("Knew it", "primary grow", () => grade(true)));
  });
  function grade(correct) {
    const before = card.stage;
    const message = gradeFlash(card, correct);
    result(message, correct, before);
  }
  function result(message, correct, before) {
    answer.appendChild(el("div", "accent", esc(message)));
    foot.innerHTML = "";
    foot.appendChild(button("Next", "primary grow", () =>
      finish(card, message, correct, card.stage > before ? "level" : null)));
  }
  const tip = (card.explain || card.explain_native)
    ? button("What does it mean?", "ghost", () => {
        answer.classList.remove("hidden");
        answer.innerHTML = `<div class="muted">${
          esc(card.explain_native || "")}<br>${esc(card.explain || "")}</div>`;
      }) : null;
  show([meta, prompt, sub, answer], [tip, reveal]);
}

function viewMeanings(card) {
  const senses = (card.senses && card.senses.length)
    ? card.senses.map(s => s.gloss) : [card.en];
  let remaining = senses.slice(), found = [], letters = 0, wrongs = 0;
  let unaided = 0, gaveUp = false, reason = "", done = false;
  const hint = makeHint(remaining[0] || "");

  const meta = el("div", "muted",
    `Level 2 \u00b7 box 1 of ${LEVEL2_TOP} \u00b7 native \u2192 English \u00b7 ` +
    `${senses.length} meaning(s)` + (card.marks ? ` \u00b7 ${card.marks} mark(s)` : ""));
  const prompt = el("div", "prompt", withArticle(card));
  const sub = el("div", "sub", esc(card.pos || ""));
  const slots = el("div");
  const input = el("input");
  input.placeholder = "type a meaning";
  input.autocapitalize = "none"; input.autocomplete = "off"; input.autocorrect = "off";
  const feedback = el("div", "muted");
  feedback.style.textAlign = "center";
  feedback.style.marginTop = "10px";

  function paint() {
    slots.innerHTML = "";
    senses.forEach((gloss, i) => {
      const state_ = found.includes(gloss) ? "filled"
        : (done && remaining.includes(gloss)) ? "missed" : "";
      const text = found.includes(gloss) || (done && remaining.includes(gloss))
        ? gloss
        : (remaining[0] === gloss && hint.used ? hint.pattern() : "\u00b7 \u00b7 \u00b7");
      slots.appendChild(el("div", "slot " + state_, esc(text)));
    });
  }
  function submit() {
    if (done) return;
    const typed = input.value.trim();
    if (!typed) return;
    const { hit, near, partial } = matchGloss(typed, remaining);
    if (hit) {
      if (!(hint.used && remaining[0] === hit)) unaided++;
      found.push(hit);
      remaining = remaining.filter(g => g !== hit);
      input.value = ""; feedback.textContent = "";
      paint();
      if (!remaining.length) complete();
      return;
    }
    wrongs++;
    input.value = "";
    const left = WRONG_LIMIT - wrongs;
    if (left <= 0) { reason = `${WRONG_LIMIT} wrong tries`; return revealRest(); }
    if (partial)
      feedback.textContent =
        `Part of it only: this meaning is ${partial.split(" ").length} words \u00b7 ${left} tries left`;
    else if (near) feedback.textContent = `Close, check the spelling \u00b7 ${left} tries left`;
    else {
      const { score, verdict } = closeness(typed, remaining);
      feedback.textContent = `${verdict} (${Math.round(score * 100)}% match) \u00b7 ${left} tries left`;
    }
  }
  function showLetter() {
    if (done || !remaining.length) return;
    // letters go into the first meaning still missing, so the hint has to
    // follow it as earlier ones are answered
    if (hint.word !== remaining[0]) hint.reset(remaining[0]);
    if (!hint.more()) return;
    letters++;
    paint();
    feedback.textContent =
      `${letters} letter(s) of help. ${LETTER_LIMIT} or more sends this word back to flashcards.`;
  }
  function revealRest() { gaveUp = !reason; settle(); }
  function complete() { settle(); }
  function settle() {
    done = true; paint();
    input.disabled = true;                 // so Enter reaches the Next button
    const partial = unaided > 0 && remaining.length > 0 && letters < LETTER_LIMIT;
    const before = card.stage, beforeBox = mbox(card);
    const message = applyLevel2(card, letters, {
      gaveUp: gaveUp && !partial, reason: partial ? "" : reason, partial
    });
    feedback.innerHTML = (remaining.length
      ? "Marked as missed, so these come back tomorrow.<br>" : "Every meaning recalled.<br>") +
      `<span class="accent">${esc(message)}</span>`;
    const context = (card.senses || []).filter(s => s.ex)
      .map(s => `<div style="margin:6px 0"><b class="${
        remaining.includes(s.gloss) ? "accent" : "muted"}">${esc(s.gloss)}</b> ${
        esc(s.ex)}<br><span class="muted">${esc(s.note || "")}</span></div>`).join("");
    if (context) main.appendChild(el("div", "muted", context));
    foot.innerHTML = "";
    foot.appendChild(button("Next", "primary grow", () =>
      finish(card, message, !remaining.length && !letters,
             card.stage > before ? "level" : mbox(card) > beforeBox ? "box" : null)));
  }

  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  paint();
  show([meta, prompt, sub, slots, input, feedback], [
    button("Show a letter", "", showLetter),
    button("Show the rest", "ghost", revealRest),
    button("Check", "primary grow", submit)
  ]);
  setTimeout(() => input.focus(), 60);
}

function viewReverse(card) {
  const senses = (card.senses && card.senses.length)
    ? card.senses.map(s => s.gloss) : [card.en];
  const hint = makeHint(card.w);
  let letters = 0, wrongs = 0, done = false, correct = false, gaveUp = false;

  const meta = el("div", "muted",
    `Level 2 \u00b7 box 2 of ${LEVEL2_TOP} \u00b7 English \u2192 native`);
  const prompt = el("div", "prompt", esc(senses.join(";  ")));
  const sub = el("div", "sub", esc(card.pos || ""));
  const shape = el("div", "shape hidden");
  const input = el("input");
  input.placeholder = "type the word";
  input.autocapitalize = "none"; input.autocomplete = "off"; input.autocorrect = "off";
  const feedback = el("div", "muted");
  feedback.style.textAlign = "center"; feedback.style.marginTop = "10px";

  function check() {
    if (done) return;
    const typed = input.value.trim();
    if (!typed) return;
    if (looseEq(typed, card.w)) { correct = true; return settle(`<b class="good">Correct.</b> ${esc(card.w)}`); }
    wrongs++;
    input.value = "";
    const left = WRONG_LIMIT - wrongs;
    if (left > 0) {
      const { score, verdict } = closeness(typed, [card.w]);
      feedback.textContent = `${verdict} (${Math.round(score * 100)}% match) \u00b7 ${left} tries left`;
      return;
    }
    settle(`<b class="bad">Not this time.</b> The word is <b>${esc(card.w)}</b>.`);
  }
  function showLetter() {
    if (done || !hint.more()) return;
    letters++;
    shape.textContent = hint.pattern();
    shape.classList.remove("hidden");
    feedback.textContent =
      `${letters} letter(s) of help. ${LETTER_LIMIT} or more sends this word back to flashcards.`;
  }
  function settle(message) {
    done = true;
    input.disabled = true;
    const before = card.stage, beforeBox = mbox(card);
    const applied = applyLevel2(card, letters, {
      wrong: !correct && !gaveUp, gaveUp,
      reason: wrongs >= WRONG_LIMIT ? `${WRONG_LIMIT} wrong tries` : ""
    });
    feedback.innerHTML = message +
      (card.ex ? `<br><span class="muted">${esc(card.ex)}</span>` : "") +
      `<br><span class="accent">${esc(applied)}</span>`;
    foot.innerHTML = "";
    foot.appendChild(button("Next", "primary grow", () =>
      finish(card, applied, correct && !letters,
             card.stage > before ? "level" : mbox(card) > beforeBox ? "box" : null)));
  }

  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  const tip = (card.explain || card.explain_native)
    ? button("Tip", "ghost", () => {
        feedback.innerHTML = `<i>${esc(card.explain_native || "")}</i><br>${esc(card.explain || "")}`;
      }) : null;
  show([meta, prompt, sub, shape, input, feedback], [
    tip, button("Show a letter", "", showLetter),
    button("Show the answer", "ghost", () => { gaveUp = true;
      shape.textContent = card.w; shape.classList.remove("hidden");
      settle(`The word is <b>${esc(card.w)}</b>.`); }),
    button("Check", "primary grow", check)
  ]);
  setTimeout(() => input.focus(), 60);
}

function pickSentence(card, needTranslation) {
  const rows = (card.sentences || []).filter(s => s.surface && s.a >= 0);
  const usable = needTranslation ? rows.filter(s => s.en) : rows;
  const pool = usable.length ? usable : rows;
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

function viewCloze(card, blind) {
  const row = pickSentence(card, !blind);
  if (!row) { card.mbox = Math.min(mbox(card) + 1, LEVEL2_TOP); card.updated_at = nowStr();
              return advance(); }
  const hint = makeHint(row.surface);
  let letters = 0, done = false, correct = false;

  const meta = el("div", "muted",
    `Level 2 \u00b7 box ${blind ? 4 : 3} of ${LEVEL2_TOP} \u00b7 sentence gap` +
    (blind ? "" : ", with the translation"));
  const gapped = row.it.slice(0, row.a) + "\u2007\u2007____\u2007\u2007" + row.it.slice(row.b);
  const sentence = el("div", "sentence", esc(gapped));
  const translation = el("div", "muted", blind ? "" : esc(row.en || ""));
  const instruction = el("div", "", `<b>${esc(card.en)}</b>` +
    (row.tag ? ` \u00b7 <span class="accent">${esc(row.tag)}</span>` : ""));
  instruction.style.margin = "12px 0 8px";
  const shape = el("div", "shape hidden");
  const input = el("input");
  input.placeholder = "the missing word";
  input.autocapitalize = "none"; input.autocomplete = "off"; input.autocorrect = "off";
  const feedback = el("div", "muted");
  feedback.style.marginTop = "10px";

  function check() {
    if (done) return;
    const typed = input.value.trim();
    if (!typed) return;
    correct = looseEq(typed, row.surface);
    done = true;
    input.disabled = true;
    const before = card.stage, beforeBox = mbox(card);
    const message = applyLevel2(card, letters, { wrong: !correct });
    feedback.innerHTML = (correct
      ? `<b class="good">Correct.</b> ${esc(row.it)}`
      : `<b class="bad">Not this time.</b> The answer is <b>${esc(row.surface)}</b>.<br>${esc(row.it)}`) +
      `<br><span class="accent">${esc(message)}</span>`;
    foot.innerHTML = "";
    foot.appendChild(button("Next", "primary grow", () =>
      finish(card, message, correct && !letters,
             card.stage > before ? "level" : mbox(card) > beforeBox ? "box" : null)));
  }
  function showLetter() {
    if (done || !hint.more()) return;
    letters++;
    shape.textContent = hint.pattern();
    shape.classList.remove("hidden");
  }
  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  show([meta, sentence, translation, instruction, shape, input, feedback], [
    button("Show a letter", "", showLetter),
    button("Check", "primary grow", check)
  ]);
  setTimeout(() => input.focus(), 60);
}

function viewTranslate(card, intoNative) {
  const rows = (card.sentences || []).filter(s => s.en);
  if (!rows.length) { card.mbox = Math.min(mbox(card) + 1, LEVEL2_TOP);
                      card.updated_at = nowStr(); return advance(); }
  const row = rows[Math.floor(Math.random() * rows.length)];
  const target = intoNative ? row.it : row.en;
  let hints = 0, done = false;

  const meta = el("div", "muted",
    `Level 2 \u00b7 box ${intoNative ? 6 : 5} of ${LEVEL2_TOP} \u00b7 translate the sentence`);
  const source = el("div", "sentence", esc(intoNative ? row.en : row.it));
  const instruction = el("div", "muted",
    intoNative ? `Use <b>${esc(card.w)}</b> somewhere in it.` : "Say what it means.");
  instruction.style.margin = "10px 0";
  const editor = el("textarea");
  editor.rows = 3; editor.placeholder = "type the whole sentence";
  const report = el("div", "muted");
  report.style.marginTop = "10px";

  function check() {
    if (done) return;
    const given = editor.value.trim();
    if (!given) return;
    done = true;
    const want = contentWords(target), got = contentWords(given);
    const missing = [...want].filter(w => ![...got].some(g =>
      g === w || g.startsWith(w.slice(0, Math.max(4, w.length - 2)))));
    const score = want.size ? (want.size - missing.length) / want.size : 1;
    const verdict = score >= 0.7 ? ["The content words all line up.", "good"]
      : score >= 0.4 ? ["Some of it lines up.", "accent"]
      : ["This looks like a different sentence.", "bad"];
    report.innerHTML =
      `<span class="${verdict[1]}">${verdict[0]}</span> (${Math.round(score * 100)}% of the key words)` +
      (missing.length ? `<br>Not found: ${esc(missing.slice(0, 6).join(", "))}` : "") +
      `<br><br>Reference: <b>${esc(target)}</b>`;
    foot.innerHTML = "";
    foot.appendChild(button("Not quite", "grow", () => settle(false)));
    foot.appendChild(button("That says it", "primary grow", () => settle(true)));
  }
  function settle(matched) {
    const before = card.stage, beforeBox = mbox(card);
    const message = applyLevel2(card, hints, { wrong: !matched });
    report.innerHTML += `<br><span class="accent">${esc(message)}</span>`;
    finish(card, message, matched && !hints,
           card.stage > before ? "level" : mbox(card) > beforeBox ? "box" : null);
  }
  show([meta, source, instruction, editor, report], [
    button("Show a word", "", () => {
      const words = target.split(" ");
      hints++;
      report.innerHTML = `<span class="shape">${
        esc(words.map((w, i) => i < hints ? w : "\u00b7".repeat(Math.max(w.length - 1, 2))).join(" "))}</span>`;
    }),
    button("Check", "primary grow", check)
  ]);
}

function viewProduce(card) {
  let done = false;
  const meta = el("div", "muted", "Level 3 \u00b7 your own sentence");
  const prompt = el("div", "prompt", `Use ${withArticle(card)}`);
  const sub = el("div", "sub", esc(card.en));
  const editor = el("textarea");
  editor.rows = 3; editor.placeholder = "write a sentence using this word";
  const report = el("div", "muted");
  report.style.marginTop = "10px";

  function check() {
    if (done) return;
    const text = editor.value.trim();
    if (!text) return;
    done = true;
    const has = usesWord(text, card.w);
    report.innerHTML = has
      ? '<span class="good">The word is there.</span> Does it say what you meant?'
      : `<span class="bad">Your sentence does not contain ${esc(card.w)}.</span>`;
    if (card.ex) report.innerHTML += `<br><span class="muted">For reference: ${esc(card.ex)}</span>`;
    foot.innerHTML = "";
    foot.appendChild(button("Not quite", "grow", () => settle(false)));
    if (has) foot.appendChild(button("That works", "primary grow", () => settle(true)));
  }
  function settle(ok) {
    card.updated_at = nowStr();
    logReview(card, "produce", ok);
    let message;
    if (!ok) {
      card.stage = 2; card.mbox = LEVEL2_TOP; card.due = plusDays(1);
      message = "Back to level 2 for more practice.";
    } else {
      card.prod = (card.prod || 0) + 1;
      if (card.prod >= 3) { card.stage = 4; card.due = plusDays(45); card.prod = 0;
        message = "Mastered. Spot-checked in 45 days."; }
      else { card.due = plusDays(2);
        message = `Accepted: ${card.prod} of 3 towards mastered.`; }
    }
    report.innerHTML += `<br><span class="accent">${esc(message)}</span>`;
    finish(card, message, ok, card.stage === 4 ? "level" : null);
  }
  show([meta, prompt, sub, editor, report], [button("Check", "primary grow", check)]);
}

/* ------------------------------------------------------------- cloud sync
   The same table the desktop uses, over the same REST endpoint. Only rows
   changed since the last sync are moved, so a sync on mobile data is a few
   kilobytes. Settings live in IndexedDB, not in the page, so they survive. */
function cloudSettings() { return (state && state.cloud) || {}; }
let lastSync = null;

// what the bookmarks go back to when the exchange has to start from scratch
const NO_MARKERS = { pulled_to: "", pushed_to: "", reviews_to: "", reviews_sent: "",
                     pulled_seq: "", reviews_seq: "" };

/* The settings are passed in rather than read from `state`, because you can
   switch collection while a sync is still talking to the database. */
async function cloudRequest(method, path, body, cfg) {
  cfg = cfg || cloudSettings();
  if (!cfg.url || !cfg.key) throw new Error("Sync is not set up yet.");
  const response = await fetch(`${cfg.url.replace(/\/$/, "")}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: cfg.key, Authorization: `Bearer ${cfg.key}`,
      "Content-Type": "application/json", Accept: "application/json",
      ...(method === "POST" ? { Prefer: "resolution=merge-duplicates,return=minimal" } : {})
    },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (!response.ok) {
    const text = await response.text();
    let code = "";
    try { code = JSON.parse(text).code || ""; } catch (e) { /* not JSON */ }
    if (response.status === 401 || response.status === 403)
      throw new Error("The key was refused. Check it is the anon public key.");
    if (response.status === 404)
      throw new Error("The table was not found. Run the setup SQL in Supabase.");
    const error = new Error(`${response.status}: ${text.slice(0, 200)}`);
    error.code = code;
    throw error;
  }
  const text = await response.text();
  return text ? JSON.parse(text) : [];
}

/* ------------------------------------------------------- reading changes
   Supabase hands back at most 1000 rows a request and says nothing when it
   stops short. A pull that asked once therefore got the first 1000 rows of a
   bigger collection and silently dropped the rest, and "Take from database"
   then pushed this phone's copy over every card it had not seen. */
const PAGE = 1000;
const pgQuote = v => '"' + String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';

async function pullAll(cfg, table, select, col, since, extra) {
  const base = `${table}?collection=eq.${encodeURIComponent(cfg.collection)}` +
    `&select=${select}&order=${col}.asc,word.asc&limit=${PAGE}` + (extra || "");
  const rows = [];
  let last = null;
  for (;;) {
    // each page carries on from the last row by (col, word), which stays
    // exact when many rows share one stamp, as they do after an upload
    let path = base;
    if (last) path += "&or=" + encodeURIComponent(
      `(${col}.gt.${pgQuote(last[col])},` +
      `and(${col}.eq.${pgQuote(last[col])},word.gt.${pgQuote(last.word)}))`);
    else if (since) path += `&${col}=gt.${encodeURIComponent(since)}`;
    const page = await cloudRequest("GET", path, undefined, cfg);
    if (!page.length) return rows;
    rows.push(...page);
    last = page[page.length - 1];
  }
}

/* A stamp moved back in time, keeping the format it came in. */
function shiftStamp(stamp, ms, zoned) {
  if (!stamp) return "";
  const plain = stamp.replace(/(\.\d{3})\d+/, "$1");
  const t = Date.parse(/(Z|[+-]\d\d(:?\d\d)?)$/i.test(plain) ? plain : plain + "Z");
  if (isNaN(t)) return stamp;
  const iso = new Date(t - ms).toISOString();
  return zoned ? iso : iso.slice(0, 23);
}

/* Rows changed since the last pull.

   Every row carries the time its card was studied. That is the right thing
   for deciding which answer wins, and the wrong thing for a bookmark: a phone
   that studied offline at 10:00 and uploads at noon is invisible to a device
   whose bookmark already says 11:00. With supabase-sync-cursor.sql run once,
   the database stamps every write itself (synced_at) and that is the
   bookmark. Without it, each pull reaches back a day, which catches the usual
   walk with no signal at the cost of reading a day of rows again. */
const STAMP_OVERLAP = 864e5;      // one day
const SERVER_OVERLAP = 120e3;     // two minutes: writes can commit out of order
// projects found without the upgrade, and when: asked again after ten
// minutes, so running the SQL takes effect without restarting the app
const noServerStamp = new Map();

async function pullChanged(cfg, table, select, studied, seqMark, stampMark, extraIfNew) {
  if (!(Date.now() - (noServerStamp.get(cfg.url) || 0) < 6e5)) {
    try {
      const since = shiftStamp(cfg[seqMark], SERVER_OVERLAP, true);
      const rows = await pullAll(cfg, table, `${select},synced_at`, "synced_at", since,
                                 since ? "" : extraIfNew);
      // pages arrive in synced_at order, so the last row is the newest
      return { rows, seq: rows.length ? rows[rows.length - 1].synced_at : (cfg[seqMark] || "") };
    } catch (e) {
      const missing = e.code === "42703" || e.code === "PGRST204" ||
                      /synced_at/.test(e.message || "");
      if (!missing) throw e;
      noServerStamp.set(cfg.url, Date.now());
    }
  }
  const since = shiftStamp(cfg[stampMark], STAMP_OVERLAP);
  const rows = await pullAll(cfg, table, select, studied, since, since ? "" : extraIfNew);
  return { rows, seq: cfg[seqMark] || "" };
}

/* One exchange with the database at a time. Two that overlap each write their
   own bookmarks at the end, and whichever finishes last wins. */
let syncing = null;
async function exclusive(fn) {
  while (syncing) await syncing.catch(() => {});
  const run = Promise.resolve().then(fn);
  syncing = run;
  try { return await run; } finally { if (syncing === run) syncing = null; }
}
const syncIdle = () => exclusive(() => {});

/* What has to be true before anything is sent. */
async function preflight(target) {
  const cfg = { ...(target.cloud || {}) };
  if (!cfg.url || !cfg.key) throw new Error("Sync is not set up yet.");
  if (!cfg.collection)
    throw new Error("Enter the collection name in sync settings: the same one the desktop uses.");
  if (!target.cards.length)
    throw new Error("This collection has no words on this phone yet. " +
                    "Press “Download words” in sync settings first.");
  // a name typed for the wrong language would send one language's cards into
  // the other's table, so it is checked against the words uploaded there
  if (cfg.checked !== cfg.collection && target.language) {
    const rows = await cloudRequest("GET",
      `collections?collection=eq.${encodeURIComponent(cfg.collection)}` +
      "&select=language:payload->>language,language_name:payload->>language_name&limit=1",
      undefined, cfg);
    const theirs = rows[0];
    if (theirs && theirs.language && theirs.language !== target.language)
      throw new Error(`“${cfg.collection}” holds ${theirs.language_name || theirs.language} ` +
        `words, but the words open here are ${target.language_name || target.language}. ` +
        "Check the collection name in sync settings.");
    target.cloud = { ...target.cloud, checked: cfg.collection };
    cfg.checked = cfg.collection;
  }
  return cfg;
}

function cardState(card) {
  const out = {
    ...(card.manual ? { new_word: { w: card.w, en: card.en, pos: card.pos || "",
        ex: card.ex || "", coll: card.coll || "", art: card.art || "" } } : {}),
    stage: card.stage, box: card.box, meaning_box: card.mbox,
    meaning_marks: card.marks || 0, dir_flags: card.flags || 0,
    // the phone does not use these two, but it must hand back what the
    // desktop set rather than zeros, or a sync would undo a suspension
    cloze_passes: card.cloze || 0, prod_passes: card.prod || 0, due: card.due,
    reviews: card.reviews || 0, correct: card.correct || 0,
    lapses: card.lapses || 0, suspended: card.suspended ? 1 : 0
  };
  if (card.senses && card.senses.length) {
    out.senses = {};
    for (const s of card.senses)
      out.senses[s.gloss] = { box: s.box || 0, due: s.due || null, seen: s.seen || 0,
        recalled: s.recalled || 0, missed: s.missed || 0,
        last_review: s.last_review || null };
  }
  return out;
}

function cloudSync(quiet) {
  return exclusive(() => syncCollection(state)).then(summary => {
    if (!quiet) alert(summary);
    return summary;
  });
}

/* Works on the collection it was given from start to finish, so switching
   language halfway through cannot send one collection's cards to the other. */
async function syncCollection(target) {
  const cfg = await preflight(target);
  let pulledTo = cfg.pulled_to || "", pushedTo = cfg.pushed_to || "";
  const cutoffPull = pulledTo;

  // pull first: a card changed in both places then ends up with the later
  // answer here as well, rather than only on the other device
  const pulled = await pullChanged(cfg, "cards", "word,updated_at,state",
                                   "updated_at", "pulled_seq", "pulled_to");
  const remote = pulled.rows;
  const byWord = new Map(target.cards.map(c => [c.w, c]));
  let took = 0;
  for (const row of remote) {
    if ((row.updated_at || "") > pulledTo) pulledTo = row.updated_at;
    const card = byWord.get(row.word);
    if (!card) continue;
    if (card.fresh) delete card.fresh;        // the sync has spoken for it
    if ((row.updated_at || "") <= (card.updated_at || "")) continue;
    const st = row.state || {};
    card.stage = st.stage; card.box = st.box; card.mbox = st.meaning_box;
    card.marks = st.meaning_marks; card.flags = st.dir_flags; card.due = st.due;
    card.reviews = st.reviews; card.correct = st.correct; card.lapses = st.lapses;
    card.prod = st.prod_passes; card.updated_at = row.updated_at;
    if (st.suspended !== undefined) card.suspended = st.suspended ? 1 : 0;
    if (st.cloze_passes !== undefined) card.cloze = st.cloze_passes;
    if (st.senses && card.senses)
      for (const s of card.senses) {
        const inc = st.senses[s.gloss];
        if (inc && (inc.last_review || "") > (s.last_review || "")) Object.assign(s, inc);
      }
    took++;
  }

  // push what changed here. The cutoff is fixed before the loop: raising it
  // as we go would make every later card look already sent.
  const cutoff = pushedTo;
  const rows = [];
  for (const card of target.cards) {
    if (card.fresh) continue;                 // a guess, not a fact
    let stamp = card.updated_at || "";
    if (cutoff && stamp && stamp <= cutoff) continue;
    if (!stamp) { stamp = nowStr(); card.updated_at = stamp; }
    if (stamp > pushedTo) pushedTo = stamp;
    rows.push({ collection: cfg.collection, word: card.w,
                updated_at: stamp, state: cardState(card) });
  }
  for (let i = 0; i < rows.length; i += 300)
    await cloudRequest("POST", "cards", rows.slice(i, i + 300), cfg);

  // reviews are append-only, so both directions are just 'add what is
  // missing'. What to send is settled before the pull, so reviews that came
  // from the other device are not sent straight back.
  const sentBefore = cfg.reviews_sent || "";
  const mine = target.reviews
    .filter(r => !sentBefore || r[1] > sentBefore)
    .map(r => ({ collection: cfg.collection, word: r[0], ts: r[1],
                 stage: r[2], mode: r[3], result: r[4] }));
  // a first pull only needs recent history: the chart shows a fortnight and
  // the desktop sends sixty days
  const sixtyDaysAgo = localDate(new Date(Date.now() - 60 * 864e5));
  const pulledReviews = await pullChanged(cfg, "reviews", "word,ts,stage,mode,result",
    "ts", "reviews_seq", "reviews_to", `&ts=gte.${sixtyDaysAgo}`);
  const seen = new Set(target.reviews.map(r => r[0] + "\u0000" + r[1]));
  let latestReview = cfg.reviews_to || "";
  for (const r of pulledReviews.rows) {
    if (r.ts > latestReview) latestReview = r.ts;
    if (!seen.has(r.word + "\u0000" + r.ts))
      target.reviews.push([r.word, r.ts, r.stage, r.mode, r.result]);
  }
  if (target.reviews.length > 4000) {
    target.reviews.sort((a, b) => (a[1] || "").localeCompare(b[1] || ""));
    target.reviews.splice(0, target.reviews.length - 4000);
  }
  for (let i = 0; i < mine.length; i += 300)
    await cloudRequest("POST", "reviews", mine.slice(i, i + 300), cfg);

  // anything the database had nothing to say about really is new, so it can
  // take the defaults now and travel normally from here on
  for (const card of target.cards)
    if (card.fresh) delete card.fresh;
  // merged into the settings as they are now, so a change made in the
  // settings screen while this ran is not undone
  target.cloud = { ...target.cloud, pulled_to: pulledTo, pushed_to: pushedTo,
                   pulled_seq: pulled.seq, reviews_seq: pulledReviews.seq,
                   reviews_to: latestReview,
                   reviews_sent: mine.reduce((m, r) => r.ts > m ? r.ts : m, sentBefore),
                   last: nowStr() };
  await save(target);
  const summary = `Sent ${rows.length}, took in ${took}.`;
  lastSync = { sent: rows.length, took, seen: remote.length,
               pulledFrom: cutoffPull || "(everything)" };
  return summary;
}

async function forcePull() {
  /* For a device whose progress was lost while the others still have it: every
     local card is made to lose, so the database's version is taken instead of
     being overwritten by this one. */
  if (!confirm("Take the database's version of every card?\n\n" +
               "Anything studied here and never synced would be given up."))
    return;
  await exclusive(async () => {
    const target = state;
    await preflight(target);                 // before anything is cleared
    for (const card of target.cards) { card.updated_at = ""; delete card.fresh; }
    target.cloud = { ...target.cloud, ...NO_MARKERS };
    await save(target);
    return syncCollection(target);
  });
  const c = counts();
  alert(`Took in ${lastSync.took} card(s) from the database.\n\n` +
        `To sort: ${c.s0}\nLevel 1: ${c.s1}\nLevel 2: ${c.s2}\nDue now: ${c.due}`);
  home();
}

async function fullResync() {
  /* The markers say what has already been exchanged. When the two sides
     disagree and ordinary syncing will not close the gap, the honest fix is
     to forget them and compare every card once. */
  await exclusive(async () => {
    const target = state;
    await preflight(target);
    target.cloud = { ...target.cloud, ...NO_MARKERS };
    await save(target);
    return syncCollection(target);
  });
  const c = counts();
  alert(`Compared every card.\n\n` +
        `Rows seen in the database: ${lastSync.seen}\n` +
        `Taken in: ${lastSync.took}\n` +
        `Sent up: ${lastSync.sent}\n\n` +
        `Due now: ${c.due}`);
  home();
}

async function pushMine() {
  /* The other direction: this device has the work and the database does not.
     Sending with each card's own stamp replaces whatever is there, which is
     what you want when a reset was uploaded over your progress. */
  if (!confirm("Send this device's progress up, replacing what is in the " +
               "database for these cards?")) return;
  const sent = await exclusive(async () => {
    const target = state;
    const cfg = await preflight(target);
    const rows = [];
    for (const card of target.cards) {
      if (card.fresh) continue;
      if (!card.updated_at) card.updated_at = nowStr();
      rows.push({ collection: cfg.collection, word: card.w,
                  updated_at: card.updated_at, state: cardState(card) });
    }
    for (let i = 0; i < rows.length; i += 300)
      await cloudRequest("POST", "cards", rows.slice(i, i + 300), cfg);
    target.cloud = { ...target.cloud, pushed_to: "", last: nowStr() };
    await save(target);
    return rows.length;
  });
  alert(`Sent ${sent} card(s) up.`);
  home();
}

async function autoSync(reason) {
  const cfg = cloudSettings();
  if (!cfg.auto || !cfg.url || !cfg.key) return;
  try {
    const summary = await cloudSync(true);
    flash(summary);
  } catch (e) { flash("Sync failed: " + e.message); }
}

let flashTimer = null;
function flash(text) {
  let node = document.getElementById("flash");
  if (!node) {
    node = el("div", "muted");
    node.id = "flash";
    node.style.cssText = "position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));" +
      "background:var(--surface2);border:1px solid var(--border);border-radius:11px;" +
      "padding:10px 14px;text-align:center;z-index:9";
    document.body.appendChild(node);
  }
  node.textContent = text;
  node.style.display = "block";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { node.style.display = "none"; }, 4000);
}

async function cloudFetchCollection(cfg) {
  const coll = encodeURIComponent(cfg.collection || "default");
  const rows = await cloudRequest("GET",
    `collections?collection=eq.${coll}&select=payload&limit=1`, undefined, cfg);
  if (!rows.length)
    throw new Error("No collection there yet. On the desktop press " +
                    "\u201cUpload words\u201d in Phone sync first.");
  return rows[0].payload;
}

const STAGE_NAME = { 0: "To sort", 1: "Flashcards", 2: "Meanings & gaps",
                     3: "Free writing", 4: "Mastered" };
const BOX_SHORT = { 1: "IT\u2192EN", 2: "EN\u2192IT", 3: "gap + translation",
                    4: "gap alone", 5: "translate out", 6: "translate in" };

function wordsScreen() {
  let query = "", stageFilter = "", cefrFilter = "";
  const box = el("div", "card");
  box.appendChild(el("h2", "", "Words"));
  const search = el("input");
  search.placeholder = "search the word or the English";
  search.autocapitalize = "none"; search.spellcheck = false;
  search.style.marginBottom = "8px";
  search.addEventListener("input", () => { query = search.value.trim().toLowerCase(); paint(); });
  box.appendChild(search);

  const row = el("div", "row");
  row.style.marginBottom = "10px";
  function picker(caption, values, onPick) {
    const sel = document.createElement("select");
    sel.style.cssText = "flex:1;min-width:130px;font:inherit;color:var(--text);" +
      "background:var(--surface2);border:1px solid var(--border);border-radius:11px;" +
      "padding:12px;min-height:48px";
    for (const [value, text] of values) {
      const option = document.createElement("option");
      option.value = value; option.textContent = text;
      sel.appendChild(option);
    }
    sel.addEventListener("change", () => { onPick(sel.value); paint(); });
    return sel;
  }
  row.appendChild(picker("", [["", "all levels"], ...Object.entries(STAGE_NAME)
    .map(([k, v]) => [k, v])], v => stageFilter = v));
  const cefrValues = [...new Set(state.cards.map(c => c.cefr).filter(Boolean))].sort();
  row.appendChild(picker("", [["", "all CEFR"], ...cefrValues.map(v => [v, v])],
                         v => cefrFilter = v));
  box.appendChild(row);
  const list = el("div");
  const note = el("div", "muted");
  box.appendChild(list); box.appendChild(note);

  function paint() {
    let rows = state.cards;
    if (query) rows = rows.filter(c =>
      c.w.toLowerCase().includes(query) || (c.en || "").toLowerCase().includes(query));
    if (stageFilter !== "") rows = rows.filter(c => String(c.stage ?? 1) === stageFilter);
    if (cefrFilter) rows = rows.filter(c => c.cefr === cefrFilter);
    rows = rows.slice().sort((a, b) => a.w.localeCompare(b.w));
    list.innerHTML = "";
    note.textContent = `${rows.length} of ${state.cards.length} shown`;
    for (const card of rows.slice(0, 150)) {
      const stage = card.stage ?? 1;
      const where = stage === 2
        ? `level 2 \u00b7 box ${mbox(card)} \u00b7 ${BOX_SHORT[mbox(card)]}`
        : stage === 1 ? `flashcards \u00b7 box ${card.box || 1}`
        : STAGE_NAME[stage];
      const line = el("div", "slot");
      line.style.cssText += "text-align:left;letter-spacing:normal";
      line.innerHTML = `<b>${esc(card.w)}</b> <span class="muted">${esc(card.en)}</span>` +
        `<br><span class="muted" style="font-size:13px">${esc(where)}` +
        (card.cefr ? ` \u00b7 ${esc(card.cefr)}` : "") +
        (card.due ? ` \u00b7 due ${esc(card.due)}` : "") + `</span>`;
      list.appendChild(line);
    }
    if (rows.length > 150)
      list.appendChild(el("div", "muted", `\u2026 and ${rows.length - 150} more.`));
  }
  paint();
  show([box], [button("Back", "primary grow", home)]);
}

function progressScreen() {
  const c = counts();
  const box = el("div", "card");
  box.appendChild(el("h2", "", "Where your words are"));
  const total = Math.max(state.cards.length, 1);
  for (const [stage, name] of Object.entries(STAGE_NAME)) {
    const n = state.cards.filter(x => (x.stage ?? 1) === Number(stage)).length;
    const bar = el("div");
    bar.style.cssText = "background:var(--surface2);border-radius:7px;height:26px;" +
      "position:relative;margin:6px 0;overflow:hidden";
    const fill = el("div");
    fill.style.cssText = `background:var(--accent);height:100%;width:${
      Math.round(100 * n / total)}%`;
    const text = el("div", "", `${name} \u00b7 <b>${n}</b> (${Math.round(100 * n / total)}%)`);
    text.style.cssText = "position:absolute;inset:0;display:flex;align-items:center;" +
      "padding-left:10px;font-size:14px";
    bar.appendChild(fill); bar.appendChild(text);
    box.appendChild(bar);
  }

  const boxes = el("div", "card");
  boxes.appendChild(el("h2", "", "Boxes at level 2"));
  for (let i = 1; i <= LEVEL2_TOP; i++) {
    const n = state.cards.filter(x => x.stage === 2 && mbox(x) === i).length;
    boxes.appendChild(el("div", "muted",
      `Box ${i}: <b style="color:var(--text)">${n}</b> \u00b7 ${BOX_NAME[i]}`));
  }

  // the last fortnight, from the review log both devices share
  const activity = el("div", "card");
  activity.appendChild(el("h2", "", "Last 14 days"));
  const byDay = new Map();
  for (const r of state.reviews) {
    const day = (r[1] || "").slice(0, 10);
    if (day) byDay.set(day, (byDay.get(day) || 0) + 1);
  }
  const days = [];
  for (let i = 13; i >= 0; i--)
    days.push(localDate(new Date(Date.now() - i * 864e5)));
  const peak = Math.max(1, ...days.map(d => byDay.get(d) || 0));
  const chart = el("div");
  chart.style.cssText = "display:flex;align-items:flex-end;gap:4px;height:120px;margin-top:8px";
  for (const day of days) {
    const n = byDay.get(day) || 0;
    const col = el("div");
    col.style.cssText = `flex:1;background:${n ? "var(--accent)" : "var(--surface2)"};` +
      `height:${Math.max(3, Math.round(100 * n / peak))}%;border-radius:3px`;
    col.title = `${day}: ${n}`;
    chart.appendChild(col);
  }
  activity.appendChild(chart);
  activity.appendChild(el("div", "muted",
    `${[...byDay.entries()].filter(([d]) => days.includes(d))
        .reduce((a, [, n]) => a + n, 0)} answers in the last fortnight.`));

  show([box, boxes, activity], [button("Back", "primary grow", home)]);
}

function sortingScreen() {
  const waiting = state.cards.filter(c => !c.stage && !c.suspended);
  const facet = field => {
    const counts = new Map();
    for (const c of waiting) {
      const v = c[field] || "";
      if (v) counts.set(v, (counts.get(v) || 0) + 1);
    }
    return [...counts].sort((a, b) => b[1] - a[1]);
  };
  const filters = { pos: "", cefr: "", topic: "", order: "grouped" };

  const box = el("div", "card");
  box.appendChild(el("h2", "", "Sort new words"));
  box.appendChild(el("div", "muted",
    "Related words are easier to place together, so this is grouped by topic " +
    "rather than shuffled. Tap a word if you already know it, or sort them " +
    "one by one."));
  const row = el("div", "row");
  row.style.margin = "10px 0";
  function picker(field, caption, values) {
    const sel = document.createElement("select");
    sel.style.cssText = "flex:1;min-width:130px;font:inherit;color:var(--text);" +
      "background:var(--surface2);border:1px solid var(--border);border-radius:11px;" +
      "padding:12px;min-height:48px";
    const any = document.createElement("option");
    any.value = ""; any.textContent = caption;
    sel.appendChild(any);
    for (const [value, n] of values) {
      const option = document.createElement("option");
      option.value = value; option.textContent = `${value} (${n})`;
      sel.appendChild(option);
    }
    sel.addEventListener("change", () => { filters[field] = sel.value; paint(); });
    return sel;
  }
  row.appendChild(picker("pos", "any part of speech", facet("spos")));
  row.appendChild(picker("cefr", "any level", facet("cefr")));
  row.appendChild(picker("topic", "any topic", facet("topic")));
  box.appendChild(row);
  const list = el("div");
  box.appendChild(list);
  const note = el("div", "muted");
  box.appendChild(note);

  function matching() {
    let pool = state.cards.filter(c => !c.stage && !c.suspended);
    if (filters.pos) pool = pool.filter(c => (c.spos || "") === filters.pos);
    if (filters.cefr) pool = pool.filter(c => (c.cefr || "") === filters.cefr);
    if (filters.topic) pool = pool.filter(c => (c.topic || "") === filters.topic);
    pool.sort((a, b) => (a.topic + a.spos + a.w).localeCompare(b.topic + b.spos + b.w));
    return pool;
  }
  function paint() {
    const pool = matching();
    list.innerHTML = "";
    note.textContent = `${pool.length} word(s) waiting. Tap one to mark it known.`;
    for (const card of pool.slice(0, 120)) {
      const line = el("div", "slot");
      line.style.cssText += "text-align:left;letter-spacing:normal;cursor:pointer";
      line.innerHTML = `<b>${esc(card.w)}</b> <span class="muted">${esc(card.en)}</span>`;
      line.addEventListener("click", async () => {
        gradeTriage(card, "knew");
        await save();
        paint();
      });
      list.appendChild(line);
    }
    if (pool.length > 120)
      list.appendChild(el("div", "muted", `\u2026 and ${pool.length - 120} more.`));
  }
  paint();
  show([box], [
    button("Back", "grow", home),
    button("Sort these one by one", "primary grow",
           () => start({ sorting: true, ...filters }))
  ]);
}

function addWordScreen() {
  const box = el("div", "card");

    "For something you met today that the list does not have. An example " +

    "boxes. It travels to the desktop on the next sync."));
  const fields = {};
  for (const [key, ph] of [["w", "the word"], ["en", "English"],
                           ["pos", "part of speech (optional)"],
                           ["ex", "example sentence (optional)"]]) {
    const input = el("input");
    input.placeholder = ph;
    input.autocapitalize = "none"; input.spellcheck = false;
    input.style.marginBottom = "8px";
    fields[key] = input;
    box.appendChild(input);
  }
  const where = el("div", "muted", "It starts in the sorting pass with the rest.");
  box.appendChild(where);

  show([box], [
    button("Back", "grow", home),
    button("Add", "primary grow", async () => {
      const w = fields.w.value.trim(), en = fields.en.value.trim();
      if (!w || !en) return alert("The word and its English are both needed.");
      if (state.cards.some(c => c.w.toLowerCase() === w.toLowerCase()))
        return alert("That word is already in the collection.");
      const ex = fields.ex.value.trim();
      const card = { w, en, pos: fields.pos.value.trim(), spos: "", art: "",
        coll: "", ex, topic: "general", cefr: "", explain: "", explain_native: "",
        stage: 0, box: 1, mbox: 1, marks: 0, flags: 0, due: todayStr(),
        reviews: 0, correct: 0, lapses: 0, manual: 1, updated_at: nowStr(),
        senses: [], sentences: [] };
      // a gap needs to know where the word sits in the sentence
      if (ex) {
        const at = ex.toLowerCase().indexOf(w.toLowerCase());
        if (at >= 0) card.sentences = [{ it: ex, en: "", surface: ex.slice(at, at + w.length),
                                         a: at, b: at + w.length, tag: "base" }];
      }
      state.cards.push(card);

      alert(`${w} added. It will appear in the sorting pass.`);

    })

/* ------------------------------------------------------------ collections
   Each language is its own record. Switching saves the one open now and
   loads the other; nothing is ever written under another collection's key. */
async function switchTo(key) {
  await syncIdle();
  if (state && state.cards.length) await save();
  const next = await idbGet(key);
  if (!next || !(next.cards || []).length) return home();
  if (!next.reviews) next.reviews = [];
  next.id = key;
  state = next;
  await idbSet("last_open", key);
  home();
  autoSync("switched");
}

async function addLanguage() {
  await syncIdle();
  if (state && state.cards.length) await save();
  // the same Supabase project usually serves every language, so its address
  // and key come along; the collection name and the words do not
  const prev = cloudSettings();
  state = { language: "", language_name: "", cards: [], reviews: [],
            cloud: { url: prev.url || "", key: prev.key || "" } };
  setup();
}
