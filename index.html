/* ---------------------------------------------------------------- session */
function buildQueue(kind) {
  // the size is the learner's to choose; up to half of it can be new words
  const size = sessionSize(), ration = Math.max(5, Math.round(size / 2));
  if (kind && kind.learn) return learnQueue(kind.learn.book, kind.learn.t);
  let pool = state.cards.filter(c => due(c) && !c.suspended);
  if (kind && kind.sorting) {
    pool = state.cards.filter(c => !c.stage && !c.suspended);
    if (kind.pos) pool = pool.filter(c => (c.spos || "") === kind.pos);
    if (kind.cefr) pool = pool.filter(c => (c.cefr || "") === kind.cefr);
    if (kind.topic) pool = pool.filter(c => (c.topic || "") === kind.topic);
    if (kind.order === "alphabetical")
      pool.sort((a, b) => a.w.localeCompare(b.w));
    else if (kind.order === "random") pool.sort(() => Math.random() - 0.5);
    else pool.sort((a, b) => (a.topic + a.spos + a.w).localeCompare(b.topic + b.spos + b.w));
    return pool.slice(0, size);
  }
  if (kind === "sorting") pool = pool.filter(c => !c.stage);
  else if (kind === "flashcards") pool = pool.filter(c => c.stage === 1);
  else if (kind === "writing") pool = pool.filter(c => c.stage === 3);
  else if (kind === "reading") pool = pool.filter(isReadingWord);
  else if (kind === "meanings") pool = pool.filter(c => c.stage === 2 && mbox(c) <= 2);
  else if (kind === "gaps") pool = pool.filter(c => c.stage === 2 && [3, 4].includes(mbox(c)));
  else if (kind === "translate")
    pool = pool.filter(c => c.stage === 2 && mbox(c) >= 5 &&
      (c.sentences || []).some(s => s.en));
  const seen = pool.filter(c => c.reviews > 0);
  const fresh = pool.filter(c => !c.reviews).sort(() => Math.random() - 0.5).slice(0, ration);
  const all = seen.concat(fresh);
  all.sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
  return all.slice(0, size);
}

// where the cross in the session bar goes: home, or back to a text whose
// words were being learnt, or to the free-practice menu
let quitTo = null;
function start(kind) {
  filter = kind;
  if (kind && kind.learn) addTextWords(kind.learn.book, kind.learn.t);
  queue = buildQueue(kind);
  index = 0;
  results = { seen: 0, correct: 0, boxes: 0, levels: 0 };
  quitTo = kind && kind.learn ? () => openText(kind.learn.book, kind.learn.t) : null;
  chrome(true);
  if (!queue.length) return summary("Nothing is due");
  next();
}

function advance() { index++; next(); }

function next() {
  if (index >= queue.length) return summary("Session complete");
  const card = queue[index];
  setProgress(`${index + 1} of ${queue.length}`, index / queue.length);
  const mode = modeFor(card);
  if (mode === "triage") return viewTriage(card);
  if (mode === "flash_it_en" || mode === "flash_en_it") return viewFlash(card, mode);
  if (mode === "meanings") return viewMeanings(card);
  if (mode === "reverse") return viewReverse(card);
  if (mode === "cloze" || mode === "cloze_blind")
    return viewCloze(card, mode === "cloze_blind");
  if (mode === "translate_out" || mode === "translate_in")
    return viewTranslate(card, mode === "translate_in");
  return viewProduce(card);
}

function summary(title) {
  setProgress("", 1); chrome(false);
  const seen = results && results.seen;
  const head = el("div", "center");
  head.appendChild(el("div", "done-mark", icon(seen ? "check" : "cup")));
  head.appendChild(el("h1", "", title));
  head.appendChild(el("div", "muted", seen
    ? (results.correct / seen >= 0.8 ? "Strong round. These words are sticking."
                                      : "Good work. The tricky ones come back sooner.")
    : "Nothing scheduled right now. Come back tomorrow, or sync from the desktop."));
  const nodes = [head];
  if (seen) {
    const stats = el("div", "stats");
    stats.style.marginTop = "22px";
    for (const [name, value, label, colour] of [
      ["bolt", seen, seen === 1 ? "answer" : "answers", "var(--primary)"],
      ["check", Math.round(100 * results.correct / seen) + "%", "correct", "var(--s4)"],
      ["ladder", results.boxes, "moved up a box", "var(--s1)"],
      ["star", results.levels, "moved up a level", "var(--s3)"]])
      stats.appendChild(el("div", "stat", `${icobox(name, colour)}<b>${value}</b><span>${label}</span>`));
    nodes.push(stats);
  }
  save();
  autoSync("session end");
  quitTo = null;
  const learnt = filter && filter.learn;
  if (learnt) {
    // straight back to the text, which opens now if enough words were met
    const { book, t } = learnt;
    const words = textWords(book, t, cardIndex());
    nodes.push(el("div", "card center", textOpen(t, words)
      ? `<b>“${esc(t.title)}” is open.</b> You have met ${words.seen} of its ${words.total} words.`
      : `You have met ${words.seen} of the ${words.total} words in “${esc(t.title)}”. ` +
        `It opens at ${Math.ceil(words.total * OPEN_AT)}.`));
    return show(nodes, [button("Home", "back", home),
      button("Back to the text" + icon("chevron"), "primary grow", () => openText(book, t))]);
  }
  show(nodes, [button("Back to home", "primary grow", home)]);
}

function finish(card, message, correct, moved) {
  results.seen++;
  if (correct) results.correct++;
  if (moved === "box") results.boxes++;
  if (moved === "level") results.levels++;
  save();
  advance();
}

function withArticle(card) {
  if (state.language !== "it" || card.spos !== "noun") return esc(card.w);
  const m = /^([a-zA-Zàèéìòù']+)/.exec((card.art || "").trim());
  const art = m ? m[1].toLowerCase() : "";
  if (!["il", "lo", "la", "l'", "i", "gli", "le"].includes(art)) return esc(card.w);
  const colour = art === "la" || art === "le" ? "var(--fem)" : "var(--masc)";
  return `<span style="color:${colour}">${art}</span>${art.endsWith("'") ? "" : " "}${esc(card.w)}`;
}
/* The word as it is said, article included. */
function wordText(card) {
  const box = document.createElement("div");
  box.innerHTML = withArticle(card);
  return box.textContent;
}

/* --------------------------------------------------------------- listening
   Pronunciation comes from the phone's own voices (the Web Speech API): no
   cost, no key, and it works offline once the voice is on the phone. Words
   have a second button, the turtle, that says them slowly, and a second tap
   on any speaker within a few seconds says it again, slower. */
const speech = window.speechSynthesis || null;
let voices = [];
function loadVoices() {
  try { voices = speech ? speech.getVoices() : []; } catch { voices = []; }
}
if (speech) {
  loadVoices();
  if (speech.addEventListener) speech.addEventListener("voiceschanged", loadVoices);
}
// each collection names its own language, so "TUR" and "Turkish" have to
// land on the same voice as "tr"
const LANG_ALIASES = {
  ita: "it", italian: "it", tur: "tr", turkish: "tr", deu: "de", ger: "de", german: "de",
  fra: "fr", fre: "fr", french: "fr", spa: "es", spanish: "es", por: "pt", portuguese: "pt",
  eng: "en", english: "en", nld: "nl", dut: "nl", dutch: "nl", rus: "ru", russian: "ru",
  pol: "pl", polish: "pl", swe: "sv", swedish: "sv", ell: "el", gre: "el", greek: "el",
  ara: "ar", arabic: "ar", jpn: "ja", japanese: "ja", zho: "zh", chi: "zh", chinese: "zh",
  kor: "ko", korean: "ko", ukr: "uk", ukrainian: "uk", ron: "ro", rum: "ro", romanian: "ro",
  ces: "cs", cze: "cs", czech: "cs", hun: "hu", hungarian: "hu", fin: "fi", finnish: "fi",
  dan: "da", danish: "da", no: "nb", nor: "nb", nob: "nb", norwegian: "nb", heb: "he",
  hebrew: "he", hin: "hi", hindi: "hi", fas: "fa", per: "fa", persian: "fa", cat: "ca", catalan: "ca"
};
function speechLang(s) {
  s = s || state || {};
  for (const name of [s.language, s.language_name]) {
    const key = (name || "").trim().toLowerCase();
    const base = key.split(/[-_ ]/)[0];
    if (LANG_ALIASES[key]) return LANG_ALIASES[key];
    if (LANG_ALIASES[base]) return LANG_ALIASES[base];
    if (/^[a-z]{2}$/.test(base)) return base;
  }
  return "";
}
const voiceTag = v => (v.lang || "").toLowerCase().replace("_", "-");
/* Every voice this device has for the language, the better ones first: the
   ones a phone can download, then the joke voices last. */
function voicesFor(lang) {
  const mine = voices.filter(v => voiceTag(v).split("-")[0] === lang ||
                                  (lang === "nb" && voiceTag(v).split("-")[0] === "no"));
  const score = v => (/premium/i.test(v.name) ? 8 : /enhanced|neural|natural/i.test(v.name) ? 4 : 0) +
    (voiceTag(v) === `${lang}-${lang}` ? 2 : 0) + (v.localService ? 1 : 0) -
    (/^(eddy|flo|grandma|grandpa|reed|rocko|sandy|shelley)\b/i.test(v.name) ? 6 : 0);
  return mine.sort((a, b) => score(b) - score(a));
}
/* The voice picked in Settings when this device still has it, otherwise
   the best one. Voices belong to each device, so the choice is kept here. */
function voiceFor(lang) {
  const mine = voicesFor(lang);
  const chosen = (prefs.voices || {})[lang];
  return (chosen && (mine.find(v => v.voiceURI === chosen) || mine.find(v => v.name === chosen))) ||
    mine[0] || null;
}
/* "Turkish" rather than whatever short code the collection was given. */
function languageName(lang) {
  try {
    const name = lang && new Intl.DisplayNames(["en"], { type: "language" }).of(lang);
    if (name && name !== lang) return name;
  } catch {}
  return state.language_name || state.language || "this language's";
}
/* Where voices are added, on the device the app is open on. Browsers on a
   computer use the system's voices; Edge also brings its own for most
   languages, and Chrome brings a few (Italian, but not Turkish). */
function voiceHelp() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1))
    return "Add one under Settings › Accessibility › Spoken Content › Voices, then try again.";
  if (/Android/.test(ua))
    return "Add it in the phone's text-to-speech settings (Speech Services by Google › " +
           "Install voice data), then try again.";
  if (/Windows/.test(ua)) {
    const add = "add one to Windows under Settings › Time & language › Speech › Add voices, " +
                "then close and reopen the browser.";
    return /Edg\//.test(ua) ? "A" + add.slice(1)
      : "Microsoft Edge has one built in, so the app can speak it there. Or " + add;
  }
  if (/Macintosh/.test(ua))
    return "Add one under System Settings › Accessibility › Spoken Content › System voice › " +
           "Manage Voices, then close and reopen the browser.";
  return "Add a voice for it in the device's speech settings, then close and reopen the browser.";
}
let lastSaid = { text: "", at: 0 };
const SLOW_RATE = 0.5;
/* `how.slow` is the turtle; `how.auto` is the app speaking by itself, which
   stays quiet where there is no voice rather than asking on every card. */
function say(text, from, how = {}) {
  if (!speech || !text) return;
  if (!voices.length) loadVoices();
  const lang = speechLang();
  const voice = lang ? voiceFor(lang) : null;
  if (voices.length && !voice) {
    if (how.auto) return;
    const name = languageName(lang);
    return notify(`This browser has no ${name} voice yet. ${voiceHelp()}`, `No ${name} voice here`);
  }
  const plainTap = !how.slow && !how.auto;
  const slower = how.slow || (plainTap && lastSaid.text === text && Date.now() - lastSaid.at < 6000);
  speech.cancel();
  const line = new SpeechSynthesisUtterance(text);
  if (voice) line.voice = voice;
  line.lang = voice ? voice.lang : lang;
  line.rate = slower ? SLOW_RATE : 0.92;
  // only a tap on the speaker counts towards "again, slower"
  lastSaid = plainTap ? { text, at: Date.now() } : { text: "", at: 0 };
  document.querySelectorAll(".say.speaking").forEach(b => b.classList.remove("speaking"));
  if (from) {
    from.classList.add("speaking");
    line.onend = line.onerror = () => from.classList.remove("speaking");
  }
  speech.speak(line);
}
/* A round button that says `text`, or with `slow` the turtle that says it
   slowly; nothing at all where the phone cannot speak. */
function sayButton(text, slow) {
  text = (text || "").trim();
  if (!speech || !text) return null;
  const b = el("button", "say" + (slow ? " slow" : ""), icon(slow ? "slow" : "speaker"));
  b.type = "button";
  b.setAttribute("aria-label", slow ? "Listen slowly" : "Listen");
  b.title = slow ? "Listen slowly, to repeat it" : "Listen. Tap again to hear it slower.";
  b.addEventListener("click", event => { event.stopPropagation(); say(text, b, { slow: !!slow }); });
  return b;
}
/* Both speeds together: as it is said, and slowly enough to repeat. */
function sayPair(text) {
  const normal = sayButton(text);
  if (!normal) return null;
  const pair = el("span", "says");
  pair.append(normal, sayButton(text, true));
  return pair;
}
function withSay(face, text) {
  const pair = sayPair(text);
  if (pair) face.appendChild(pair);
  return face;
}

/* In a session the word is said by itself: when the card shows it, and when
   it was the answer, once it has been answered. The speaker in the session
   bar turns this off for the whole phone, for a quiet train, say. */
let autoSay = true;
/* Choices kept for this device, whichever language is open: whether words
   are said by themselves, how many words a session has, the voice picked for
   each language and the last free-practice set-up. */
let prefs = { autoSay: true, size: 30, voices: {}, practice: {} };
function savePrefs() { idbSet("prefs", { ...prefs, autoSay }).catch(() => {}); }
const SESSION_SIZES = [10, 20, 30, 50];
const sessionSize = () => SESSION_SIZES.includes(prefs.size) ? prefs.size : 30;
const soundBtn = document.getElementById("sound");
function paintSound() {
  soundBtn.classList.toggle("hidden", !speech);
  soundBtn.innerHTML = icon(autoSay ? "speaker" : "mute");
  soundBtn.classList.toggle("off", !autoSay);
  soundBtn.setAttribute("aria-pressed", String(autoSay));
  soundBtn.setAttribute("aria-label", "Say words aloud by themselves");
  soundBtn.title = autoSay ? "Words are said aloud. Tap to stop." : "Words are not said aloud. Tap to hear them.";
}
soundBtn.addEventListener("click", () => {
  autoSay = !autoSay;
  paintSound();
  savePrefs();
  if (!autoSay && speech) speech.cancel();
  flash(autoSay ? "Words will be said aloud." : "Words won't be said aloud. The speakers still work.");
});
paintSound();
function sayAuto(text) {
  if (!autoSay) return;
  const face = main.querySelector(".face");
  say(text, face && face.querySelector(".says > .say:not(.slow)"), { auto: true });
}
/* Once answered, the answer can be heard: said by itself, and from the
   card's own speakers for as long as the card is up. */
function sayAnswer(text) {
  const face = main.querySelector(".face");
  if (face && !face.querySelector(":scope > .says")) withSay(face, text);
  sayAuto(text);
}

/* ------------------------------------------------------------ word details
   Everything the desktop knows about a word in one sheet: its meanings with
   their examples and notes, the example sentences, the explanations and the
   usual phrases, each with a button to hear it. Opened from the card once a
   word has been answered, and from the Words tab. */
function wordSheet(card) {
  const before = primaryButton;
  const veil = el("div", "veil");
  const box = el("div", "sheet details");
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  box.setAttribute("aria-label", card.w);

  const head = el("div", "head");
  head.appendChild(el("div", "prompt", withArticle(card)));
  const sayWord = sayPair(wordText(card));
  if (sayWord) head.appendChild(sayWord);
  box.appendChild(head);
  const tags = [card.pos || card.spos, card.cefr,
                isReadingWord(card) ? "from reading"
                  : card.topic && card.topic !== "general" ? card.topic : ""].filter(Boolean);
  if (tags.length) box.appendChild(el("div", "tags", esc(tags.join(" · "))));
  if (card.en) box.appendChild(el("div", "gloss", esc(card.en)));

  // a line in the language, its English, a note, and a button to hear it
  const line = (text, en, note, marked) => {
    const row = el("div", "line");
    row.appendChild(el("div", "txt",
      `<div class="it">${marked || esc(text)}</div>` +
      (en ? `<div class="en">${esc(en)}</div>` : "") +
      (note ? `<div class="note">${esc(note)}</div>` : "")));
    const play = sayButton(text);
    if (play) row.appendChild(play);
    return row;
  };
  const section = title => box.appendChild(el("div", "label", title));
  // the word itself is marked in a sentence: where the sentence says it is,
  // or else wherever its spelling turns up
  const mark = (text, a, b) => {
    a = Number(a); b = Number(b);
    if (!(Number.isInteger(a) && Number.isInteger(b) && a >= 0 && b > a && b <= text.length)) {
      a = text.toLowerCase().indexOf((card.w || "").toLowerCase());
      b = a + (card.w || "").length;
      if (a < 0 || !card.w) return "";
    }
    return esc(text.slice(0, a)) + `<mark>${esc(text.slice(a, b))}</mark>` + esc(text.slice(b));
  };

  const senses = (card.senses || []).filter(s => s.gloss);
  const shown = new Set();
  if (senses.length > 1 || senses.some(s => s.ex || s.note)) {
    section(senses.length === 1 ? "Meaning" : "Meanings");
    senses.forEach((s, i) => {
      box.appendChild(el("div", "sense", (senses.length > 1 ? `${i + 1}. ` : "") + esc(s.gloss)));
      if (s.ex) {
        shown.add(s.ex.trim());
        box.appendChild(line(s.ex, s.ex_en, s.note, mark(s.ex)));
      } else if (s.note) box.appendChild(el("div", "note-only", esc(s.note)));
    });
  }
  const examples = (card.sentences || []).filter(s => s.it && !shown.has(s.it.trim()));
  examples.forEach(s => shown.add(s.it.trim()));
  if (card.ex && !shown.has(card.ex.trim())) examples.push({ it: card.ex, en: "" });
  if (examples.length) {
    section(examples.length === 1 ? "Example" : "Examples");
    for (const s of examples) box.appendChild(line(s.it, s.en, "", mark(s.it, s.a, s.b)));
  }
  if (card.explain_native || card.explain) {
    section("Explanation");
    box.appendChild(card.explain_native ? line(card.explain_native, card.explain)
      : el("div", "line", `<div class="txt">${esc(card.explain)}</div>`));
  }
  if (Array.isArray(card.reading_texts)) {
    const refs = readingTextRefs(card);
    section("Reading texts");
    if (!refs.length) {
      box.appendChild(el("div", "line", '<div class="txt muted">Not covered by a reading text yet.</div>'));
    } else {
      for (const ref of refs) {
        const kind = ref.match === "mapped" ? "lemma mapped" : "exact wording";
        box.appendChild(el("div", "line", `<div class="txt"><div class="it">${esc(ref.title || ref.id)}</div>` +
          `<div class="en">${esc([ref.level, ref.id, kind].filter(Boolean).join(" · "))}</div></div>`));
      }
    }
  }
  const phrases = (card.coll || "").split(/\s*[;|\n]\s*/).filter(Boolean);
  if (phrases.length) {
    section("Common phrases");
    for (const phrase of phrases) box.appendChild(line(phrase, "", "", mark(phrase)));
  }

  const s = stageOf(card);
  const when = s.stage < 4 && !card.suspended ? dueText(card.due) : "";
  box.appendChild(el("div", "stat-line",
    esc(s.short) + (s.box ? ` · box ${s.box}` : "") +
    (when ? ` · ${when === "due now" ? when : "next review " + when}` : "") +
    (card.reviews ? ` · ${card.correct || 0} of ${card.reviews} answers right` : "")));

  function onKey(event) { if (event.key === "Escape") { event.preventDefault(); done(); } }
  function done() {
    if (speech) speech.cancel();
    document.removeEventListener("keydown", onKey, true);
    veil.remove();
    primaryButton = before;
  }
  const row = el("div", "actions");
  const close = button("Close", "primary", done);
  row.appendChild(close);
  box.appendChild(row);
  document.addEventListener("keydown", onKey, true);
  veil.addEventListener("click", event => { if (event.target === veil) done(); });
  veil.appendChild(box);
  document.body.appendChild(veil);
  // after button()'s own deferred pick of the footer's primary, so Enter
  // closes the sheet rather than pressing Next underneath it
  setTimeout(() => {
    if (!document.contains(veil)) return;
    primaryButton = close;
    close.focus({ preventScroll: true });
  }, 0);
}

/* ------------------------------------------------------------------ reading
   Graded texts from A1 to B2 in the open language, written for this app and
   kept in reading/<language>.json. Each text glosses its key words, and the
   texts are written so that words from earlier ones come back in later ones:
   a word met once is met again, marked, so the reader can check it stuck.
   Words tapped while reading go into the main list straight into flashcards,
   with the sentence they were met in, and are remembered here as reading
   words, since the desktop relabels the topic of words made on the phone. */
const LEVELS = [["A1", "Beginner", "var(--s1)"], ["A2", "Elementary", "var(--s2)"],
                ["B1", "Intermediate", "var(--s3)"], ["B2", "Upper intermediate", "var(--s4)"]];
const WORD_RE = /\p{L}+(?:['’]\p{L}+)*/gu;
const CONTENT_POS = ["noun", "verb", "adjective", "adverb"];
const books = {};
let readSession = null;      // the text open now: { t, recall: {lemma: remembered?}, answers }

async function loadBook() {
  const lang = speechLang();
  if (!lang) return null;
  if (books[lang]) return books[lang];
  try {
    const response = await fetch(`reading/${lang}.json`);
    if (!response.ok) return null;
    books[lang] = prepareBook(await response.json(), lang);
  } catch { return null; }
  return books[lang];
}
/* Texts in level order, and for each one which of its words are new and
   which were first glossed in an earlier text. */
function prepareBook(data, lang) {
  const rank = level => LEVELS.findIndex(([l]) => l === level);
  const texts = (data.texts || []).slice().sort((a, b) => rank(a.level) - rank(b.level));
  const firstIn = {};
  for (const t of texts) {
    const lemmas = [...new Set(Object.values(t.words || {}))];
    t.fresh = lemmas.filter(l => !firstIn[l]);
    t.fresh.forEach(l => { firstIn[l] = t; });
    t.again = lemmas.filter(l => firstIn[l] !== t);
    t.size = t.p.flat().reduce((n, [s]) => n + (s.match(WORD_RE) || []).length, 0);
    t.longest = Math.max(1, ...Object.keys(t.words || {}).map(k => k.split(" ").length));
  }
  return { lang, dict: data.dict || {}, texts, firstIn };
}
const reading = () => readingOf(state);
const wordKey = w => keyIn(state)(w);
const cardIndex = () => new Map(state.cards.map(c => [wordKey(c.w), c]));
function findCard(w) { return cardIndex().get(wordKey(w)) || null; }
function isReadingWord(card) {
  return !!(state && state.reading && state.reading.words && state.reading.words[wordKey(card.w)]);
}
function readingTextRefs(card) {
  return Array.isArray(card && card.reading_texts)
    ? card.reading_texts.filter(ref => ref && ref.id)
    : [];
}
function readingWords() {
  const words = reading().words;
  return state.cards.filter(isReadingWord)
    .sort((a, b) => (words[wordKey(b.w)].at || "").localeCompare(words[wordKey(a.w)].at || ""));
}
/* A dictionary entry as it is said: Italian nouns with their article. */
function dictWord(book, lemma) {
  const art = (book.dict[lemma] || [])[2];
  return art ? art + (art.endsWith("'") ? "" : " ") + lemma : lemma;
}
const contentFirst = (book, lemmas) => {
  const content = lemmas.filter(l => CONTENT_POS.includes((book.dict[l] || [])[1]));
  return content.length >= 3 ? content : lemmas;
};
const shuffle = list => list.map(x => [Math.random(), x]).sort((a, b) => a[0] - b[0]).map(p => p[1]);

/* Which entry a word in the text belongs to. Italian elides ("all'università"),
   Turkish puts suffixes after an apostrophe on names ("Boğaz'ın"), so the
   part that carries the meaning is tried as well. Returns the entry (or
   none), a base form to offer when there is none, and where in the token
   the meaningful part sits. */
function lookupToken(book, t, token) {
  const low = token.toLocaleLowerCase(book.lang);
  const tries = [[low, 0]];
  const cut = low.search(/['’]/);
  if (cut > 0) {
    const before = [low.slice(0, cut), 0], after = [low.slice(cut + 1), cut + 1];
    if (book.lang === "tr") tries.push(before); else tries.push(after, before);
  }
  for (const [form, off] of tries)
    if (t.words[form]) return { lemma: t.words[form], base: form, off, len: form.length };
  const [base, off] = tries[1] || tries[0];
  return { lemma: null, base, off, len: base.length };
}
/* The words of a sentence as the reader taps them. A phrase the text glosses
   as one ("öğleden sonra", "fare la spesa") stays one piece, so tapping it
   gives the phrase rather than half of it. Longest phrase first. */
function pieces(book, t, sentence) {
  const words = [...sentence.matchAll(WORD_RE)];
  const end = k => words[k].index + words[k][0].length;
  const out = [];
  for (let i = 0; i < words.length; i++) {
    let last = i;
    for (let j = Math.min(i + t.longest - 1, words.length - 1); j > i; j--) {
      let joined = true;
      for (let k = i + 1; k <= j && joined; k++) joined = sentence.slice(end(k - 1), words[k].index) === " ";
      if (!joined) continue;
      const hit = lookupToken(book, t, sentence.slice(words[i].index, end(j)));
      if (hit.lemma && hit.base.includes(" ")) { last = j; break; }
    }
    out.push({ index: words[i].index, text: sentence.slice(words[i].index, end(last)) });
    i = last;
  }
  return out;
}
function markToken(book, t, span, index) {
  const { lemma, base } = lookupToken(book, t, span.textContent);
  span.className = "w";
  if (lemma) span.classList.add(t.fresh.includes(lemma) ? "k-new" : "k-old");
  if (index.has(wordKey(lemma || base))) span.classList.add("k-mine");
}
const markIn = (text, at, length) =>
  esc(text.slice(0, at)) + `<mark>${esc(text.slice(at, at + length))}</mark>` + esc(text.slice(at + length));

/* Where a word of the text is first used: its sentence, the translation and
   the place in the sentence, as a tap on it would give. */
function occurrence(book, t, lemma) {
  for (const para of t.p) for (const [sentence, sentenceEn] of para) for (const m of pieces(book, t, sentence)) {
    const hit = lookupToken(book, t, m.text);
    if (hit.lemma === lemma) return { book, t, sentence, sentenceEn, at: m.index, token: m.text, ...hit };
  }
  return null;
}

/* ------------------------------------------------- words before the text
   A text opens once most of its words have been met: 80% of the words it
   explains must be in the learner's words and past the sorting pass. Met is
   enough; learnt is not needed. Until then the text offers a short deck:
   its words not met yet (added from the text when the list lacks them) and
   those of its words that are due. Words in a box and not due are left
   alone. A finished text always opens. */
const OPEN_AT = 0.8;
const met = card => !!card && ((card.stage || 0) >= 1 || !!card.suspended);
function textWords(book, t, index) {
  const rows = [...new Set(Object.values(t.words || {}))]
    .map(lemma => ({ lemma, card: index.get(wordKey(lemma)) || null }));
  const seen = rows.filter(x => met(x.card)).length;
  return { rows, seen, total: rows.length, share: rows.length ? seen / rows.length : 1,
           unseen: rows.filter(x => !met(x.card)),
           due: rows.filter(x => met(x.card) && due(x.card)) };
}
const textOpen = (t, words) => !!reading().done[t.id] || words.share >= OPEN_AT - 1e-9;
function openText(book, t) {
  const words = textWords(book, t, cardIndex());
  return textOpen(t, words) ? readText(book, t) : learnFirst(book, t, words);
}
/* The words the text explains that the learner's list does not have yet go
   in, waiting to be sorted, with their sentence from the text. */
function addTextWords(book, t) {
  const index = cardIndex();
  let added = 0;
  for (const lemma of new Set(Object.values(t.words || {}))) {
    if (index.has(wordKey(lemma)) || !book.dict[lemma]) continue;
    const ctx = occurrence(book, t, lemma) || { t, sentence: "", sentenceEn: "", at: 0, off: 0, len: 0 };
    const [en, pos, art] = book.dict[lemma];
    const card = readingCard(ctx, lemma, en, pos, art, 0);
    index.set(wordKey(card.w), card);
    added++;
  }
  if (added) save();
  return added;
}
/* Sorting first, since that is what opens the text, then the due words. A
   session never stops short of what the text needs to open. */
function learnQueue(book, t) {
  const words = textWords(book, t, cardIndex());
  const unseen = words.unseen.map(x => x.card).filter(c => c && !c.suspended);
  const need = Math.max(0, Math.ceil(words.total * OPEN_AT - 1e-9) - words.seen);
  return unseen.concat(words.due.map(x => x.card)).slice(0, Math.max(sessionSize(), need));
}

function learnFirst(book, t, words) {
  setProgress("", 0); chrome(false);
  words = words || textWords(book, t, cardIndex());
  const pct = Math.round(100 * words.share);
  const target = Math.ceil(words.total * OPEN_AT - 1e-9);
  const missing = words.unseen.filter(x => !x.card).length;
  const toSort = words.unseen.length - missing;
  const intro = el("div", "card");
  intro.innerHTML = `<h2>Meet its words first</h2><div class="muted">You have met <b>${words.seen}</b> ` +
    `of the <b>${words.total}</b> words this text explains (${pct}%). A text opens at 80%, here ` +
    `${target} words, so that you read it rather than decode it. Meeting a word once is enough: ` +
    "it does not have to be learnt yet.</div>" +
    `<div class="meter" style="margin-top:14px"><i style="--c:var(--warn);width:${pct}%"></i></div>`;
  const list = el("div", "list");
  for (const [name, colour, n, title, detail] of [
    ["sort", "var(--s0)", toSort, "To sort", "In your words, not met yet"],
    ["plus", "var(--primary)", missing, "New to your words", "Added from the text, then sorted"],
    ["flash", "var(--s1)", words.due.length, "Due again", "In a box and due today"],
    ["check", "var(--good)", words.seen - words.due.length, "Met, not due", "Left alone"]])
    if (n) list.appendChild(listItem({ lead: icobox(name, colour), title, detail, end: `<b>${n}</b>` }));
  const chips = el("div");
  for (const [title, group] of [["Not met yet", words.unseen], ["Due again", words.due]]) {
    if (!group.length) continue;
    chips.appendChild(el("div", "label chip-head", title));
    const row = el("div", "recall");
    for (const x of group)
      row.appendChild(el("span", "chip-word", esc(x.card ? wordText(x.card) : dictWord(book, x.lemma))));
    chips.appendChild(row);
  }
  // the same count the session will have once the missing words are in
  const deck = Math.min(words.unseen.length + words.due.length,
                        Math.max(sessionSize(), target - words.seen));
  show([metaLine(`${t.level} · ${esc(t.title_en)}`), pageHead(esc(t.title)), intro, list,
        sectionHead("Its words"), chips], [
    button("All texts", "back", () => readScreen()),
    button(`Learn ${deck} word${deck === 1 ? "" : "s"}` + icon("chevron"),
           "primary grow", () => start({ learn: { book, t } }))
  ]);
}

async function readScreen(view) {
  view = view || "texts";
  setProgress("", 0); chrome(false);
  const book = await loadBook();
  const r = reading();
  const mine = readingWords();
  const nodes = [pageHead("Reading", "Short texts from A1 to B2. Each one brings back words " +
    "from the ones before, so you can see whether they stuck.")];
  const seg = el("div", "segment");
  seg.appendChild(button("Texts", view === "texts" ? "on" : "", () => readScreen("texts")));
  seg.appendChild(button(`My reading words${mine.length ? ` · ${mine.length}` : ""}`,
    view === "words" ? "on" : "", () => readScreen("words")));
  nodes.push(seg);

  if (view === "words") {
    if (!mine.length) {
      nodes.push(el("div", "card muted", "Words you add while reading land here, and in your main " +
        "list tagged <span class=\"tag-read\">reading</span>. Open a text and tap any word you don't know."));
    } else {
      const ready = mine.filter(due).length;
      const practise = button(icon("flash") + (ready ? `Practise these · ${ready} due` : "Nothing due yet"),
                              "primary wide", () => start("reading"));
      practise.disabled = !ready;
      practise.style.marginBottom = "14px";
      nodes.push(practise);
      const list = el("div", "list");
      for (const card of mine) {
        const s = stageOf(card);
        const from = book && book.texts.find(t => t.id === r.words[wordKey(card.w)].text);
        list.appendChild(listItem({
          lead: `<span class="dot" style="--c:${s.colour}"></span>`,
          title: withArticle(card),
          detail: esc(card.en) + (from ? ` · from “${esc(from.title)}”` : ""),
          end: `<span class="badge" style="--c:${s.colour}">${s.short}${s.box ? " · " + s.box : ""}</span>`,
          onTap: () => wordSheet(card)
        }));
      }
      nodes.push(list);
    }
  } else if (!book) {
    nodes.push(el("div", "card", `<h2>No texts for ${esc(languageName(speechLang()))} yet</h2>` +
      '<div class="muted">The reading texts are written for Italian and Turkish. If this is one of ' +
      "them, open this tab once while online so the phone can keep a copy.</div>"));
  } else {
    const next = book.texts.find(t => !r.done[t.id]);
    const index = cardIndex();
    nodes.push(el("div", "muted read-note", `${icon("lock")}<span>A text opens once you have met 80% of ` +
      "its words. Tap a closed one to meet them first.</span>"));
    for (const [level, name, colour] of LEVELS) {
      const texts = book.texts.filter(t => t.level === level);
      if (!texts.length) continue;
      nodes.push(sectionHead(`${level} · ${name}`));
      const list = el("div", "list");
      for (const t of texts) {
        const done = r.done[t.id];
        const words = textWords(book, t, index);
        const open = textOpen(t, words);
        const pct = Math.round(100 * words.share);
        list.appendChild(listItem({
          lead: `<span class="lvl" style="--c:${colour}">${level}</span>`,
          title: esc(t.title),
          detail: `${esc(t.title_en)} · ${Math.max(1, Math.round(t.size / 90))} min · ` +
            (done ? `${t.fresh.length} new, ${t.again.length} from before` : `${pct}% of its words met`),
          end: done ? `<span class="badge" style="--c:var(--good)">${icon("check")}${done.score}/${done.total}</span>`
            : !open ? `<span class="badge" style="--c:var(--muted)">${icon("lock")}${pct}%</span>`
            : t === next ? '<span class="badge" style="--c:var(--primary)">Start here</span>' : icon("chevron"),
          onTap: () => open ? readText(book, t) : learnFirst(book, t, words)
        }));
      }
      nodes.push(list);
    }
  }
  show(nodes, tabBar("read"));
}

function readText(book, t) {
  setProgress("", 0); chrome(false);
  if (!readSession || readSession.t !== t) readSession = { t, recall: {}, answers: [] };
  const index = cardIndex();
  const before = el("div", "card before",
    `<div class="label">Before you read</div><div>${esc(t.before)}</div>`);
  // the Reader at Work habit: words from earlier texts are met again, and
  // checked here before they turn up in the text
  const old = contentFirst(book, t.again).slice(0, 10);
  if (old.length) {
    before.appendChild(el("div", "label", "From earlier texts: do you remember?"))
      .style.marginTop = "14px";
    const chips = el("div", "recall");
    for (const lemma of old) {
      const word = esc(dictWord(book, lemma));
      const chip = button(word, "", () => {
        const open = chip.classList.toggle("shown");
        chip.innerHTML = open ? `${word} · <b>${esc(book.dict[lemma][0])}</b>` : word;
      });
      chips.appendChild(chip);
    }
    before.appendChild(chips);
  }
  // an open text can still have a few of its words waiting or due: offered,
  // never required
  const words = textWords(book, t, index);
  const warm = words.unseen.length + words.due.length;
  if (warm) {
    const line = el("div", "warm", `${warm} of its words ${warm === 1 ? "is" : "are"} ` +
      (words.due.length && words.unseen.length ? "due or not met yet."
        : words.due.length ? "due today." : "not met yet."));
    line.appendChild(button("Review them first", "small soft", () => start({ learn: { book, t } })));
    before.appendChild(line);
  }
  const key = el("div", "key",
    '<span><i class="k-new">new</i>key word</span><span><i class="k-old">met</i>from before</span>' +
    '<span><i class="k-mine">word</i>in your words</span><span>Tap any word</span>');

  const body = el("div", "reader");
  t.p.forEach((para, i) => {
    const block = el("div", "para");
    block.appendChild(el("span", "pnum", String(i + 1)));
    const text = el("div", "ptext");
    para.forEach(([sentence], j) => {
      let last = 0;
      for (const m of pieces(book, t, sentence)) {
        if (m.index > last) text.appendChild(document.createTextNode(sentence.slice(last, m.index)));
        const span = el("span", "w");
        span.textContent = m.text;
        Object.assign(span.dataset, { i, j, a: m.index });
        markToken(book, t, span, index);
        text.appendChild(span);
        last = m.index + m.text.length;
      }
      text.appendChild(document.createTextNode(sentence.slice(last) + " "));
    });
    block.appendChild(text);
    const tools = el("div", "ptools");
    const said = para.map(([s]) => s).join(" ");
    const play = sayButton(said);
    if (play) tools.append(play, sayButton(said, true));
    const english = el("div", "ptrans hidden", esc(para.map(([, en]) => en).join(" ")));
    tools.appendChild(button("English", "small soft", () => english.classList.toggle("hidden")));
    block.append(tools, english);
    body.appendChild(block);
  });
  body.addEventListener("click", event => {
    const span = event.target.closest(".w");
    if (!span) return;
    body.querySelectorAll(".w.tapped").forEach(s => s.classList.remove("tapped"));
    span.classList.add("tapped");
    tapWord(book, t, span);
  });
  readSession.refresh = () => {
    const now = cardIndex();
    body.querySelectorAll(".w").forEach(span => markToken(book, t, span, now));
  };
  show([metaLine(`${t.level} · ${esc(t.title_en)}`), pageHead(esc(t.title)), before, key, body], [
    button("All texts", "back", () => readScreen()),
    button("Questions" + icon("chevron"), "primary grow", () => startQuestions(book, t))
  ]);
}

/* A bottom sheet for the reader's small questions. */
function openSheet(nodes) {
  const before = primaryButton;
  const veil = el("div", "veil");
  const box = el("div", "sheet details");
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  nodes.filter(Boolean).forEach(n => box.appendChild(n));
  const actions = el("div", "actions");
  box.appendChild(actions);
  function onKey(event) { if (event.key === "Escape") { event.preventDefault(); close(); } }
  function close() {
    if (speech) speech.cancel();
    document.removeEventListener("keydown", onKey, true);
    veil.remove();
    primaryButton = before;
  }
  document.addEventListener("keydown", onKey, true);
  veil.addEventListener("click", event => { if (event.target === veil) close(); });
  veil.appendChild(box);
  document.body.appendChild(veil);
  // after button()'s own deferred pick, so Enter answers the sheet
  const primary = b => setTimeout(() => { if (document.contains(veil)) primaryButton = b; }, 0);
  return { box, actions, close, primary };
}
function sheetHead(text) {
  const head = el("div", "head");
  head.appendChild(el("div", "prompt", esc(text)));
  const play = sayPair(text);
  if (play) head.appendChild(play);
  return head;
}
/* The sentence a word was tapped in, with the word marked. */
function sentenceLine(ctx, withEnglish) {
  const row = el("div", "line");
  row.appendChild(el("div", "txt",
    `<div class="it">${markIn(ctx.sentence, ctx.at + ctx.off, ctx.len)}</div>` +
    (withEnglish && ctx.sentenceEn ? `<div class="en">${esc(ctx.sentenceEn)}</div>` : "")));
  const play = sayButton(ctx.sentence);
  if (play) row.appendChild(play);
  return row;
}

function tapWord(book, t, span) {
  const [sentence, sentenceEn] = t.p[span.dataset.i][span.dataset.j];
  const token = span.textContent;
  const hit = lookupToken(book, t, token);
  const ctx = { book, t, token, sentence, sentenceEn, at: Number(span.dataset.a), ...hit };
  const card = findCard(hit.lemma || hit.base);
  // a word from an earlier text is a chance to check it stuck, once per reading
  if (hit.lemma && !t.fresh.includes(hit.lemma) && !(hit.lemma in readSession.recall))
    return recallSheet(ctx, card);
  if (card) return wordSheet(card);
  addWordSheet(ctx);
}

function recallSheet(ctx, card) {
  const { book, lemma } = ctx;
  const first = book.firstIn[lemma];
  const meaning = el("div", "gloss hidden", esc(book.dict[lemma][0]));
  const s = openSheet([
    sheetHead(dictWord(book, lemma)),
    el("div", "tags", `You met this in “${esc(first.title)}” (${first.level}). Do you remember what it means?`),
    meaning,
    sentenceLine(ctx, false)
  ]);
  const reveal = button("Show the meaning", "primary", () => {
    meaning.classList.remove("hidden");
    s.box.querySelector(".line").replaceWith(sentenceLine(ctx, true));
    s.actions.innerHTML = "";
    const yes = button(icon("check") + "I remembered it", "primary", () => {
      readSession.recall[lemma] = true;
      s.close();
    });
    const no = button(card ? "I forgot it (it's in my words)" : "I forgot it: add it to my words", "", () => {
      readSession.recall[lemma] = false;
      s.close();
      if (card) return flash(`${card.w} is in your words already, so it will come back in practice.`);
      const entry = book.dict[lemma];
      addFromText(ctx, lemma, entry[0], entry[1], entry[2]);
    });
    s.actions.append(yes, no);
    s.primary(yes);
  });
  s.actions.appendChild(reveal);
  s.primary(reveal);
}

function addWordSheet(ctx) {
  const { book, t, lemma } = ctx;
  const entry = lemma && book.dict[lemma];
  if (entry) {
    const s = openSheet([
      sheetHead(dictWord(book, lemma)),
      el("div", "tags", esc([entry[1], t.fresh.includes(lemma) ? "new in this text" : ""]
        .filter(Boolean).join(" · "))),
      el("div", "gloss", esc(entry[0])),
      sentenceLine(ctx, true)
    ]);
    const add = button(icon("plus") + "Add to my words", "primary", () => {
      s.close();
      addFromText(ctx, lemma, entry[0], entry[1], entry[2]);
    });
    s.actions.append(add, button("Close", "", s.close));
    s.primary(add);
    return;
  }
  // a word the text does not gloss: the reader names it, helped by the
  // sentence and its translation
  const word = el("input"), meaning = el("input");
  word.value = ctx.base;
  meaning.placeholder = "what it means here";
  for (const input of [word, meaning]) {
    input.autocapitalize = "none"; input.autocomplete = "off"; input.spellcheck = false;
  }
  const s = openSheet([
    el("h2", "", "Add a word from the text"),
    sentenceLine(ctx, true),
    field("Word, in its dictionary form", word),
    field("Meaning in English", meaning)
  ]);
  const add = button(icon("plus") + "Add to my words", "primary", () => {
    if (!word.value.trim() || !meaning.value.trim())
      return flash("The word and its meaning are both needed.");
    s.close();
    addFromText(ctx, word.value, meaning.value, "", "");
  });
  meaning.addEventListener("keydown", event => { if (event.key === "Enter") add.click(); });
  s.actions.append(add, button("Close", "", s.close));
  s.primary(add);
  setTimeout(() => meaning.focus(), 60);
}

/* The word joins the main list straight into flashcards (tapping it was
   saying it is new), with the sentence it was met in as its example and as
   a gap sentence, so the gap and translation exercises can use it too. */
function addFromText(ctx, w, en, pos, art) {
  const card = findCard(w) || readingCard(ctx, w, en, pos, art, 1);
  reading().words[wordKey(card.w)] = { text: ctx.t.id, at: nowStr() };
  save();
  if (readSession && readSession.refresh) readSession.refresh();
  flash(`${card.w} added to your words, with this sentence.`);
  return card;
}

/* A new card made from a word of a text: into flashcards (stage 1) when the
   reader tapped it as unknown, or waiting to be sorted (stage 0) when it
   came in with the words a text needs. Either way it is a reading word. */
function readingCard(ctx, w, en, pos, art, stage) {
  w = w.trim(); en = en.trim();
  const a = ctx.at + (ctx.off || 0), b = a + (ctx.len || 0);
  const card = { w, en, pos: pos || "", spos: sposFor(pos), art: art || "",
    coll: "", ex: ctx.sentence || "", topic: "reading", cefr: ctx.t.level, explain: "", explain_native: "",
    stage, box: 1, mbox: 1, marks: 0, flags: 0, due: todayStr(), reviews: 0, correct: 0,
    lapses: 0, manual: 1, updated_at: nowStr(), senses: [],
    sentences: ctx.sentence && b > a ? [{ it: ctx.sentence, en: ctx.sentenceEn || "",
      surface: ctx.sentence.slice(a, b), a, b, tag: "reading" }] : [] };
  state.cards.push(card);
  reading().words[wordKey(card.w)] = { text: ctx.t.id, at: nowStr() };
  return card;
}
/* The desktop's short part-of-speech names, which the filters use. */
const SPOS = { noun: "noun", verb: "verb", adjective: "adj", adj: "adj", adverb: "adv", adv: "adv",
  expression: "phrase", phrase: "phrase", number: "num", num: "num", pronoun: "func",
  preposition: "func", conjunction: "func", article: "func", determiner: "func", func: "func" };
function sposFor(pos) {
  const p = (pos || "").trim().toLowerCase();
  if (!p) return "";
  return SPOS[p] || SPOS[p.split(/[\/ ]/)[0]] || (p.includes("expression") ? "phrase" : "other");
}

/* -------------------------------------------------------- reading questions
   Exam-style questions after each text: true / false / not given, details,
   what a word refers to, a meaning guessed from context and the main idea.
   Then the words: two met in earlier texts and two new here, each shown in
   its sentence from the text. */
function vocabQuestions(book, t) {
  const old = shuffle(contentFirst(book, t.again)).slice(0, 2);
  const fresh = shuffle(contentFirst(book, t.fresh)).slice(0, 4 - old.length);
  return [...old.map(l => [l, "old"]), ...fresh.map(l => [l, "new"])].map(([lemma, kind]) => {
    const [right, pos] = book.dict[lemma];
    const pool = Object.entries(book.dict).filter(([k, v]) => k !== lemma && v[0] !== right);
    const same = pool.filter(([, v]) => v[1] === pos);
    const o = shuffle([right, ...shuffle(same.length >= 3 ? same : pool).slice(0, 3).map(([, v]) => v[0])]);
    const where = occurrence(book, t, lemma);
    const ctx = where ? markIn(where.sentence, where.at + where.off, where.len) : "";
    return { t: "vocab", kind, lemma, q: dictWord(book, lemma), en: "What does it mean here?", o,
      a: o.indexOf(right), ctx, why: `It means “${right}”.` +
        (kind === "old" ? ` You first met it in “${book.firstIn[lemma].title}”.` : "") };
  });
}

function startQuestions(book, t) {
  if (!readSession || readSession.t !== t) readSession = { t, recall: {}, answers: [] };
  readSession.answers = [];
  askQuestion(book, t, t.q.concat(vocabQuestions(book, t)), 0);
}

function askQuestion(book, t, list, i) {
  const q = list[i];
  const kinds = { tf: t.level === "A1" ? "True or false?" : "True, false or not given?",
    mc: "Detail", ref: "What does it refer to?", context: "Guess from context", main: "Main idea",
    vocab: q.kind === "old" ? "A word from before" : "A new word" };
  const card = el("div", "face text qcard");
  if (q.t === "vocab") {
    card.appendChild(el("div", "prompt", esc(q.q)));
    if (q.ctx) card.appendChild(el("div", "ctx", q.ctx));
  } else {
    card.appendChild(el("div", "qtext", esc(q.q)));
  }
  const english = el("div", "muted qen", esc(q.en));
  // from B1 the question is read in the language, with English on request
  const hideEnglish = ["B1", "B2"].includes(t.level) && q.t !== "vocab";
  if (hideEnglish) english.classList.add("hidden");
  card.appendChild(english);
  if (hideEnglish) {
    const show_ = button("English", "small soft", () => { english.classList.remove("hidden"); show_.remove(); });
    show_.style.marginTop = "10px";
    card.appendChild(show_);
  }
  const say_ = sayButton(q.q);     // every question is in the language being learned
  if (say_) card.appendChild(say_);

  const choices = q.t === "tf"
    ? [["T", "True"], ["F", "False"], ["NG", "Not given"]].slice(0, t.level === "A1" ? 2 : 3)
    : q.o.map((text, k) => [k, text]);
  const opts = el("div", "opts");
  const feedback = el("div", "feedback left hidden");
  const next = button(i + 1 < list.length ? "Next" : "See how you did", "primary grow", () =>
    i + 1 < list.length ? askQuestion(book, t, list, i + 1) : readingSummary(book, t, list));
  next.disabled = true;
  const buttons = choices.map(([value, text]) => {
    const b = button(esc(text), "", () => {
      if (!next.disabled) return;
      const right = value === q.a;
      readSession.answers[i] = right;
      if (q.t === "vocab" && q.kind === "old" && !(q.lemma in readSession.recall))
        readSession.recall[q.lemma] = right;
      b.classList.add(right ? "right" : "wrong");
      buttons.forEach(([v, other]) => { other.disabled = true; if (v === q.a) other.classList.add("right"); });
      feedback.innerHTML = `<b class="${right ? "good" : "bad"}">${right ? "Right." : "Not quite."}</b> ` +
        esc(q.why) + (q.p ? ` <span class="muted">(Paragraph ${q.p}.)</span>` : "");
      feedback.classList.remove("hidden");
      next.disabled = false;
      primaryButton = next;
      requestAnimationFrame(() => feedback.scrollIntoView({ block: "nearest", behavior: "smooth" }));
    });
    opts.appendChild(b);
    return [value, b];
  });
  show([metaLine(`${kinds[q.t] || "Question"} · ${i + 1} of ${list.length}`), card, opts, feedback], [
    button("The text", "back", () => textSheet(t)),
    next
  ]);
}

/* The text on its own, to look back at while answering. */
function textSheet(t) {
  const s = openSheet([el("h2", "", esc(t.title)), ...t.p.map((para, i) => {
    const block = el("div", "para");
    block.appendChild(el("span", "pnum", String(i + 1)));
    block.appendChild(el("div", "ptext", esc(para.map(([s_]) => s_).join(" "))));
    return block;
  })]);
  const back = button("Back to the question", "primary", s.close);
  s.actions.appendChild(back);
  s.primary(back);
}

function readingSummary(book, t, list) {
  const right = readSession.answers.filter(Boolean).length;
  const r = reading();
  // each answer is kept, right or wrong, and travels to the other devices
  r.done[t.id] = { score: right, total: list.length, at: nowStr(),
                   answers: list.map((q, i) => !!readSession.answers[i]) };
  save();
  autoSync("text finished");
  const recalled = Object.values(readSession.recall);
  const added = Object.values(r.words).filter(w => w.text === t.id).length;
  const head = el("div", "center");
  head.appendChild(el("div", "done-mark", icon("check")));
  head.appendChild(el("h1", "", "Text finished"));
  head.appendChild(el("div", "muted", right / list.length >= 0.8
    ? "Well read. The words from this text will come back in the next ones."
    : "Worth another read later. Its words will come back in the next texts too."));
  const stats = el("div", "stats");
  stats.style.marginTop = "22px";
  for (const [name, value, label, colour] of [
    ["check", `${right}/${list.length}`, "questions right", "var(--s4)"],
    ["ladder", recalled.length ? `${recalled.filter(Boolean).length}/${recalled.length}` : "–",
     "words from before remembered", "var(--warn)"],
    ["plus", added, added === 1 ? "word added" : "words added", "var(--primary)"]])
    stats.appendChild(el("div", "stat", `${icobox(name, colour)}<b>${value}</b><span>${label}</span>`));
  const next = book.texts[book.texts.indexOf(t) + 1];
  readSession = null;
  show([head, stats], [
    button("All texts", next ? "back" : "primary grow", () => readScreen()),
    next ? button(`Next: ${esc(next.title)}`, "primary grow", () => openText(book, next)) : null
  ]);
}

/* Once a word has been answered, its card opens the full entry. */
function offerDetails(card) {
  const face = main.querySelector(".face");
  if (!face || face.classList.contains("tap")) return;
  face.classList.add("tap");
  face.setAttribute("role", "button");
  face.tabIndex = 0;
  face.setAttribute("aria-label", `Details for ${card.w}`);
  face.appendChild(el("span", "more", `${icon("info")}Details`));
  face.addEventListener("click", () => wordSheet(card));
  face.addEventListener("keydown", event => {
    if (event.key !== "Enter" && event.key !== " ") return;
    event.preventDefault(); event.stopPropagation();
    wordSheet(card);
  });
}

/* --------------------------------------------------------------- exercises */
function viewTriage(card) {
  let hinted = false, done = false;
  const meta = metaLine("Sorting \u00b7 do you already know this word?");
  const prompt = el("div", "prompt", withArticle(card));
  const sub = el("div", "sub", esc(card.pos || ""));
  const hintBox = el("div", "sentence");
  hintBox.style.cssText = "margin-top:14px;font-size:18px;color:var(--muted)";
  hintBox.classList.add("hidden");
  const answer = el("div", "reveal hidden");

  function hintText() {
    const sentence = (card.sentences || []).find(s => s.it);
    if (sentence) return sentence.it;
    if (card.ex) return card.ex;
    if (card.coll) return card.coll;
    // the shape of the English: a nudge, never the meaning itself
    return (card.en || "").split(";")[0].trim().split(" ")
      .map(w => w[0] + " " + "_ ".repeat(Math.max(w.length - 1, 0))).join("  ");
  }
  function decide(verdict) {
    if (done) return;
    done = true;
    if (verdict === "knew" && hinted) verdict = "hinted";
    const message = gradeTriage(card, verdict);
    const outcome = el("div", "accent");
    outcome.textContent = message;
    answer.innerHTML = `<div class="prompt">${esc(card.en)}</div>`;
    answer.appendChild(outcome);
    answer.classList.remove("hidden");
    offerDetails(card);
    foot.innerHTML = "";
    if (verdict !== "new")
      // thinking you know a word and then reading a different meaning is the
      // commonest way this goes wrong, so the verdict can be taken back
      foot.appendChild(button("Not what I thought", "grow", () => {
        outcome.textContent = gradeTriage(card, "new");
        save();
        foot.firstChild.remove();
      }));
    foot.appendChild(button("Next", "primary grow", () => {
      results.seen++; results.correct++;
      save(); advance();
    }));
    primaryButton = foot.querySelector("button.primary");
  }
  const knew = button("I know this", "primary grow", () => decide("knew"));
  show([meta, withSay(faceCard([prompt, sub, hintBox]), wordText(card)), answer], [
    button("New to me", "grow", () => decide("new")),
    button("Hint", "grow", () => {
      if (done) return;
      hinted = true;
      hintBox.textContent = hintText();
      hintBox.classList.remove("hidden");
      knew.textContent = "Now I know it";
    }),
    knew
  ]);
  sayAuto(wordText(card));
}

function viewFlash(card, mode) {
  const itEn = mode === "flash_it_en";
  const meta = metaLine(
    `Flashcards \u00b7 box ${card.box || 1} of 7 \u00b7 ` +
    (itEn ? "native \u2192 English" : "English \u2192 native"));
  const prompt = el("div", "prompt", itEn ? withArticle(card) : esc(card.en));
  const sub = el("div", "sub", esc(card.pos || ""));
  const answer = el("div", "reveal hidden");
  answer.innerHTML = `<div class="prompt">${
    itEn ? esc(card.en) : withArticle(card)}</div>` +
    (card.coll ? `<div class="muted">${esc(card.coll)}</div>` : "") +
    (card.ex ? `<div class="sentence">${esc(card.ex)}</div>` : "");

  const reveal = button("Show answer", "primary grow", () => {
    answer.classList.remove("hidden");
    if (!itEn) sayAnswer(wordText(card));
    offerDetails(card);
    foot.innerHTML = "";
    foot.appendChild(button("Didn't know", "grow", () => grade(false)));
    foot.appendChild(button("Knew it", "primary grow", () => grade(true)));
  });
  function grade(correct) {
    const before = card.stage;
    const message = gradeFlash(card, correct);
    result(message, correct, before);
  }
  function result(message, correct, before) {
    answer.appendChild(el("div", "accent", esc(message)));
    foot.innerHTML = "";
    foot.appendChild(button("Next", "primary grow", () =>
      finish(card, message, correct, card.stage > before ? "level" : null)));
  }
  const tip = (card.explain || card.explain_native)
    ? button("What does it mean?", "ghost", () => {
        answer.classList.remove("hidden");
        answer.innerHTML = `<div class="muted">${
          esc(card.explain_native || "")}<br>${esc(card.explain || "")}</div>`;
      }) : null;
  // the word can be heard when it is the question, not when it is the answer
  const face = faceCard([prompt, sub]);
  show([meta, itEn ? withSay(face, wordText(card)) : face, answer], [tip, reveal]);
  if (itEn) sayAuto(wordText(card));
}

function viewMeanings(card) {
  const senses = (card.senses && card.senses.length)
    ? card.senses.map(s => s.gloss) : [card.en];
  let remaining = senses.slice(), found = [], letters = 0, wrongs = 0;
  let unaided = 0, gaveUp = false, reason = "", done = false;
  const hint = makeHint(remaining[0] || "");

  const meta = metaLine(
    `Meanings \u00b7 box 1 of ${LEVEL2_TOP} \u00b7 native \u2192 English \u00b7 ` +
    `${senses.length} meaning${senses.length === 1 ? "" : "s"}` +
    (card.marks ? ` \u00b7 ${card.marks} mark(s)` : ""));
  const prompt = el("div", "prompt", withArticle(card));
  const sub = el("div", "sub", esc(card.pos || ""));
  const slots = el("div", "slots");
  const input = el("input");
  input.placeholder = "type a meaning";
  input.autocapitalize = "none"; input.autocomplete = "off"; input.autocorrect = "off";
  input.enterKeyHint = "go";
  const feedback = el("div", "feedback");

  function paint() {
    slots.innerHTML = "";
    senses.forEach((gloss, i) => {
      const state_ = found.includes(gloss) ? "filled"
        : (done && remaining.includes(gloss)) ? "missed" : "";
      const text = found.includes(gloss) || (done && remaining.includes(gloss))
        ? gloss
        : (remaining[0] === gloss && hint.used ? hint.pattern() : "\u00b7 \u00b7 \u00b7");
      slots.appendChild(el("div", "slot " + state_, esc(text)));
    });
  }
  function submit() {
    if (done) return;
    const typed = input.value.trim();
    if (!typed) return;
    const { hit, near, partial } = matchGloss(typed, remaining);
    if (hit) {
      if (!(hint.used && remaining[0] === hit)) unaided++;
      found.push(hit);
      remaining = remaining.filter(g => g !== hit);
      input.value = ""; feedback.textContent = "";
      paint();
      if (!remaining.length) complete();
      return;
    }
    wrongs++;
    input.value = "";
    const left = WRONG_LIMIT - wrongs;
    if (left <= 0) { reason = `${WRONG_LIMIT} wrong tries`; return revealRest(); }
    if (partial)
      feedback.textContent =
        `Part of it only: this meaning is ${partial.split(" ").length} words \u00b7 ${left} tries left`;
    else if (near) feedback.textContent = `Close, check the spelling \u00b7 ${left} tries left`;
    else {
      const { score, verdict } = closeness(typed, remaining);
      feedback.textContent = `${verdict} (${Math.round(score * 100)}% match) \u00b7 ${left} tries left`;
    }
  }
  function showLetter() {
    if (done || !remaining.length) return;
    // letters go into the first meaning still missing, so the hint has to
    // follow it as earlier ones are answered
    if (hint.word !== remaining[0]) hint.reset(remaining[0]);
    if (!hint.more()) return;
    letters++;
    paint();
    feedback.textContent =
      `${letters} letter(s) of help. ${LETTER_LIMIT} or more sends this word back to flashcards.`;
  }
  function revealRest() { gaveUp = !reason; settle(); }
  function complete() { settle(); }
  function settle() {
    done = true; paint();
    input.disabled = true;                 // so Enter reaches the Next button
    const partial = unaided > 0 && remaining.length > 0 && letters < LETTER_LIMIT;
    const before = card.stage, beforeBox = mbox(card);
    const message = applyLevel2(card, letters, {
      gaveUp: gaveUp && !partial, reason: partial ? "" : reason, partial
    });
    feedback.innerHTML = (remaining.length
      ? "Marked as missed, so these come back tomorrow.<br>" : "Every meaning recalled.<br>") +
      `<span class="accent">${esc(message)}</span>`;
    const context = (card.senses || []).filter(s => s.ex)
      .map(s => `<div><b class="${
        remaining.includes(s.gloss) ? "bad" : "good"}">${esc(s.gloss)}</b> ${
        esc(s.ex)}${s.note ? `<br><span class="muted">${esc(s.note)}</span>` : ""}</div>`).join("");
    if (context) main.appendChild(el("div", "context", context));
    offerDetails(card);
    foot.innerHTML = "";
    foot.appendChild(button("Next", "primary grow", () =>
      finish(card, message, !remaining.length && !letters,
             card.stage > before ? "level" : mbox(card) > beforeBox ? "box" : null)));
  }

  input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  paint();
  show([meta, withSay(faceCard([prompt, sub], "compact"), wordText(card)), slots, input, feedback], [
    button("Show a letter", "", showLetter),
    button("Show the rest", "ghost", revealRest),
    button("Check", "primary grow", submit)
  ]);
  sayAuto(wordText(card));
  setTimeout(() => input.focus(), 60);
}

function viewReverse(card) {
  const senses = (card.senses && card.senses.length)
    ? card.senses.map(s => s.gloss) : [card.en];
  const hint = makeHint(card.w);
  let letters = 0, wrongs = 0, done = false, correct = false, gaveUp = false;

  const meta = metaLine(
    `Meanings \u00b7 box 2 of ${LEVEL2_TOP} \u00b7 English \u2192 native`);
  const prompt = el("div", "prompt", esc(senses.join(";  ")));
  const sub = el("div", "sub", esc(card.pos || ""));
  const shape = el("div", "shape hidden");
  const input = el("input");
  input.placeholder = "type the word";
  input.autocapitalize = "none"; input.autocomplete = "off"; input.autocorrect = "off";
  input.enterKeyHint = "go";
  const feedback = el("div", "feedback");

  function check() {
    if (done) return;
    const typed = input.value.trim();
    if (!typed) return;
    if (looseEq(typed, card.w)) { correct = true; return settle(`<b class="good">Correct.</b> ${esc(card.w)}`); }
    wrongs++;
    input.value = "";
    const left = WRONG_LIMIT - wrongs;
    if (left > 0) {
      const { score, verdict } = closeness(typed, [card.w]);
      feedback.textContent = `${verdict} (${Math.round(score * 100)}% match) \u00b7 ${left} tries left`;
      return;
    }
    settle(`<b class="bad">Not this time.</b> The word is <b>${esc(card.w)}</b>.`);
  }
  function showLetter() {
    if (done || !hint.more()) return;
    letters++;
    shape.textContent = hint.pattern();
    shape.classList.remove("hidden");
    feedback.textContent =
      `${letters} letter(s) of help. ${LETTER_LIMIT} or more sends this word back to flashcards.`;
  }
  function settle(message) {
    done = true;
    input.disabled = true;
    const before = card.stage, beforeBox = mbox(card);
    const applied = applyLevel2(card, letters, {
      wrong: !correct && !gaveUp, gaveUp,
      reason: wrongs >= WRONG_LIMIT ? `${WRONG_LIMIT} wrong tries` : ""
    });
    feedback.innerHTML = message +
      (card.ex ? `<br><span class="muted">${esc(card.ex)}</span>` : "") +
      `<br><span class="accent">${esc(applied)}</span>`;
    sayAnswer(wordText(card));
    offerDetails(card);
    foot.innerHTML = "";
    foot.appendChild(button("Next", "primary grow", () =>
      finish(card, applied, correct && !letters,
             card.stage > before ? "level" : mbox(card) > beforeBox ? "box" : null)));
  }

  input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  const tip = (card.explain || card.explain_native)
    ? button("Tip", "ghost", () => {
        feedback.innerHTML = `<i>${esc(card.explain_native || "")}</i><br>${esc(card.explain || "")}`;
      }) : null;
  show([meta, faceCard([prompt, sub], "compact"), shape, input, feedback], [
    tip, button("Show a letter", "", showLetter),
    button("Show the answer", "ghost", () => { gaveUp = true;
      shape.textContent = card.w; shape.classList.remove("hidden");
      settle(`The word is <b>${esc(card.w)}</b>.`); }),
    button("Check", "primary grow", check)
  ]);
  setTimeout(() => input.focus(), 60);
}

function pickSentence(card, needTranslation) {
  const rows = (card.sentences || []).filter(s => s.surface && s.a >= 0);
  const usable = needTranslation ? rows.filter(s => s.en) : rows;
  const pool = usable.length ? usable : rows;
  return pool.length ? pool[Math.floor(Math.random() * pool.length)] : null;
}

function viewCloze(card, blind) {

      `<br><span class="accent">${esc(message)}</span>`;

function viewTranslate(card, intoNative) {
  const rows = (card.sentences || []).filter(s => s.en);
  if (!rows.length) { card.mbox = Math.min(mbox(card) + 1, LEVEL2_TOP);
                      card.updated_at = nowStr(); return advance(); }
  const row = rows[Math.floor(Math.random() * rows.length)];
  const target = intoNative ? row.it : row.en;
  let hints = 0, done = false;

  const meta = metaLine(
    `Translation \u00b7 box ${intoNative ? 6 : 5} of ${LEVEL2_TOP} \u00b7 ` +
    (intoNative ? "English \u2192 native" : "native \u2192 English"));
  const source = el("div", "sentence", esc(intoNative ? row.en : row.it));
  const instruction = el("div", "instruction",
    intoNative ? `Use <b>${esc(card.w)}</b> somewhere in it.` : "Say what it means.");
  const editor = el("textarea");
  editor.rows = 3; editor.placeholder = "type the whole sentence";
  const report = el("div", "feedback left");

  function check() {
    if (done) return;
    const given = editor.value.trim();
    if (!given) return;
    done = true;
    editor.blur();
    const want = contentWords(target), got = contentWords(given);
    const missing = [...want].filter(w => ![...got].some(g =>
      g === w || g.startsWith(w.slice(0, Math.max(4, w.length - 2)))));
    const score = want.size ? (want.size - missing.length) / want.size : 1;
    const verdict = score >= 0.7 ? ["The content words all line up.", "good"]
      : score >= 0.4 ? ["Some of it lines up.", "accent"]
      : ["This looks like a different sentence.", "bad"];
    report.innerHTML =
      `<span class="${verdict[1]}">${verdict[0]}</span> (${Math.round(score * 100)}% of the key words)` +
      (missing.length ? `<br>Not found: ${esc(missing.slice(0, 6).join(", "))}` : "") +
      `<br><br>Reference: <b>${esc(target)}</b>`;
    if (intoNative) sayAnswer(row.it);
    offerDetails(card);
    foot.innerHTML = "";
    foot.appendChild(button("Not quite", "grow", () => settle(false)));
    foot.appendChild(button("That says it", "primary grow", () => settle(true)));
  }
  function settle(matched) {
    const before = card.stage, beforeBox = mbox(card);
    const message = applyLevel2(card, hints, { wrong: !matched });
    report.innerHTML += `<br><span class="accent">${esc(message)}</span>`;
    finish(card, message, matched && !hints,
           card.stage > before ? "level" : mbox(card) > beforeBox ? "box" : null);
  }
  // the sentence can be heard when it is the one in the language
  const face = faceCard([source], "text");
  show([meta, intoNative ? face : withSay(face, row.it), instruction, editor, report], [
    button("Show a word", "", () => {
      const words = target.split(" ");
      hints++;
      report.innerHTML = `<div class="shape" style="font-size:17px;letter-spacing:.08em">${
        esc(words.map((w, i) => i < hints ? w : "\u00b7".repeat(Math.max(w.length - 1, 2))).join(" "))}</div>`;
    }),
    button("Check", "primary grow", check)
  ]);
  if (!intoNative) sayAuto(row.it);
}

function viewProduce(card) {
  let done = false;
  const meta = metaLine("Writing \u00b7 your own sentence");
  const prompt = el("div", "prompt", withArticle(card));
  const sub = el("div", "sub", esc(card.en));
  const editor = el("textarea");
  editor.rows = 3; editor.placeholder = "write a sentence using this word";
  const report = el("div", "feedback left");

  function check() {
    if (done) return;

    done = true;
    editor.blur();
    const has = usesWord(text, card.w);
    report.innerHTML = has
      ? '<span class="good">The word is there.</span> Does it say what you meant?'
      : `<span class="bad">Your sentence does not contain ${esc(card.w)}.</span>`;

    offerDetails(card);
    foot.innerHTML = "";
    foot.appendChild(button("Not quite", "grow", () => settle(false)));
    if (has) foot.appendChild(button("That works", "primary grow", () => settle(true)));
  }

    card.updated_at = nowStr();
    logReview(card, "produce", ok);

      card.prod = (card.prod || 0) + 1;

        message = "Mastered. Spot-checked in 45 days."; }

        message = `Accepted: ${card.prod} of 3 towards mastered.`; }

    report.innerHTML += `<br><span class="accent">${esc(message)}</span>`;

  show([meta, withSay(faceCard([prompt, sub], "compact"), wordText(card)), editor, report],
       [button("Check", "primary grow", check)]);
