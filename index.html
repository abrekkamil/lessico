/* ------------------------------------------------------------- cloud sync
   The same table the desktop uses, over the same REST endpoint. Only rows
   changed since the last sync are moved, so a sync on mobile data is a few
   kilobytes. Settings live in IndexedDB, not in the page, so they survive. */
function cloudSettings() { return (state && state.cloud) || {}; }
let lastSync = null;

/* The database address and key, kept once for the whole phone. Every
   language normally lives in the same Supabase project, so after the first
   one only a collection name is needed. */
let connection = { url: "", key: "", auto: false };
// the language that was open when "Add a language" was pressed, for Back
let cameFrom = "";

// what the bookmarks go back to when the exchange has to start from scratch
const NO_MARKERS = { pulled_to: "", pushed_to: "", reviews_to: "", reviews_sent: "",
                     pulled_seq: "", reviews_seq: "",
                     reading_sent: "", reading_to: "", reading_seq: "" };

/* The settings are passed in rather than read from `state`, because you can
   switch collection while a sync is still talking to the database. */
async function cloudRequest(method, path, body, cfg) {
  cfg = cfg || cloudSettings();
  if (!cfg.url || !cfg.key) throw new Error("Sync is not set up yet.");
  const response = await fetch(`${cfg.url.replace(/\/$/, "")}/rest/v1/${path}`, {
    method,
    headers: {
      apikey: cfg.key, Authorization: `Bearer ${cfg.key}`,
      "Content-Type": "application/json", Accept: "application/json",
      ...(method === "POST" ? { Prefer: "resolution=merge-duplicates,return=minimal" } : {})
    },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (!response.ok) {
    const text = await response.text();
    let code = "";
    try { code = JSON.parse(text).code || ""; } catch (e) { /* not JSON */ }
    if (response.status === 401 || response.status === 403)
      throw new Error("The key was refused. Check it is the anon public key.");
    if (response.status === 404) {
      const error = new Error("The table was not found. Run the setup SQL in Supabase.");
      error.status = 404; error.code = code;
      throw error;
    }
    const error = new Error(`${response.status}: ${text.slice(0, 200)}`);
    error.code = code;
    throw error;
  }
  const text = await response.text();
  return text ? JSON.parse(text) : [];
}

/* ------------------------------------------------------- reading changes
   Supabase hands back at most 1000 rows a request and says nothing when it
   stops short. A pull that asked once therefore got the first 1000 rows of a
   bigger collection and silently dropped the rest, and "Take from database"
   then pushed this phone's copy over every card it had not seen. */
const PAGE = 1000;
const pgQuote = v => '"' + String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';

async function pullAll(cfg, table, select, col, since, extra, key = "word") {
  const base = `${table}?collection=eq.${encodeURIComponent(cfg.collection)}` +
    `&select=${select}&order=${col}.asc,${key}.asc&limit=${PAGE}` + (extra || "");
  const rows = [];
  let last = null;
  for (;;) {
    // each page carries on from the last row by (col, word), which stays
    // exact when many rows share one stamp, as they do after an upload
    let path = base;
    if (last) path += "&or=" + encodeURIComponent(
      `(${col}.gt.${pgQuote(last[col])},` +
      `and(${col}.eq.${pgQuote(last[col])},${key}.gt.${pgQuote(last[key])}))`);
    else if (since) path += `&${col}=gt.${encodeURIComponent(since)}`;
    const page = await cloudRequest("GET", path, undefined, cfg);
    if (!page.length) return rows;
    rows.push(...page);
    last = page[page.length - 1];
  }
}

/* A stamp moved back in time, keeping the format it came in. */
function shiftStamp(stamp, ms, zoned) {
  if (!stamp) return "";
  const plain = stamp.replace(/(\.\d{3})\d+/, "$1");
  const t = Date.parse(/(Z|[+-]\d\d(:?\d\d)?)$/i.test(plain) ? plain : plain + "Z");
  if (isNaN(t)) return stamp;
  const iso = new Date(t - ms).toISOString();
  return zoned ? iso : iso.slice(0, 23);
}

/* Rows changed since the last pull.

   Every row carries the time its card was studied. That is the right thing
   for deciding which answer wins, and the wrong thing for a bookmark: a phone
   that studied offline at 10:00 and uploads at noon is invisible to a device
   whose bookmark already says 11:00. With supabase-upgrade.sql run once,
   the database stamps every write itself (synced_at) and that is the
   bookmark. Without it, each pull reaches back a day, which catches the usual
   walk with no signal at the cost of reading a day of rows again. */
const STAMP_OVERLAP = 864e5;      // one day
const SERVER_OVERLAP = 120e3;     // two minutes: writes can commit out of order
// projects found without the upgrade, and when: asked again after ten
// minutes, so running the SQL takes effect without restarting the app
const noServerStamp = new Map();

async function pullChanged(cfg, table, select, studied, seqMark, stampMark, extraIfNew, key) {
  if (!(Date.now() - (noServerStamp.get(cfg.url) || 0) < 6e5)) {
    try {
      const since = shiftStamp(cfg[seqMark], SERVER_OVERLAP, true);
      const rows = await pullAll(cfg, table, `${select},synced_at`, "synced_at", since,
                                 since ? "" : extraIfNew, key);
      // pages arrive in synced_at order, so the last row is the newest
      return { rows, seq: rows.length ? rows[rows.length - 1].synced_at : (cfg[seqMark] || "") };
    } catch (e) {
      const missing = e.code === "42703" || e.code === "PGRST204" ||
                      /synced_at/.test(e.message || "");
      if (!missing) throw e;
      noServerStamp.set(cfg.url, Date.now());
    }
  }
  const since = shiftStamp(cfg[stampMark], STAMP_OVERLAP);
  const rows = await pullAll(cfg, table, select, studied, since, since ? "" : extraIfNew, key);
  return { rows, seq: cfg[seqMark] || "" };
}

/* One exchange with the database at a time. Two that overlap each write their
   own bookmarks at the end, and whichever finishes last wins. */
let syncing = null;
async function exclusive(fn) {
  while (syncing) await syncing.catch(() => {});
  const run = Promise.resolve().then(fn);
  syncing = run;
  try { return await run; } finally { if (syncing === run) syncing = null; }
}
const syncIdle = () => exclusive(() => {});

/* What has to be true before anything is sent. */
async function preflight(target) {
  const cfg = { ...(target.cloud || {}) };
  if (!cfg.url || !cfg.key) throw new Error("Sync is not set up yet.");
  if (!cfg.collection)
    throw new Error("Enter the collection name in sync settings: the same one the desktop uses.");
  if (!target.cards.length)
    throw new Error("This collection has no words on this phone yet. " +
                    "Press “Download words” in sync settings first.");
  // a name typed for the wrong language would send one language's cards into
  // the other's table, so it is checked against the words uploaded there
  if (cfg.checked !== cfg.collection && target.language) {
    const rows = await cloudRequest("GET",
      `collections?collection=eq.${encodeURIComponent(cfg.collection)}` +
      "&select=language:payload->>language,language_name:payload->>language_name&limit=1",
      undefined, cfg);
    const theirs = rows[0];
    if (theirs && theirs.language && theirs.language !== target.language)
      throw new Error(`“${cfg.collection}” holds ${theirs.language_name || theirs.language} ` +
        `words, but the words open here are ${target.language_name || target.language}. ` +
        "Check the collection name in sync settings.");
    target.cloud = { ...target.cloud, checked: cfg.collection };
    cfg.checked = cfg.collection;
  }
  return cfg;
}

function cardState(card) {
  const out = {
    ...(card.manual ? { new_word: { w: card.w, en: card.en, pos: card.pos || "",
        ex: card.ex || "", coll: card.coll || "", art: card.art || "" } } : {}),
    stage: card.stage, box: card.box, meaning_box: card.mbox,
    meaning_marks: card.marks || 0, dir_flags: card.flags || 0,
    // the phone does not use these two, but it must hand back what the
    // desktop set rather than zeros, or a sync would undo a suspension
    cloze_passes: card.cloze || 0, prod_passes: card.prod || 0, due: card.due,
    reviews: card.reviews || 0, correct: card.correct || 0,
    lapses: card.lapses || 0, suspended: card.suspended ? 1 : 0
  };
  if (card.senses && card.senses.length) {
    out.senses = {};
    for (const s of card.senses)
      out.senses[s.gloss] = { box: s.box || 0, due: s.due || null, seen: s.seen || 0,
        recalled: s.recalled || 0, missed: s.missed || 0,
        last_review: s.last_review || null };
  }
  return out;
}

/* A card row's progress, taken onto the card here. */
function takeState(card, row) {
  const st = row.state || {};
  card.stage = st.stage; card.box = st.box; card.mbox = st.meaning_box;
  card.marks = st.meaning_marks; card.flags = st.dir_flags; card.due = st.due;
  card.reviews = st.reviews; card.correct = st.correct; card.lapses = st.lapses;
  card.prod = st.prod_passes; card.updated_at = row.updated_at;
  if (st.suspended !== undefined) card.suspended = st.suspended ? 1 : 0;
  if (st.cloze_passes !== undefined) card.cloze = st.cloze_passes;
  if (st.senses && card.senses)
    for (const s of card.senses) {
      const inc = st.senses[s.gloss];
      if (inc && (inc.last_review || "") > (s.last_review || "")) Object.assign(s, inc);
    }
}
/* A word another device made, as a card here: what it was made with, and
   its progress from the database when there is a row for it. */
function adoptCard(target, data, row) {
  const w = String(data.w || "").trim();
  const ex = data.ex || "";
  let sentences = Array.isArray(data.sentences) ? data.sentences : [];
  if (!sentences.length && ex) {
    const at = ex.toLowerCase().indexOf(w.toLowerCase());
    if (at >= 0) sentences = [{ it: ex, en: "", surface: ex.slice(at, at + w.length),
                                a: at, b: at + w.length, tag: "base" }];
  }
  const card = { w, en: data.en || "", pos: data.pos || "", spos: data.spos || sposFor(data.pos),
    art: data.art || "", coll: data.coll || "", ex, topic: data.topic || "general",
    cefr: data.cefr || "", explain: "", explain_native: "", stage: 0, box: 1, mbox: 1, marks: 0,
    flags: 0, due: todayStr(), reviews: 0, correct: 0, lapses: 0, manual: 1, updated_at: "",
    senses: [], sentences };
  if (row) takeState(card, row);
  target.cards.push(card);
  return card;
}

function cloudSync(quiet) {
  return exclusive(() => syncCollection(state)).then(summary => {
    if (!quiet) notify(summary);
    return summary;
  });
}

/* Works on the collection it was given from start to finish, so switching
   language halfway through cannot send one collection's cards to the other. */
async function syncCollection(target) {
  const cfg = await preflight(target);
  let pulledTo = cfg.pulled_to || "", pushedTo = cfg.pushed_to || "";
  const cutoffPull = pulledTo;

  // pull first: a card changed in both places then ends up with the later
  // answer here as well, rather than only on the other device
  const pulled = await pullChanged(cfg, "cards", "word,updated_at,state",
                                   "updated_at", "pulled_seq", "pulled_to");
  const remote = pulled.rows;
  const byWord = new Map(target.cards.map(c => [c.w, c]));
  let took = 0;
  for (const row of remote) {
    if ((row.updated_at || "") > pulledTo) pulledTo = row.updated_at;
    const card = byWord.get(row.word);
    if (!card) {
      // a word made on another phone (added by hand or from a text) comes
      // here too, rather than waiting for the desktop to adopt it
      const made = (row.state || {}).new_word;
      if (made && made.w === row.word) { byWord.set(row.word, adoptCard(target, made, row)); took++; }
      continue;
    }
    if (card.fresh) delete card.fresh;        // the sync has spoken for it
    if ((row.updated_at || "") <= (card.updated_at || "")) continue;
    takeState(card, row);
    took++;
  }

  // push what changed here. The cutoff is fixed before the loop: raising it
  // as we go would make every later card look already sent.
  const cutoff = pushedTo;
  const rows = [];
  for (const card of target.cards) {
    if (card.fresh) continue;                 // a guess, not a fact
    let stamp = card.updated_at || "";
    if (cutoff && stamp && stamp <= cutoff) continue;
    if (!stamp) { stamp = nowStr(); card.updated_at = stamp; }
    if (stamp > pushedTo) pushedTo = stamp;
    rows.push({ collection: cfg.collection, word: card.w,
                updated_at: stamp, state: cardState(card) });
  }
  for (let i = 0; i < rows.length; i += 300)
    await cloudRequest("POST", "cards", rows.slice(i, i + 300), cfg);

  // reviews are append-only, so both directions are just 'add what is
  // missing'. What to send is settled before the pull, so reviews that came
  // from the other device are not sent straight back.
  const sentBefore = cfg.reviews_sent || "";
  const mine = target.reviews
    .filter(r => !sentBefore || r[1] > sentBefore)
    .map(r => ({ collection: cfg.collection, word: r[0], ts: r[1],
                 stage: r[2], mode: r[3], result: r[4] }));
  // a first pull only needs recent history: the chart shows a fortnight and
  // the desktop sends sixty days
  const sixtyDaysAgo = localDate(new Date(Date.now() - 60 * 864e5));
  const pulledReviews = await pullChanged(cfg, "reviews", "word,ts,stage,mode,result",
    "ts", "reviews_seq", "reviews_to", `&ts=gte.${sixtyDaysAgo}`);
  const seen = new Set(target.reviews.map(r => r[0] + "\u0000" + r[1]));
  let latestReview = cfg.reviews_to || "";
  for (const r of pulledReviews.rows) {
    if (r.ts > latestReview) latestReview = r.ts;
    if (!seen.has(r.word + "\u0000" + r.ts))
      target.reviews.push([r.word, r.ts, r.stage, r.mode, r.result]);
  }
  if (target.reviews.length > 4000) {
    target.reviews.sort((a, b) => (a[1] || "").localeCompare(b[1] || ""));
    target.reviews.splice(0, target.reviews.length - 4000);
  }
  for (let i = 0; i < mine.length; i += 300)
    await cloudRequest("POST", "reviews", mine.slice(i, i + 300), cfg);

  // anything the database had nothing to say about really is new, so it can
  // take the defaults now and travel normally from here on
  for (const card of target.cards)
    if (card.fresh) delete card.fresh;
  // merged into the settings as they are now, so a change made in the
  // settings screen while this ran is not undone
  target.cloud = { ...target.cloud, pulled_to: pulledTo, pushed_to: pushedTo,
                   pulled_seq: pulled.seq, reviews_seq: pulledReviews.seq,
                   reviews_to: latestReview,
                   reviews_sent: mine.reduce((m, r) => r.ts > m ? r.ts : m, sentBefore),
                   last: nowStr() };
  await save(target);
  // the cards are safe by now, so reading has its own try: a database
  // without the reading table yet still syncs every card
  let readingNote = "";
  try {
    const r = await syncReading(target, cfg);
    target.cloud = { ...target.cloud, reading_missing: "" };
    if (r.took) readingNote = ` Reading: took in ${r.took}.`;
  } catch (e) {
    const missing = e.status === 404 || e.code === "PGRST205" || e.code === "42P01";
    target.cloud = { ...target.cloud, reading_missing: missing ? nowStr() : "" };
    if (!missing) readingNote = ` Reading not synced: ${e.message}`;
  }
  await save(target);
  const summary = `Sent ${rows.length}, took in ${took}.` + readingNote;
  lastSync = { sent: rows.length, took, seen: remote.length,
               pulledFrom: cutoffPull || "(everything)" };
  return summary;
}

/* ------------------------------------------------------------ reading sync
   What happened in the Read tab travels too, one row per item in the
   `reading` table (supabase-upgrade.sql): each finished text with its score
   and answers ("text:<id>"), and each reading word ("word:<word>") with the
   text it came from and what it takes to make the card on a device that has
   never seen it. The later of two copies of an item wins. */
function readingOf(s) {
  if (!s.reading) s.reading = {};
  if (!s.reading.done) s.reading.done = {};
  if (!s.reading.words) s.reading.words = {};
  return s.reading;
}
const keyIn = s => w => (w || "").trim().toLocaleLowerCase(speechLang(s) || undefined);
const cardData = c => c && { w: c.w, en: c.en, pos: c.pos || "", spos: c.spos || "", art: c.art || "",
  coll: c.coll || "", ex: c.ex || "", topic: "reading", cefr: c.cefr || "", sentences: c.sentences || [] };

async function syncReading(target, cfg) {
  const r = readingOf(target);
  const key = keyIn(target);
  const index = new Map(target.cards.map(c => [key(c.w), c]));
  // what to send is settled before the pull, so what comes in is not sent back
  const cutoff = cfg.reading_sent || "";
  let sentTo = cutoff;
  const out = [];
  const add = (item, at, state) => {
    if (cutoff && at && at <= cutoff) return;
    const stamp = at || nowStr();
    if (stamp > sentTo) sentTo = stamp;
    out.push({ collection: cfg.collection, item, updated_at: stamp, state });
  };
  for (const [id, d] of Object.entries(r.done)) add("text:" + id, d.at, d);
  for (const [k, w] of Object.entries(r.words))
    add("word:" + k, w.at, { ...w, card: cardData(index.get(k)) || undefined });

  const pulled = await pullChanged(cfg, "reading", "item,updated_at,state", "updated_at",
                                   "reading_seq", "reading_to", "", "item");
  let latest = cfg.reading_to || "", took = 0;
  const wanted = [];                   // words this device has never had
  for (const row of pulled.rows) {
    if ((row.updated_at || "") > latest) latest = row.updated_at;
    const cut = row.item.indexOf(":");
    const kind = row.item.slice(0, cut), id = row.item.slice(cut + 1);
    const st = row.state || {};
    if (kind === "text") {
      const mine = r.done[id];
      if (!mine || (st.at || "") > (mine.at || "")) {
        r.done[id] = { score: st.score, total: st.total, at: st.at || row.updated_at,
                       ...(Array.isArray(st.answers) ? { answers: st.answers } : {}) };
        took++;
      }
    } else if (kind === "word") {
      if (!r.words[id]) { r.words[id] = { text: st.text || "", at: st.at || row.updated_at }; took++; }
      const card = index.get(id);
      if (!card && st.card && st.card.w) wanted.push(st.card);
      else if (card && st.card) {
        // made here from the bare word: the sentence from the text is better
        if (!(card.sentences || []).length && (st.card.sentences || []).length)
          card.sentences = st.card.sentences;
        if (!card.cefr && st.card.cefr) card.cefr = st.card.cefr;
        // only a word made on a phone; the desktop's own words keep their topic
        if (card.manual && (!card.topic || card.topic === "general")) card.topic = "reading";
      }
    }
  }
  // a reading word made on another device: its card, with that card's
  // progress from the database where there is a row for it
  for (let i = 0; i < wanted.length; i += 40) {
    const batch = wanted.slice(i, i + 40);
    const rows = await cloudRequest("GET", `cards?collection=eq.${encodeURIComponent(cfg.collection)}` +
      `&select=word,updated_at,state&word=in.(${encodeURIComponent(batch.map(d => pgQuote(d.w)).join(","))})`,
      undefined, cfg);
    const byWord = new Map(rows.map(x => [x.word, x]));
    for (const data of batch)
      if (!index.has(key(data.w))) index.set(key(data.w), adoptCard(target, data, byWord.get(data.w)));
  }
  // a finished text that just came in newer than this device's copy is not
  // sent back over itself
  const send = out.filter(row => !row.item.startsWith("text:") ||
    (r.done[row.item.slice(5)] || {}).at === row.state.at);
  for (let i = 0; i < send.length; i += 300)
    await cloudRequest("POST", "reading", send.slice(i, i + 300), cfg);
  target.cloud = { ...target.cloud, reading_sent: sentTo, reading_to: latest, reading_seq: pulled.seq };
  if (target === state && readSession && readSession.refresh) readSession.refresh();
  return { sent: send.length, took };
}

async function forcePull() {
  /* For a device whose progress was lost while the others still have it: every
     local card is made to lose, so the database's version is taken instead of
     being overwritten by this one. */
  if (await ask("Take the database’s version?",
      "Every card here is replaced by the one in the database. Anything studied " +
      "here and never synced would be given up.",
      [["Take the database’s version", "yes", "primary"], ["Cancel", "", "ghost"]]) !== "yes")
    return;
  await exclusive(async () => {
    const target = state;
    await preflight(target);                 // before anything is cleared
    for (const card of target.cards) { card.updated_at = ""; delete card.fresh; }
    target.cloud = { ...target.cloud, ...NO_MARKERS };
    await save(target);
    return syncCollection(target);
  });
  const c = counts();
  notify(`Took in ${lastSync.took} card(s) from the database.\n\n` +
        `To sort: ${c.s0}\nLevel 1: ${c.s1}\nLevel 2: ${c.s2}\nDue now: ${c.due}`);
  home();
}

async function fullResync() {
  /* The markers say what has already been exchanged. When the two sides
     disagree and ordinary syncing will not close the gap, the honest fix is
     to forget them and compare every card once. */
  await exclusive(async () => {
    const target = state;
    await preflight(target);
    target.cloud = { ...target.cloud, ...NO_MARKERS };
    await save(target);
    return syncCollection(target);
  });
  const c = counts();
  notify(`Compared every card.\n\n` +
        `Rows seen in the database: ${lastSync.seen}\n` +
        `Taken in: ${lastSync.took}\n` +
        `Sent up: ${lastSync.sent}\n\n` +
        `Due now: ${c.due}`);
  home();
}

async function pushMine() {
  /* The other direction: this device has the work and the database does not.
     Sending with each card's own stamp replaces whatever is there, which is
     what you want when a reset was uploaded over your progress. */
  if (await ask("Send this phone’s progress up?",
      "Every card in the database is replaced by the one on this phone.",
      [["Send mine up", "yes", "primary"], ["Cancel", "", "ghost"]]) !== "yes") return;
  const sent = await exclusive(async () => {
    const target = state;
    const cfg = await preflight(target);
    const rows = [];
    for (const card of target.cards) {
      if (card.fresh) continue;
      if (!card.updated_at) card.updated_at = nowStr();
      rows.push({ collection: cfg.collection, word: card.w,
                  updated_at: card.updated_at, state: cardState(card) });
    }
    for (let i = 0; i < rows.length; i += 300)
      await cloudRequest("POST", "cards", rows.slice(i, i + 300), cfg);
    target.cloud = { ...target.cloud, pushed_to: "", last: nowStr() };
    await save(target);
    return rows.length;
  });
  notify(`Sent ${sent} card(s) up.`);
  home();
}

async function autoSync(reason) {
  const cfg = cloudSettings();
  if (!cfg.auto || !cfg.url || !cfg.key) return;
  try {
    const summary = await cloudSync(true);
    flash(summary);
  } catch (e) { flash("Sync failed: " + e.message); }
}

let flashTimer = null;
function flash(text) {
  let node = document.getElementById("flash");
  if (!node) {
    node = el("div", "toast");
    node.id = "flash";
    node.setAttribute("role", "status");
    document.body.appendChild(node);
  }
  node.textContent = text;
  node.style.display = "none";
  void node.offsetWidth;                     // so the entrance plays again
  node.style.display = "block";
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { node.style.display = "none"; }, 4000);
}

async function cloudFetchCollection(cfg) {
  const coll = encodeURIComponent(cfg.collection || "default");
  const rows = await cloudRequest("GET",
    `collections?collection=eq.${coll}&select=payload&limit=1`, undefined, cfg);
  if (!rows.length)
    throw new Error("No collection there yet. On the desktop press " +
                    "\u201cUpload words\u201d in Phone sync first.");
  return rows[0].payload;
}

/* Where a card sits, in the words a list can show. */
const STAGE_SHORT = { 0: "To sort", 1: "Flashcards", 2: "Level 2", 3: "Writing", 4: "Mastered" };
function stageOf(card) {
  const stage = card.stage ?? 1;
  const rung = LADDER.find(([s]) => s === stage) || LADDER[1];
  const box = stage === 2 ? mbox(card) : stage === 1 ? (card.box || 1) : 0;
  return { stage, colour: rung[2], short: STAGE_SHORT[stage] || rung[1], box };
}
function dueText(day) {
  if (!day) return "";
  const [y, m, d] = day.split("-").map(Number);
  const [ty, tm, td] = todayStr().split("-").map(Number);
  const n = Math.round((new Date(y, m - 1, d) - new Date(ty, tm - 1, td)) / 864e5);
  return n <= 0 ? "due now" : n === 1 ? "tomorrow" : `in ${n} days`;
}
function selectFrom(values, onPick) {
  const sel = document.createElement("select");
  for (const [value, text] of values) {
    const option = document.createElement("option");
    option.value = value; option.textContent = text;
    sel.appendChild(option);
  }
  sel.addEventListener("change", () => onPick(sel.value));
  return sel;
}

function wordsScreen() {
  chrome(false);
  let query = "", stageFilter = "", cefrFilter = "", sourceFilter = "", coverageFilter = "";
  const search = el("input");
  search.type = "search";
  search.placeholder = "Search words or meanings";
  search.autocapitalize = "none"; search.spellcheck = false;
  search.addEventListener("input", () => { query = search.value.trim().toLowerCase(); paint(); });
  const searchBox = el("div", "search", icon("search"));
  searchBox.appendChild(search);

  const filters = el("div", "filters");
  filters.appendChild(selectFrom([["", "Every level"],
    ...LADDER.map(([stage, name]) => [String(stage), name])], v => { stageFilter = v; paint(); }));
  const cefrValues = [...new Set(state.cards.map(c => c.cefr).filter(Boolean))].sort();
  if (cefrValues.length)
    filters.appendChild(selectFrom([["", "Any CEFR"], ...cefrValues.map(v => [v, v])],
                                   v => { cefrFilter = v; paint(); }));
  if (state.cards.some(isReadingWord))
    filters.appendChild(selectFrom([["", "All words"], ["reading", "From reading"]],
                                   v => { sourceFilter = v; paint(); }));
  const hasCoverageIndex = state.cards.some(card => Array.isArray(card.reading_texts));
  if (hasCoverageIndex)
    filters.appendChild(selectFrom([["", "Any text coverage"], ["covered", "In reading texts"],
                                    ["uncovered", "Not in reading texts"]],
                                   v => { coverageFilter = v; paint(); }));
  const note = el("div", "muted");
  note.style.margin = "0 4px 10px";
  const list = el("div", "list");
  const more = el("div", "muted center");

  function paint() {
    let rows = state.cards;
    if (query) rows = rows.filter(c =>
      c.w.toLowerCase().includes(query) || (c.en || "").toLowerCase().includes(query));
    if (stageFilter !== "") rows = rows.filter(c => String(c.stage ?? 1) === stageFilter);
    if (cefrFilter) rows = rows.filter(c => c.cefr === cefrFilter);
    if (sourceFilter) rows = rows.filter(isReadingWord);
    if (coverageFilter === "covered") rows = rows.filter(c => readingTextRefs(c).length);
    if (coverageFilter === "uncovered") rows = rows.filter(c => !readingTextRefs(c).length);
    rows = rows.slice().sort((a, b) => a.w.localeCompare(b.w));
    const covered = hasCoverageIndex ? state.cards.filter(c => readingTextRefs(c).length).length : 0;
    note.textContent = `${rows.length} of ${state.cards.length} words` +
      (hasCoverageIndex ? ` · ${covered} covered by texts · ${state.cards.length - covered} not covered` : "");
    list.innerHTML = "";
    list.classList.toggle("hidden", !rows.length);
    for (const card of rows.slice(0, 150)) {
      const s = stageOf(card);
      const when = s.stage > 0 && s.stage < 4 && !card.suspended ? dueText(card.due) : "";
      const textRefs = readingTextRefs(card);
      const coverage = Array.isArray(card.reading_texts)
        ? ` · <span class="tag-read">${textRefs.length ? `${textRefs.length} text${textRefs.length === 1 ? "" : "s"}` : "not in texts"}</span>`
        : "";
      list.appendChild(listItem({
        lead: `<span class="dot" style="--c:${s.colour}"></span>`,
        title: withArticle(card),
        detail: esc(card.en) + (card.cefr ? ` · ${esc(card.cefr)}` : "") +
          (isReadingWord(card) ? ' · <span class="tag-read">reading</span>' : "") + coverage,
        end: `<span class="badge" style="--c:${s.colour}">${s.short}${s.box ? " · " + s.box : ""}</span>` +
             (card.suspended ? "<span>paused</span>" : when ? `<span>${when}</span>` : ""),
        onTap: () => wordSheet(card)
      }));
    }
    more.textContent = rows.length > 150
      ? `… and ${rows.length - 150} more. Search to narrow it down.`
      : rows.length ? "" : "No words match.";
  }
  paint();
  show([pageHead("Words"), searchBox, filters, note, list, more], tabBar("words"));
}

    `${answered} answer${answered === 1 ? "" : "s"}, ${
      fortnight.filter(d => days.get(d)).length} days with practice.`));

function sortingScreen() {

  const waiting = state.cards.filter(c => !c.stage && !c.suspended);
  const facet = field => {
    const counts = new Map();
    for (const c of waiting) {
      const v = c[field] || "";
      if (v) counts.set(v, (counts.get(v) || 0) + 1);
    }
    return [...counts].sort((a, b) => b[1] - a[1]);
  };

    "words are grouped together, which makes them easier to place.");

  function picker(field, caption, values) {
    if (!values.length) return null;
    return selectFrom([["", caption], ...values.map(([value, n]) => [value, `${value} (${n})`])],
                      v => { filters[field] = v; paint(); });
  }
  [picker("pos", "Any part of speech", facet("spos")),
   picker("cefr", "Any level", facet("cefr")),
   picker("topic", "Any topic", facet("topic"))].forEach(p => p && row.appendChild(p));

                    () => start({ sorting: true, ...filters }));

    let pool = state.cards.filter(c => !c.stage && !c.suspended);
    if (filters.pos) pool = pool.filter(c => (c.spos || "") === filters.pos);
    if (filters.cefr) pool = pool.filter(c => (c.cefr || "") === filters.cefr);
    if (filters.topic) pool = pool.filter(c => (c.topic || "") === filters.topic);

        title: withArticle(card),

          paint();
        }
      }));

    more.textContent = pool.length > 120 ? `… and ${pool.length - 120} more.` : "";

    "practice holds. Up to half of a session can be words you have not studied yet."));
  const seg = el("div", "segment");
  seg.style.margin = "14px 0 0";
  const sizeButtons = SESSION_SIZES.map(n => button(String(n), n === sessionSize() ? "on" : "", () => {

  sizeButtons.forEach(b => { b.setAttribute("aria-label", `${b.textContent} words`); seg.appendChild(b); });

  nodes.push(sizes);

  if (speech) {
    nodes.push(sectionHead("Listening"));
    const card = el("div", "card");
    const check = document.createElement("input");

    const sw = el("label", "switch");

    check.addEventListener("change", () => { autoSay = check.checked; paintSound(); savePrefs(); });

    nodes.push(card);

    const name = languageName(lang);
    nodes.push(sectionHead(`${name} voice`));
    const list = el("div", "list voices");
    const help = el("div", "muted read-note");
    // a sentence from the words themselves, the same each time so the
    // voices can be compared
    const sample = state.cards.find(c => c.ex && c.ex.length >= 18 && c.ex.length <= 70);
    const sampleText = sample ? sample.ex : state.cards.length ? wordText(state.cards[0]) : "";
    const paintVoices = () => {
      if (!list.isConnected && list.childElementCount) { voicesChanged = null; return; }
      if (!voices.length) loadVoices();
      const mine = lang ? voicesFor(lang) : [];
      const picked = (prefs.voices || {})[lang];
      const current = mine.length ? voiceFor(lang) : null;
      const isAuto = !picked || !mine.some(v => v.voiceURI === picked || v.name === picked);
      list.innerHTML = "";
      list.classList.toggle("hidden", !mine.length);
      const choose = (uri, v, row) => {
        if (uri) prefs.voices = { ...prefs.voices, [lang]: uri };
        else { prefs.voices = { ...prefs.voices }; delete prefs.voices[lang]; }
        savePrefs();
        paintVoices();
        if (sampleText) say(sampleText, null, { auto: false });
      };
      const tick = on => on ? `<span class="badge" style="--c:var(--primary)">${icon("check")}Chosen</span>` : "";
      list.appendChild(listItem({ lead: icobox("bolt", "var(--s1)"), title: "Automatic",
        detail: mine[0] ? `The best one here: ${esc(mine[0].name)}` : "",
        end: tick(isAuto), onTap: () => choose("", null) }));
      for (const v of mine) {
        const kind = /premium/i.test(v.name) ? "Premium" : /enhanced|neural|natural/i.test(v.name) ? "Enhanced" : "";
        list.appendChild(listItem({ lead: icobox("speaker"), title: esc(v.name),
          detail: [esc(v.lang), kind, v.localService === false ? "needs a connection" : ""]
            .filter(Boolean).join(" · "),
          end: tick(!isAuto && current === v), onTap: () => choose(v.voiceURI || v.name, v) }));
      }
      help.innerHTML = mine.length
        ? `${icon("info")}<span>Tap a voice to choose it and hear it. ${mine.length === 1
            ? "This device has only one for " + esc(name) + ". " : ""}More can be added: ${esc(voiceHelp())}</span>`
        : `${icon("alert")}<span>This device has no ${esc(name)} voice yet. ${esc(voiceHelp())}</span>`;
    };
    voicesChanged = paintVoices;
    paintVoices();
    nodes.push(list, help);
  }
  show(nodes, [button("Back", "back", home)]);
}

/* ----------------------------------------------------------- free practice
   Any words, picked by level, kind and topic, in three small games. Nothing
   here is graded: no card moves, nothing becomes due and nothing is logged,
   so it can be played as often as you like. */
let play = null;
const SPOS_NAME = { noun: "Nouns", verb: "Verbs", adj: "Adjectives", adv: "Adverbs", phrase: "Phrases",
                    func: "Small words", num: "Numbers", other: "Other" };
const posOf = card => sposFor(card.spos) || sposFor(card.pos);
const topicName = v => {
  const s = (v || "").replace(/_/g, " & ");
  return s.charAt(0).toUpperCase() + s.slice(1);
};
/* A word's level: the one the desktop gave it, or else the level of the
   first reading text that uses it. */
function levelOf(card, book) {
  if (card.cefr) return card.cefr;
  if (!book) return "";
  if (!book.levelOf) {
    book.levelOf = new Map();
    for (const [lemma, t] of Object.entries(book.firstIn)) book.levelOf.set(wordKey(lemma), t.level);
  }
  return book.levelOf.get(wordKey(card.w)) || "";
}
const WHICH = [["", "All words"], ["met", "Words I've met"], ["new", "Not met yet"],
               ["reading", "Reading words"]];
const GAMES = [["flip", "Flip", "See the card, think of the answer, then turn it."],
               ["choose", "Choose", "Pick the right one of four."],
               ["type", "Type", "See the English and type the word."]];
const DIRECTIONS = [["out", "Word → English"], ["in", "English → word"], ["mixed", "Mixed"]];

async function practiceScreen() {
  chrome(false); setProgress("", 0);
  play = null; quitTo = null;
  const book = await loadBook();
  const p = { level: "", pos: "", topic: "", which: "", mode: "flip", dir: "out", ...(prefs.practice || {}) };
  const words = state.cards.filter(c => !c.suspended);
  const facet = (get, name) => {
    const counts = new Map();
    for (const c of words) { const v = get(c); if (v) counts.set(v, (counts.get(v) || 0) + 1); }
    return [...counts].sort((a, b) => a[0] === "other" ? 1 : b[0] === "other" ? -1 : b[1] - a[1])
      .map(([v, n]) => [v, `${name(v)} (${n})`]);
  };
  const levels = facet(c => levelOf(c, book), v => v).sort((a, b) => a[0].localeCompare(b[0]));
  const kinds = facet(posOf, v => SPOS_NAME[v] || v);
  const topics = facet(c => c.topic, topicName);
  const matching = () => words.filter(c =>
    (!p.level || levelOf(c, book) === p.level) && (!p.pos || posOf(c) === p.pos) &&
    (!p.topic || c.topic === p.topic) &&
    (!p.which || (p.which === "met" ? met(c) : p.which === "new" ? !met(c) : isReadingWord(c))));
  const remember = () => { prefs.practice = { ...p }; savePrefs(); };

  const row = el("div", "filters");
  for (const [field, caption, values] of [["level", "Any level", levels], ["pos", "Any kind of word", kinds],
                                           ["topic", "Any topic", topics], ["which", "", WHICH.slice(1)]]) {
    if (!values.length) { p[field] = ""; continue; }
    if (p[field] && !values.some(([v]) => v === p[field])) p[field] = "";
    const sel = selectFrom([["", caption || WHICH[0][1]], ...values], v => { p[field] = v; remember(); paint(); });
    sel.value = p[field];
    row.appendChild(sel);
  }
  const note = el("div", "muted");
  note.style.margin = "0 4px 4px";

  const games = el("div", "segment");
  const dirs = el("div", "segment");
  const about = el("div", "muted");
  about.style.margin = "-6px 4px 0";
  const gameButtons = GAMES.map(([id, label]) => button(label, "", () => { p.mode = id; remember(); paint(); }));
  const dirButtons = DIRECTIONS.map(([id, label]) => button(label, "", () => { p.dir = id; remember(); paint(); }));
  games.append(...gameButtons);
  dirs.append(...dirButtons);
  const go = button("Play", "primary grow", () => {
    const pool = matching();
    startPlay(shuffle(pool).slice(0, sessionSize()), p.mode, p.dir, pool);
  });

  function paint() {
    const n = matching().length;
    note.textContent = n ? `${n} word${n === 1 ? "" : "s"} match. Each round takes ` +
      `${Math.min(n, sessionSize())} of them at random.` : "No words match. Loosen a filter.";
    GAMES.forEach(([id], i) => gameButtons[i].classList.toggle("on", p.mode === id));
    DIRECTIONS.forEach(([id], i) => dirButtons[i].classList.toggle("on", p.dir === id));
    dirs.classList.toggle("hidden", p.mode === "type");
    about.textContent = GAMES.find(([id]) => id === p.mode)[2];
    go.disabled = !n;
    go.innerHTML = n ? `Play ${Math.min(n, sessionSize())} words` : "Play";
  }
  paint();
  show([pageHead("Free practice", "Play with any of your words. Nothing here changes a card: " +
          "no box moves, nothing becomes due and nothing counts as a review."),
        row, note, sectionHead("Game"), games, dirs, about], [button("Back", "back", home), go]);
}

function startPlay(list, mode, dir, pool) {
  play = { list, mode, dir, pool: pool || list, i: 0, right: 0, missed: [] };
  quitTo = practiceScreen;
  chrome(true);
  playNext();
}
function playNext() {
  if (!play) return;
  if (play.i >= play.list.length) return playSummary();
  const card = play.list[play.i];
  setProgress(`${play.i + 1} of ${play.list.length}`, play.i / play.list.length);
  const out = play.dir === "mixed" ? Math.random() < 0.5 : play.dir === "out";
  if (play.mode === "choose") return playChoose(card, out);
  if (play.mode === "type") return playType(card);
  playFlip(card, out);
}
function playScore(card, right) {
  if (right) play.right++; else play.missed.push(card);
  play.i++;
  playNext();
}
const playMeta = text => metaLine(`Free practice · ${text}`);

function playFlip(card, out) {
  const prompt = el("div", "prompt", out ? withArticle(card) : esc(card.en));
  const answer = el("div", "reveal hidden",
    `<div class="prompt">${out ? esc(card.en) : withArticle(card)}</div>` +
    (card.ex ? `<div class="sentence">${esc(card.ex)}</div>` : ""));
  const face = faceCard([prompt, el("div", "sub", esc(card.pos || ""))]);
  const turn = button("Turn the card", "primary grow", () => {
    answer.classList.remove("hidden");
    if (!out) sayAnswer(wordText(card));
    offerDetails(card);
    foot.innerHTML = "";
    foot.append(button("Not yet", "grow", () => playScore(card, false)),
                button("Knew it", "primary grow", () => playScore(card, true)));
    primaryButton = foot.querySelector("button.primary");
  });
  show([playMeta(out ? "word → English" : "English → word"),
        out ? withSay(face, wordText(card)) : face, answer], [turn]);
  if (out) sayAuto(wordText(card));
}

function playChoose(card, out) {
  const text = c => out ? (c.en || "") : wordText(c);
  const right = text(card);
  // the wrong answers come from the same kind of word where there are enough
  const others = (pool => {
    const same = pool.filter(c => c !== card && posOf(c) === posOf(card));
    return shuffle(same.length >= 3 ? same : pool.filter(c => c !== card));
  })(play.pool.length >= 4 ? play.pool : state.cards);
  const options = [right];
  for (const c of others) {
    const t = text(c);
    if (t && !options.some(o => o.toLowerCase() === t.toLowerCase())) options.push(t);
    if (options.length === 4) break;
  }
  const prompt = el("div", "prompt", out ? withArticle(card) : esc(card.en));
  const face = faceCard([prompt, el("div", "sub", esc(card.pos || ""))], "compact");
  const opts = el("div", "opts");
  const feedback = el("div", "feedback left hidden");
  let chosen = null;
  const nextBtn = button("Next", "primary grow", () => playScore(card, chosen === right));
  nextBtn.disabled = true;
  const buttons = shuffle(options).map(o => {
    const b = button(esc(o), "", () => {
      if (chosen !== null) return;
      chosen = o;
      b.classList.add(o === right ? "right" : "wrong");
      buttons.forEach(x => { x.disabled = true; if (x.dataset.o === right) x.classList.add("right"); });
      feedback.innerHTML = o === right ? '<b class="good">Right.</b>'
        : `<b class="bad">Not quite.</b> It is <b>${out ? esc(card.en) : withArticle(card)}</b>.`;
      if (card.ex) feedback.innerHTML += `<br><span class="muted">${esc(card.ex)}</span>`;
      feedback.classList.remove("hidden");
      if (!out) sayAnswer(wordText(card));
      offerDetails(card);
      nextBtn.disabled = false;
      primaryButton = nextBtn;
    });
    b.dataset.o = o;
    opts.appendChild(b);
    return b;
  });
  show([playMeta(out ? "choose the meaning" : "choose the word"),
        out ? withSay(face, wordText(card)) : face, opts, feedback], [nextBtn]);
  if (out) sayAuto(wordText(card));
}

function playType(card) {
  const prompt = el("div", "prompt", esc(card.en));
  const input = el("input");
  input.placeholder = "type the word";
  input.autocapitalize = "none"; input.autocomplete = "off"; input.autocorrect = "off";
  input.spellcheck = false; input.enterKeyHint = "go";
  const feedback = el("div", "feedback");
  let right = null;
  function check() {
    if (right !== null) return;
    const typed = input.value.trim();
    if (!typed) return;
    right = looseEq(typed, card.w) || looseEq(typed, wordText(card));
    input.disabled = true;
    const { verdict } = closeness(typed, [card.w]);
    feedback.innerHTML = (right ? `<b class="good">Right.</b> ${withArticle(card)}`
      : `<b class="bad">Not quite</b> (${esc(verdict)}). The word is <b>${withArticle(card)}</b>.`) +
      (card.ex ? `<br><span class="muted">${esc(card.ex)}</span>` : "");
    sayAnswer(wordText(card));
    offerDetails(card);
    foot.innerHTML = "";
    foot.appendChild(button("Next", "primary grow", () => playScore(card, right)));
    primaryButton = foot.querySelector("button.primary");
  }
  input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); check(); } });
  show([playMeta("type the word"), faceCard([prompt, el("div", "sub", esc(card.pos || ""))], "compact"),
        input, feedback], [
    button("Show it", "ghost", () => { if (right === null) { input.value = ""; right = false;
      input.disabled = true;
      feedback.innerHTML = `The word is <b>${withArticle(card)}</b>.` +
        (card.ex ? `<br><span class="muted">${esc(card.ex)}</span>` : "");
      sayAnswer(wordText(card)); offerDetails(card);
      foot.innerHTML = "";
      foot.appendChild(button("Next", "primary grow", () => playScore(card, false)));
      primaryButton = foot.querySelector("button.primary"); } }),
    button("Check", "primary grow", check)
  ]);
  setTimeout(() => input.focus(), 60);
}

function playSummary() {
  const done = play;
  play = null; quitTo = null;
  setProgress("", 1); chrome(false);
  const head = el("div", "center");
  head.appendChild(el("div", "done-mark", icon("play")));
  head.appendChild(el("h1", "", "Round over"));
  head.appendChild(el("div", "muted", `${done.right} of ${done.list.length} right. ` +
    "Your cards are just as they were."));
  const nodes = [head];
  if (done.missed.length) {
    nodes.push(sectionHead("Missed"));
    const list = el("div", "list");
    for (const card of done.missed)
      list.appendChild(listItem({ title: withArticle(card), detail: esc(card.en),
        end: icon("chevron"), onTap: () => wordSheet(card) }));
    nodes.push(list);
  }
  show(nodes, [
    button("Menu", "back", practiceScreen),
    done.missed.length ? button(`Again with the ${done.missed.length} missed`, "",
      () => startPlay(shuffle(done.missed), done.mode, done.dir, done.pool)) : null,
    button(icon("turn") + "New round", "primary grow",
      () => startPlay(shuffle(done.pool).slice(0, sessionSize()), done.mode, done.dir, done.pool))
  ]);
}

function addWordScreen() {
  chrome(false);
  const head = pageHead("Add a word",
    "For something you met today that the list does not have. It starts in " +
    "the sorting pass and reaches the desktop on the next sync.");
  const box = el("div", "card");
  const fields = {};
  for (const [key, caption, ph] of [["w", "Word", "e.g. la finestra"],
                                    ["en", "Meaning in English", "e.g. window"],
                                    ["pos", "Part of speech", "optional"],
                                    ["ex", "Example sentence", "optional, but it unlocks the gap exercises"]]) {
    const input = el("input");
    input.placeholder = ph;
    input.autocapitalize = "none"; input.spellcheck = false;
    fields[key] = input;
    box.appendChild(field(caption, input));
  }
  box.lastChild.style.marginBottom = "0";

  show([head, box], [
    button("Back", "back", home),
    button("Add", "primary grow", async () => {
      const w = fields.w.value.trim(), en = fields.en.value.trim();
      if (!w || !en) return notify("The word and its English are both needed.");
      if (state.cards.some(c => c.w.toLowerCase() === w.toLowerCase()))
        return notify("That word is already in the collection.");
      const ex = fields.ex.value.trim();
      const card = { w, en, pos: fields.pos.value.trim(), spos: "", art: "",
        coll: "", ex, topic: "general", cefr: "", explain: "", explain_native: "",
        stage: 0, box: 1, mbox: 1, marks: 0, flags: 0, due: todayStr(),
        reviews: 0, correct: 0, lapses: 0, manual: 1, updated_at: nowStr(),
        senses: [], sentences: [] };
      // a gap needs to know where the word sits in the sentence
      if (ex) {
        const at = ex.toLowerCase().indexOf(w.toLowerCase());
        if (at >= 0) card.sentences = [{ it: ex, en: "", surface: ex.slice(at, at + w.length),
                                         a: at, b: at + w.length, tag: "base" }];
      }
      state.cards.push(card);
      await save();
      flash(`${w} added. It will appear in the sorting pass.`);
      home();
    })
  ]);
  setTimeout(() => fields.w.focus(), 60);
}

/* ------------------------------------------------------------ collections
   Each language is its own record. Switching saves the one open now and
   loads the other; nothing is ever written under another collection's key. */
async function switchTo(key) {
  await syncIdle();
  if (state && state.cards.length) await save();
  const next = await idbGet(key);
  if (!next || !(next.cards || []).length) return home();
  if (!next.reviews) next.reviews = [];
  next.id = key;
  state = next;
  await idbSet("last_open", key);
  home();
  autoSync("switched");
}

async function addLanguage() {
  await syncIdle();
  if (state && state.cards.length) await save();
  // the same Supabase project usually serves every language, so its address
  // and key come along; the collection name and the words do not
  const prev = cloudSettings();
  cameFrom = state && state.cards.length ? stateKey(state) : "";
  state = { language: "", language_name: "", cards: [], reviews: [],
            cloud: { url: prev.url || connection.url || "", key: prev.key || connection.key || "",
                     auto: prev.url ? !!prev.auto : !!connection.auto } };
  cloudScreen();
}

/* A choice with more than OK and Cancel. Resolves with the value of the
   button pressed. */
function ask(title, text, choices) {
  return new Promise(resolve => {
    const before = primaryButton;
    const veil = el("div", "veil");
    const box = el("div", "sheet");
    box.setAttribute("role", "dialog");
    box.setAttribute("aria-modal", "true");
    if (title) box.appendChild(el("h2", "", esc(title)));
    box.appendChild(el("div", "muted", text));
    const row = el("div", "actions");
    for (const [label, value, cls] of choices)
      row.appendChild(button(esc(label), (cls || "") + " grow", () => {
        veil.remove(); primaryButton = before; resolve(value);
      }));
    box.appendChild(row);
    veil.appendChild(box);
    document.body.appendChild(veil);
    // after button()'s own deferred pick of the footer's primary, so Enter
    // answers the question rather than pressing whatever is underneath
    setTimeout(() => {
      if (!document.contains(veil)) return;
      primaryButton = row.querySelector("button.primary") || null;
      (primaryButton || row.querySelector("button")).focus({ preventScroll: true });
    }, 0);
  });
}

  }
  conn.appendChild(auto);

  /* Saves what was typed. Returns false if you backed out.

     A new collection name while words are open used to re-file those words
     under it, which is how one language overwrote another. Now a name that is
     already on this phone opens that collection, and a new one asks. */
  async function persist() {
    await syncIdle();
    const settings = { url: url.value.trim().replace(/\/$/, ""),
                       key: key.value.trim(), auto: check.checked };
    if (settings.url && settings.key) {
      connection = { ...settings };
      idbSet("connection", connection).catch(() => {});
    }
    const name = coll.value.trim();
    const current = cloudSettings().collection || "";
    if (name && name !== current) {
      const there = (await storedCollections())
        .find(c => c.s !== state && c.s.cloud && c.s.cloud.collection === name);
      if (there) {
        if (state.cards.length) await save();
        state = there.s;
        state.id = there.key;
        if (!state.reviews) state.reviews = [];
        state.cloud = { ...state.cloud, ...settings };
        await save();
        flash(`Opened ${state.language_name || name}.`);
        return true;
      }
      if (state.cards.length) {
        const words = `${state.cards.length} ${esc(state.language_name || "")} words`;
        const choice = await ask(`\u201c${name}\u201d is new on this phone`, current
          ? `The ${words} open now sync as \u201c${esc(current)}\u201d. Is ` +
            `\u201c${esc(name)}\u201d another language, or the right name for these words?`
          : `The ${words} open now are not synced yet. Should they sync as ` +
            `\u201c${esc(name)}\u201d, or is that another language?`,
          current
            ? [["Another language", "other", "primary"], ["Rename these", "rename"],
               ["Cancel", "cancel", "ghost"]]
            : [["Sync these words", "rename", "primary"], ["Another language", "other"],
               ["Cancel", "cancel", "ghost"]]);
        if (choice === "cancel") { coll.value = current; return false; }
        if (choice === "other") {
          // the words open now stay exactly as they are, under their own key
          await save();
          state = { language: "", language_name: "", cards: [], reviews: [],
                    cloud: { ...settings, collection: name } };
          flash("Now press \u201cDownload words\u201d to fetch them.");
          return true;
        }
        // a rename: the same words, compared afresh with the named collection
        // (whose language is checked before anything is sent)
      }
    }
    state.cloud = { ...cloudSettings(), ...settings, collection: name,
                    ...(name !== current ? { ...NO_MARKERS, checked: "" } : {}) };
    await save();
    return true;
  }
  async function downloadWords() {
    if (!await persist()) return;
    try {
      flash("Fetching\u2026");
      const cfg = cloudSettings();
      if (!cfg.collection) throw new Error("Enter the collection name first.");
      const payload = await cloudFetchCollection(cfg);
      if (state.cards.length && payload.language && state.language &&
          payload.language !== state.language)
        throw new Error(`\u201c${cfg.collection}\u201d holds ` +
          `${payload.language_name || payload.language} words, but the words open here are ` +
          `${state.language_name || state.language}. Each language needs its own ` +
          "collection name; switch between them from the home screen.");
      await importFile(payload, true);     // quiet: the report comes below
      flash("Words loaded, catching up\u2026");
      await cloudSync(true);               // markers were cleared by the import
      const c = counts();
      notify(`Snapshot uploaded: ${(payload.exported_at || "?").replace("T", " ")}\n` +
             `Rows seen in the database: ${lastSync.seen}\n` +
             `Taken in: ${lastSync.took}\n\n` +
             `Due now: ${c.due}`, "Words loaded");
      home();
    } catch (e) { notify(e.message, "Could not download the words"); }
  }
  // the rarer actions, each with what it does
  const action = (name, title, detail, fn) =>
    listItem({ lead: icobox(name), title, detail, end: icon("chevron"), onTap: fn });
  const guarded = (fn, before) => async () => {
    if (!await persist()) return;
    try { if (before) flash(before); await fn(); }
    catch (e) { notify(e.message, "Sync failed"); }
  };

  if (!hasWords) {
    const files = el("div", "list");
    files.appendChild(action("file", "Load a file instead",
      "Exported from the desktop with \u201cExport collection for phone\u201d", () => pick(importFile)));
    coll.enterKeyHint = "go";
    coll.addEventListener("keydown", e => { if (e.key === "Enter") downloadWords(); });
    show([pageHead(cameFrom ? "Add a language" : "Download your words",
                   "Enter its collection name and the words come straight from the database."),
          conn, sectionHead("No sync?"), files], [
      button("Back", "back", () => cameFrom ? switchTo(cameFrom) : home()),
      button(icon("download") + "Download words", "primary grow", downloadWords)
    ]);
    if (!coll.value) setTimeout(() => coll.focus(), 60);
    return;
  }

  const syncNow = button(icon("sync") + "Sync now", "primary wide", async () => {
    if (!await persist()) return;
    syncNow.classList.add("busy");
    try { await cloudSync(true); flash("Synced."); cloudScreen(); }
    catch (e) { syncNow.classList.remove("busy"); notify(e.message, "Sync failed"); }
  });
  syncNow.style.marginBottom = "14px";
  const saveRow = button("Save settings", "soft wide", async () => {
    if (await persist()) { flash("Saved."); cloudScreen(); }
  });
  saveRow.style.marginTop = "16px";
  conn.appendChild(saveRow);

  const words = el("div", "list");
  words.appendChild(action("download", "Download words again",
    "When the workbook changed on the desktop", downloadWords));
  const files = el("div", "list");
  files.appendChild(action("upload", "Export my progress",
    "A small file for the desktop\u2019s Import progress", exportProgress));
  files.appendChild(action("file", "Import a file",
    "A collection or a progress file", () => pick(importFile)));
  const fixes = el("div", "list");
  fixes.appendChild(action("sync", "Full resync",
    "Compare every card again, when the two devices disagree",
    guarded(fullResync, "Comparing every card\u2026")));
  fixes.appendChild(action("download", "Take from database",
    "Replace this phone\u2019s progress with the database\u2019s", guarded(forcePull)));
  fixes.appendChild(action("upload", "Send mine up",
    "Replace the database\u2019s progress with this phone\u2019s", guarded(pushMine)));

  show([pageHead("Sync"), status, syncNow, conn,
        sectionHead("Words"), words, sectionHead("Files"), files,
        sectionHead("Fix a problem"), fixes], tabBar("sync"));
}

/* ------------------------------------------------------------------- sync */
function download(name, text) {
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportProgress() {
  const cards = {};
  for (const c of state.cards) {
    const entry = {
      stage: c.stage, box: c.box, meaning_box: c.mbox, meaning_marks: c.marks || 0,
      dir_flags: c.flags || 0, cloze_passes: c.cloze || 0, prod_passes: c.prod || 0,
      due: c.due, reviews: c.reviews || 0, correct: c.correct || 0,
      lapses: c.lapses || 0, suspended: c.suspended ? 1 : 0, updated_at: c.updated_at || ""
    };
    if (c.senses && c.senses.length) {
      entry.senses = {};
      for (const s of c.senses)
        entry.senses[s.gloss] = { box: s.box || 0, due: s.due || null, seen: s.seen || 0,
          recalled: s.recalled || 0, missed: s.missed || 0,
          last_review: s.last_review || null };
    }
    cards[c.w] = entry;
  }
  const payload = { format: 3, language: state.language,
    language_name: state.language_name, exported_at: nowStr(),
    cards, reviews: state.reviews.slice(-4000) };
  download(`lessico-${state.language}-phone.json`, JSON.stringify(payload));
}
function pick(handler) {
  const input = document.createElement("input");
  input.type = "file"; input.accept = ".json,application/json";
  input.addEventListener("change", () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { handler(JSON.parse(reader.result)); }
                            catch (e) { notify("That file could not be read: " + e.message); } };
    reader.readAsText(file);
  });
  input.click();
}
// everything about a card that is progress rather than dictionary
const PROGRESS = ["stage", "box", "mbox", "marks", "flags", "due", "reviews", "correct",
                  "lapses", "prod", "cloze", "suspended", "updated_at"];
function copyProgress(to, from) {
  for (const field of PROGRESS) if (from[field] !== undefined) to[field] = from[field];
}

async function importFile(payload, quiet) {
  await syncIdle();
  if (payload.kind === "collection" || Array.isArray(payload.cards)) {
    // Which collection the words go into. The one open now if it is the
    // same language; otherwise the one already on this phone for that
    // language; otherwise a new one. Never on top of a different language.
    const open = state || {};
    let base = (open.cards || []).length ? open : null;
    const carry = {};                       // settings typed in before any words
    for (const [k, v] of Object.entries(base ? {} : (open.cloud || {})))
      if (v !== "" && v !== undefined) carry[k] = v;
    let prefill = {};                       // for a brand-new collection only
    if (base && payload.language && base.language && payload.language !== base.language) {
      await save(base);
      if (base.cloud && base.cloud.url) prefill = { url: base.cloud.url, key: base.cloud.key };
      base = null;
    }
    if (!base) {
      const match = (await storedCollections()).find(c => c.s.language === payload.language &&
        (!carry.collection || !(c.s.cloud && c.s.cloud.collection) ||
         c.s.cloud.collection === carry.collection));
      if (match) base = match.s;
    }
    const keep = base ? new Map(base.cards.map(c => [c.w, c])) : new Map();
    // the settings must survive an import, and the sync markers must not: the
    // collection is a snapshot from whenever it was uploaded, so anything the
    // other device pushed between then and now still has to be pulled
    const cloud = { ...(base ? base.cloud : prefill), ...carry, ...NO_MARKERS, checked: "" };
    state = { id: base ? base.id : undefined,
              language: payload.language, language_name: payload.language_name,
              cards: payload.cards, reviews: (base && base.reviews) || [],
              // what was read here, and the words made here that the desktop
              // has not taken in yet, survive downloading the words again
              ...(base && base.reading ? { reading: base.reading } : {}),
              cloud };
    // a re-imported collection must not undo progress made here
    let kept = 0;
    const wordsOnly = !!payload.words_only;
    for (const card of state.cards) {
      const mine = keep.get(card.w);
      if (wordsOnly) {
        // the snapshot carries no progress at all, so anything known here is
        // kept and anything else waits for the sync to fill it in
        if (mine) {
          copyProgress(card, mine);
          kept++;
        } else {
          // no local copy and no progress in the snapshot. Defaults are a
          // guess until the sync speaks, so the card is marked and held back
          // from being pushed: uploading a guess with a fresh timestamp would
          // overwrite whatever the other device really has.
          Object.assign(card, { stage: 0, box: 1, mbox: 1, marks: 0, flags: 0,
            due: todayStr(), reviews: 0, correct: 0, lapses: 0, updated_at: "",
            fresh: true });
        }
      } else if (mine && (mine.updated_at || "") > (card.updated_at || "")) {
        copyProgress(card, mine);
        kept++;
      }
    }
    const inSnapshot = new Set(state.cards.map(c => c.w));
    for (const mine of keep.values())
      if (mine.manual && !inSnapshot.has(mine.w)) state.cards.push(mine);
    await save();
    if (!quiet)
      notify(`Loaded ${state.cards.length} ${state.language_name || ""} words.` +
            (kept ? ` ${kept} kept from this phone.` : ""));
    return quiet ? undefined : home();
  }
  if (!state || !state.cards.length)
    return notify("Load a full collection first, then progress files.");
  if (payload.language && state.language && payload.language !== state.language)
    return notify(`That progress file is for ${payload.language_name || payload.language}, ` +
                 `but the words open here are ${state.language_name || state.language}. ` +
                 "Switch language on the home screen first.");
  let updated = 0, skipped = 0;
  const byWord = new Map(state.cards.map(c => [c.w, c]));
  for (const [word, entry] of Object.entries(payload.cards || {})) {
    const card = byWord.get(word);
    if (!card) continue;
    if ((entry.updated_at || "") <= (card.updated_at || "")) { skipped++; continue; }
    card.stage = entry.stage; card.box = entry.box; card.mbox = entry.meaning_box;
    card.marks = entry.meaning_marks; card.flags = entry.dir_flags;
    card.due = entry.due; card.reviews = entry.reviews; card.correct = entry.correct;
    card.lapses = entry.lapses; card.prod = entry.prod_passes;
    if (entry.suspended !== undefined) card.suspended = entry.suspended ? 1 : 0;
    if (entry.cloze_passes !== undefined) card.cloze = entry.cloze_passes;
    card.updated_at = entry.updated_at;
    updated++;
  }
  const have = new Set(state.reviews.map(r => r[0] + "\u0000" + r[1]));
  for (const r of payload.reviews || [])
    if (!have.has(r[0] + "\u0000" + r[1])) state.reviews.push(r);
  await save();
  notify(`${updated} card(s) updated, ${skipped} already current.`);
  home();
}

/* ------------------------------------------------------------------ setup
   The first thing a new user sees, and what "Add a language" opens. */
function setup() {
  chrome(false);
  const begin = () => {
    if (!state) state = { language: "", language_name: "", cards: [], reviews: [] };
    cloudScreen();
  };
  const option = (cls, name, title, detail, fn) => {
    const b = button(icobox(name) + `<span class="body"><span class="title">${title}</span>` +
      `<span class="detail">${detail}</span></span>${icon("chevron")}`, "option " + cls, fn);
    return b;
  };

  const intro = el("div", "welcome");
  intro.appendChild(el("div", "mark", "L"));
  const title = el("h1", "", "Words that stay with you");
  intro.appendChild(title);
  const lead = el("div", "muted",
    "Lessico takes each word from first sight to using it in a sentence of your " +
    "own, and brings it back just before you would forget it.");
  intro.appendChild(lead);

  const perks = el("div", "list perks");
  for (const [name, colour, head, text] of [
    ["ladder", "var(--s2)", "A ladder for every word",
     "Sort, flashcards, meanings, gaps, translation and writing, one rung at a time."],
    ["wifi", "var(--s1)", "Works with no signal",
     "Study on a walk. Everything lives on the phone."],
    ["sync", "var(--s4)", "In step with the desktop",
     "Answers merge card by card, so the newer one always wins."]])
    perks.appendChild(listItem({ lead: icobox(name, colour), title: head, detail: text }));

  const choose = el("div");
  choose.appendChild(sectionHead("Get your words"));
  choose.appendChild(option("primary", "download", "Download from the database",
    "If sync is set up on the desktop", begin));
  choose.appendChild(option("", "file", "Load a file",
    "Exported with \u201cExport collection for phone\u201d", () => pick(importFile)));

  const others = el("div");
  show([intro, perks, choose, others], []);
  // a language added by mistake, or abandoned halfway, is one tap from the others
  storedCollections().then(list => {
    if (!list.length) return;
    title.textContent = "Add a language";
    lead.textContent = "Download its words from the database, or load a file from the desktop.";
    perks.remove();
    others.appendChild(sectionHead("Already on this phone"));
    const rows = el("div", "list");
    for (const entry of list) rows.appendChild(collectionRow(entry, false));
    others.appendChild(rows);
  }).catch(() => {});
}

quitBtn.addEventListener("click", () => {
  if (speech) speech.cancel();
  if (!play) save();                 // free practice changes nothing to save
  const to = quitTo || home;
  quitTo = null; play = null;
  to();
});
soundBtn.addEventListener("mousedown", event => {
  if (isField(document.activeElement)) event.preventDefault();
});

(async function boot() {
  await openDB();
  const key = await idbGet("last_open");
  const opened = key && await idbGet(key);
  state = opened || (await idbGet("collection")) || null;
  if (state && !state.reviews) state.reviews = [];
  // records saved before keys were fixed keep the key they were found under
  if (state && state.cards && state.cards.length) state.id = opened ? key : stateKey(state);
  const known = state && state.cloud;
  const kept = await idbGet("prefs");
  if (kept) prefs = { ...prefs, ...kept, voices: { ...(kept.voices || {}) },
                      practice: { ...(kept.practice || {}) } };
  autoSay = prefs.autoSay !== false;
  paintSound();
  connection = (await idbGet("connection")) ||
    (known && known.url && known.key
      ? { url: known.url, key: known.key, auto: !!known.auto } : connection);
  home();
  autoSync("opened");
  if ("serviceWorker" in navigator)
    navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
